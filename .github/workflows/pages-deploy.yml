name: Deploy Pages

on:
  workflow_dispatch:
  # The repository also has GitHub's branch-based Pages publisher. It uploads
  # committed HTML and can finish after the generated-site deployment. Rebuild
  # after that publisher (or the MGE snapshot build) completes so the last
  # deployment always uses current source data. This workflow does not trigger
  # itself, and always checks out main rather than the workflow_run event SHA.
  workflow_run:
    workflows: ['pages build and deployment', 'Build MGE Graph']
    types: [completed]
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'manifest.webmanifest'
      - '.github/workflows/pages-deploy.yml'
      - 'honeycombs/**'
      - '!honeycombs/fruits/mge/output/**'
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mandala-generated-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Mandala dashboards
        working-directory: honeycombs/fruits/mge
        run: python -m mge dashboard --output "${{ github.workspace }}/_site"

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v4

      - name: Wait for Pages artifact
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi

          for attempt in {1..13}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx -- "$ARTIFACT_ID"; then
              exit 0
            fi
            if (( attempt < 13 )); then
              echo "Pages artifact is not visible yet (check $attempt/13). Retrying in 5 seconds."
              sleep 5
            fi
          done

          echo "::error::Uploaded Pages artifact $ARTIFACT_ID did not become visible."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
