name: Deploy Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'engineer-chat.html'
      - '.github/workflows/pages-deploy.yml'
      - 'honeycombs/**'
      - '!honeycombs/fruits/mge/output/**'
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Mandala dashboards
        working-directory: honeycombs/fruits/mge
        run: python -m mge dashboard --output "${{ github.workspace }}/_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
