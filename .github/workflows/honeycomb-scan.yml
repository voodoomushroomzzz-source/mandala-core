name: Honeycomb Scanner

on:
  push:
    branches: [ main ]
    paths:
      - 'honeycombs/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin main
          echo "Repository synchronized"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Honeycomb Scanner
        run: |
          echo "Running honeycomb scanner..."
          python honeycombs/registry/honeycomb_scanner.py scan
          echo "Scan completed"

      - name: Generate scan report
        run: |
          python - <<'PYEOF'
          import json
          from datetime import datetime
          from pathlib import Path

          registry_path = Path("honeycombs/registry/index.json")
          if not registry_path.exists():
              print("registry/index.json not found, skipping report")
              exit(0)

          with open(registry_path, "r", encoding="utf-8-sig") as f:
              data = json.load(f)

          reg = data.get("content", {}).get("registry", {})
          stats = reg.get("statistics", {})
          health = reg.get("health_status", {})
          honeycombs = reg.get("honeycombs", [])
          validation_errors = health.get("validation_errors", [])

          total = stats.get("total_honeycombs", len(honeycombs))
          valid = stats.get("valid_v2", 0)
          invalid = stats.get("invalid_v2", 0)
          errors_count = total - valid if total > valid else 0

          now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          lines = [
              "# Honeycomb Scan Report  Mandala Symbiosis",
              "",
              f"**System:** Mandala Symbiosis",
              f"**Date:** {now}",
              f"**Scanner:** honeycomb_scanner.py",
              "",
              "## Statistics",
              "",
              "| Parameter | Value |",
              "|-----------|-------|",
              f"| Total honeycombs | {total} |",
              f"| Valid v2 | {valid} |",
              f"| Invalid v2 | {invalid} |",
              f"| Errors | {errors_count} |",
              f"| Total files | {stats.get('total_files', 0)} |",
              f"| Total size | {stats.get('total_size_kb', 0)} KB |",
              f"| Status | {health.get('status', 'unknown')} |",
              ""
          ]

          new_hc = health.get("new_honeycombs", [])
          if new_hc:
              lines += ["## New honeycombs", ""]
              for h in new_hc:
                  lines.append(f"- {h}")
              lines.append("")

          modified_hc = health.get("modified_honeycombs", [])
          if modified_hc:
              lines += ["## Modified honeycombs", ""]
              for h in modified_hc:
                  lines.append(f"- {h}")
              lines.append("")

          if validation_errors:
              lines += ["## Validation errors", ""]
              for e in validation_errors:
                  lines.append(f"### {e.get('honeycomb_id', '?')}  {e.get('name', '?')}")
                  for err in e.get("errors", []):
                      lines.append(f"-  {err}")
                  for warn in e.get("warnings", []):
                      lines.append(f"-  {warn}")
                  lines.append("")

          if honeycombs:
              lines += ["## Honeycomb structure", ""]
              for h in honeycombs:
                  lines.append(f"- {h.get('relative_path', h.get('honeycomb_id', '?'))}/")
              lines.append(f"\n**Total with index.json:** {len(honeycombs)}")

          lines += ["", "---", f"*Generated: {now}*"]

          Path("reports").mkdir(exist_ok=True)
          with open("reports/scan_report.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print(f"scan_report.md updated ({len(honeycombs)} honeycombs, {len(validation_errors)} errors)")
          PYEOF

      - name: Commit scan results
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add honeycombs/registry/index.json
          git add honeycombs/registry/scan_state.json || true
          git add reports/scan_report.md

          if git diff --staged --quiet; then
            echo "No changes after scan"
          else
            git commit -m "Auto-scan: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Scan results pushed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}