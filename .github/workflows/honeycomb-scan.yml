name: Honeycomb Scanner

on:
  push:
    branches: [ main ]
    paths:
      - 'honeycombs/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin main
          echo " Репозиторий синхронизирован"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pathlib2 2>/dev/null || true

      - name: Run Honeycomb Scanner
        run: |
          echo " Запуск сканера сот..."
          python honeycombs/registry/honeycomb_scanner.py scan
          echo " Сканирование завершено"

      - name: Generate scan report
        run: |
          python - <<'PYEOF'
          import json
          from datetime import datetime
          from pathlib import Path

          results_path = Path("honeycombs/registry/scan_results.json")
          if not results_path.exists():
              print("scan_results.json не найден  пропускаем отчёт")
              exit(0)

          with open(results_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})
          errors = data.get("validation_errors", [])
          now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          lines = [
              "# Honeycomb Scan Report  Mandala Simbioza",
              "",
              f"**Система:** Mandala Simbioza v1.2.0",
              f"**Дата:** {now}",
              f"**Сканер:** honeycomb_scanner.py v1.0.0",
              "",
              "## Статистика",
              "",
              "| Параметр | Значение |",
              "|----------|----------|",
              f"| Всего сот | {summary.get('total_honeycombs', 0)} |",
              f"| Валидных v2 | {summary.get('valid_v2', 0)} |",
              f"| Невалидных v2 | {summary.get('invalid_v2', 0)} |",
              f"| Ошибок | {summary.get('total_honeycombs', 0) - summary.get('valid_v2', 0)} |",
              f"| Всего файлов | {summary.get('total_files', 0)} |",
              f"| Общий размер | {summary.get('total_size_kb', 0)} KB |",
              f"| Статус | {summary.get('health_status', 'unknown')} |",
              "",
          ]

          if summary.get("new_honeycombs"):
              lines += ["## Новые соты", ""]
              for h in summary["new_honeycombs"]:
                  lines.append(f"- {h}")
              lines.append("")

          if summary.get("modified_honeycombs"):
              lines += ["## Изменённые соты", ""]
              for h in summary["modified_honeycombs"]:
                  lines.append(f"- {h}")
              lines.append("")

          if errors:
              lines += ["## Ошибки валидации", ""]
              for e in errors:
                  lines.append(f"### {e.get('honeycomb_id', '?')}  {e.get('name', '?')}")
                  for err in e.get("errors", []):
                      lines.append(f"-  {err}")
                  for warn in e.get("warnings", []):
                      lines.append(f"-  {warn}")
                  lines.append("")

          honeycombs = data.get("honeycombs", [])
          if honeycombs:
              lines += ["## Структура сот", ""]
              for h in honeycombs:
                  lines.append(f"- {h.get('relative_path', h.get('honeycomb_id', '?'))}/")
              lines.append(f"\n**Итого сот с index.json:** {len(honeycombs)}")

          lines += ["", f"---", f"*Сгенерировано: {now}*"]

          Path("reports").mkdir(exist_ok=True)
          with open("reports/scan_report.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print(f" scan_report.md обновлён ({len(honeycombs)} сот, {len(errors)} ошибок)")
          PYEOF

      - name: Commit scan results
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add honeycombs/registry/index.json
          git add honeycombs/registry/scan_results.json
          git add honeycombs/registry/scan_state.json || true
          git add reports/scan_report.md

          if git diff --staged --quiet; then
            echo " Нет изменений после сканирования"
          else
            git commit -m " Авто-сканирование сот $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo " Результаты сканирования запушены"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}