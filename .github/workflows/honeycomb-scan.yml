name: Honeycomb Scanner

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  push:
    branches: [main, develop]
    paths:
      - 'honeycombs/**'
      - 'Makefile'
      - 'requirements.txt'
      - '.github/workflows/honeycomb-scan.yml'
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Force full rescan'
        required: false
        default: true
        type: boolean

concurrency:
  group: honeycomb-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan and validate honeycombs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment
        run: make check

      - name: Scan honeycombs (always FORCE on push)
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force_rescan }}" = "true" ]; then
            FORCE_FLAG="FORCE=1"
          else
            FORCE_FLAG=""
          fi
          make scan $FORCE_FLAG

      - name: Validate honeycombs
        run: make validate

      - name: Generate report
        run: make report

      - name: Commit updated registry
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add honeycombs/registry/scan_state.json || true
          git add honeycombs/registry/index.json || true
          git add reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            HC=$(python3 -c "import os; print(sum(1 for r,d,f in os.walk('honeycombs') if 'index.json' in f))")
            git commit -m "auto: honeycomb scan ${TS} | ${HC} honeycombs (FORCE=1)"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
