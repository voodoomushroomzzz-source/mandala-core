name: Honeycomb Scan

on:
  schedule:
    # Каждое утро в 9:00 UTC (12:00 MSK)
    - cron: '0 9 * * *'
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml || true
      
      - name: Run honeycomb scanner
        run: |
          python honeycombs/registry/honeycomb_scanner.py scan --full-check --verbose
      
      - name: Check if registry changed
        id: check_changes
        run: |
          if git diff --quiet honeycombs/registry/scan_state.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add honeycombs/registry/registry.json honeycombs/registry/scan_state.json
          git commit -m "feat(registry): auto-scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)