name: Honeycomb Scanner

on:
  push:
    branches: [ main ]
    paths:
      - 'honeycombs/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin main
          echo "Repository synchronized"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Honeycomb Scanner
        run: |
          echo "Running honeycomb scanner..."
          python honeycombs/registry/honeycomb_scanner.py scan
          echo "Scan completed"

      - name: Commit scan results
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Stash any unstaged changes before pull
          git stash

          git add honeycombs/registry/registry.json
          git add honeycombs/registry/scan_state.json || true

          if git diff --staged --quiet; then
            echo "No changes after scan"
          else
            git commit -m "Auto-scan: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Scan results pushed"
          fi

          # Restore stashed changes
          git stash pop || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
