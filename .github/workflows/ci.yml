name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: ruff format .                # автоматическое форматирование
      - run: ruff check . --fix --exit-zero  # линтер не ломает билд
      # - run: mypy .                     # временно отключено (вернём позже)
      - run: pytest -v --suppress-no-test-exit-code  # не падает, если тестов нет
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
