name: Build Simbiosis Monolith

on:
  push:
    branches: [main]
    paths:
      - 'simbiosis/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build monolith
        run: python3 .github/scripts/build_monolith.py

      - name: Commit monolith
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simbiosis/monolith.json
          git diff --staged --quiet || git commit -m "🏗️ build: обновлён monolith.json [skip ci]"
          git push
