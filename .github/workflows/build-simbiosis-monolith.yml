name: Build Simbiosis Monolith

on:
  push:
    branches: [ main ]
    paths:
      - 'simbiosis/boot.json'
      - 'simbiosis/core_map.json'
      - 'simbiosis/engineer_chat.json'
      - 'simbiosis/philosophy.json'
      - 'simbiosis/roadmaps.json'
      - 'simbiosis/seeds.json'
      - 'simbiosis/telegram_bot.json'
      - 'build_simbiosis_monolith.py'
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git pull origin main
          echo "✅ Репозиторий синхронизирован"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Simbiosis Monolith
        id: build
        run: |
          echo "🔄 Запуск сборщика Simbiosis v1.0..."
          python build_simbiosis_monolith.py

          if [ ! -f "build/mandala_simbiosis.monolith.latest.json" ]; then
            echo "❌ Файл монолита не создан"
            exit 1
          fi

          echo "✅ Монолит Simbiosis успешно собран"
          echo "version=$(python -c "import json; data=json.load(open('build/mandala_simbiosis.monolith.latest.json')); print(data.get('version', 'unknown'))")" >> $GITHUB_OUTPUT

      - name: Commit and Push Monolith
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          mkdir -p build
          git add build/mandala_simbiosis.monolith.latest.json

          if git diff --staged --quiet; then
            echo "⚠️ Нет изменений в монолите"
          else
            VERSION="${{ steps.build.outputs.version }}"
            git commit -m "🤖 Авто-сборка Simbiosis монолита $VERSION"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ Simbiosis монолит запушен"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
