name: Kortix Automation

on:
  push:
    paths:
      - 'updates/*.json'
  
  workflow_dispatch:
    inputs:
      instruction_file:
        description: 'Путь к файлу инструкции'
        required: true
        default: 'updates/'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyGithub
        run: pip install PyGithub
      
      - name: Get instruction file
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # При ручном запуске используем указанный файл
            if [ "${{ github.event.inputs.instruction_file }}" == "updates/" ]; then
              # Если выбрана папка, берём самый новый файл
              FILE=$(ls -t updates/*.json 2>/dev/null | head -1)
              if [ -z "$FILE" ]; then
                echo "❌ Нет JSON файлов в папке updates/"
                exit 1
              fi
              echo "📁 Выбрана папка, берём самый новый: $FILE"
            else
              FILE="${{ github.event.inputs.instruction_file }}"
              echo "📁 Ручной режим: $FILE"
            fi
          else
            # При автоматическом запуске берём САМЫЙ НОВЫЙ файл
            FILE=$(ls -t updates/*.json 2>/dev/null | head -1)
            if [ -z "$FILE" ]; then
              echo "❌ Нет JSON файлов в папке updates/"
              exit 0  # Не ошибка, просто нечего делать
            fi
            echo "📁 Авто режим (самый новый): $FILE"
          fi
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "Selected file: $FILE"
          cat $FILE
      
      - name: Run Kortix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTRUCTION_FILE: ${{ env.FILE }}
        run: |
          python scripts/github_kortix.py -f $INSTRUCTION_FILE
