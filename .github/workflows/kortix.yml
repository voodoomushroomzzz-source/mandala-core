name: Kortix Automation

on:
  # Автоматический запуск при новом файле в updates/
  push:
    paths:
      - 'updates/*.json'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyGithub
        run: pip install PyGithub
      
      - name: Get latest instruction file
        run: |
          FILE=$(ls -t updates/*.json | head -1)
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "Found instruction file: $FILE"
      
      - name: Run Kortix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTRUCTION_FILE: ${{ env.FILE }}
        run: python scripts/github_kortix.py -f $INSTRUCTION_FILE
