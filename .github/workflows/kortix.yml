name: Kortix Automation

on:
  push:
    paths:
      - 'updates/*.json'
  
  workflow_dispatch:
    inputs:
      instruction_file:
        description: 'Path to instruction file'
        required: true
        default: 'updates/test.json'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyGithub
        run: pip install PyGithub
      
      - name: Get instruction file
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "FILE=${{ github.event.inputs.instruction_file }}" >> $GITHUB_ENV
          else
            echo "FILE=$(ls -t updates/*.json | head -1)" >> $GITHUB_ENV
          fi
          echo "Found: $FILE"
          cat $FILE
      
      - name: Run Kortix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTRUCTION_FILE: ${{ env.FILE }}
        run: |
          cd scripts
          python github_kortix.py -f ../$INSTRUCTION_FILE --config ../config.json
      
      - name: Auto-merge PR
        env:
          PR_URL: ${{ env.PR_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --merge $PR_URL || echo "Auto-merge not enabled"
