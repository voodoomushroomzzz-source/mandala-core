name: Kortix Automation

on:
  workflow_dispatch:
    inputs:
      instruction_file:
        description: 'Path to instruction file'
        required: true
        default: 'updates/test.json'
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyGithub
        run: pip install PyGithub
      
      - name: Run Kortix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running automation..."
          ls -la scripts/
          cat scripts/config.json
