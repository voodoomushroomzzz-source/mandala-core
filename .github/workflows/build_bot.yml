name: Build gentle_companion.py

on:
  push:
    paths:
      - 'honeycombs/fruits/gentle_companion/**.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build.py
        run: python honeycombs/fruits/gentle_companion/build.py

      - name: Syntax check gentle_companion.py
        run: python -c "import ast; ast.parse(open('gentle_companion.py',encoding='utf-8').read()); print('Syntax OK')"

      - name: Commit gentle_companion.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gentle_companion.py
          git diff --staged --quiet || git commit -m "auto: rebuild gentle_companion.py [skip ci]"
          git push
