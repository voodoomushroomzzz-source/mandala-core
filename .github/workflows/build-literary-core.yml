name: Build Literary Core

on:
  push:
    paths:
      - 'honeycombs/personal/poetry/**'
      - 'honeycombs/personal/poetry/index.json'
      - 'honeycombs/personal/poetry/poems/*.json'
      - 'honeycombs/personal/poetry/prose/*.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip

      - name: Run literary core build
        id: build
        run: |
          python3 honeycombs/personal/poetry/build_literary_core.py

      - name: Check if literary_core_boot.json changed
        id: check_changes
        run: |
          if git diff --quiet honeycombs/boot_online/literary_core_boot.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Mandala Bot"
          git config user.email "bot@mandala.symbiosis"
          git add honeycombs/boot_online/literary_core_boot.json
          git add honeycombs/personal/poetry/index.json
          git commit -m "chore: auto-build literary core — $(date +'%Y-%m-%d %H:%M')"
          git push
