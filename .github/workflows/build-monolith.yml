name: Build Mandala Monolith

on:
  push:
    branches: [ main ]
    paths:
      - 'initium.json'
      - 'sphaerae.json'
      - 'akasha_chronicorum.json'
      - 'philosophia.json'          # ⚡ ДОБАВЛЕНО
      - 'build_monolith.py'
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Monolith
        run: |
          echo "🔄 Запуск сборки..."
          python build_monolith.py
          
          if [ ! -f "build/mandala_core.monolith.latest.json" ]; then
            echo "❌ Файл не создан"
            exit 1
          fi
          
          echo "✅ Файл создан"
          ls -la build/

      - name: Commit Monolith
        run: |
          echo "🚀 Коммит..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          mkdir -p build
          git add build/
          
          VERSION=$(python -c "import json; data=json.load(open('build/mandala_core.monolith.latest.json')); print(data.get('version', 'unknown'))")
          git commit -m "🤖 Авто-сборка $VERSION" || echo "⚠️ Нет изменений"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
