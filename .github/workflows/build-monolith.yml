name: Build Mandala Monolith

on:
  push:
    branches: [ main ]
    paths:
      - 'initium.json'
      - 'sphaerae.json'
      - 'akasha_chronicorum.json'
      - 'build_monolith.py'
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Monolith
        run: |
          echo "🔄 Сборка монолита..."
          python build_monolith.py
          
          if [ ! -f "build/mandala_core.monolith.latest.json" ]; then
            echo "❌ Файл монолита не создан!"
            exit 1
          fi
          
          echo "✅ Файл монолита создан"

      - name: Validate JSON
        run: |
          echo "🔍 Проверка валидности JSON..."
          python -c "
          import json, sys
          try:
              with open('build/mandala_core.monolith.latest.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              print('✅ JSON валиден')
              
              # Проверяем обязательные поля
              required = ['module', 'version', 'runtime_mode', 'embedded_modules']
              for field in required:
                  if field not in data:
                      print(f'❌ Отсутствует обязательное поле: {field}')
                      sys.exit(1)
              
              # Проверяем ключевые модули
              embedded = data.get('embedded_modules', {})
              required_modules = ['Sphaerae', 'Akasha Chronicorum']
              for mod in required_modules:
                  if mod not in embedded:
                      print(f'❌ В монолите отсутствует ключевой модуль: {mod}')
                      sys.exit(1)
                  elif '_error' in embedded[mod]:
                      print(f'❌ Ошибка загрузки модуля {mod}: {embedded[mod][\"_error\"]}')
                      sys.exit(1)
              
              print(f'✅ Ключевые модули загружены')
              
          except Exception as e:
              print(f'❌ Ошибка: {e}')
              sys.exit(1)
          "

      - name: Commit and Push Monolith
        run: |
          echo "🚀 Коммит и пуш монолита..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Создаём папку build если её нет
          mkdir -p build
          
          # Добавляем файл монолита
          git add build/
          
          # Создаём сообщение коммита
          COMMIT_MSG="🤖 Авто-сборка монолита"
          COMMIT_MSG+="\n\nВерсия: $(date +'%Y-%m-%d %H:%M:%S UTC')"
          COMMIT_MSG+="\nSHA: ${{ github.sha }}"
          
          # Добавляем информацию о сборке
          if [ -f "build/mandala_core.monolith.latest.json" ]; then
            VERSION=$(python -c "import json; data=json.load(open('build/mandala_core.monolith.latest.json')); print(data.get('version', 'unknown'))")
            COMMIT_MSG+="\nВерсия монолита: $VERSION"
          fi
          
          git commit -m "$COMMIT_MSG" || echo "⚠️ Нет изменений для коммита"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
