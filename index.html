<head>

<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #21262d;
    --line: #30363d;
    --line-2: #484f58;
    --green: #3fb950;
    --green-bright: #56d364;
    --blue: #58a6ff;
    --violet: #a371f7;
    --yellow: #d29922;
    --orange: #ffa657;
    --text: #c9d1d9;
    --text-2: #8b949e;
    --text-3: #6e7681;
    --mono: 'Fira Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 40px 24px;
    line-height: 1.6;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 36px; text-align: center; }
  h1 {
    font-family: var(--mono);
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .subtitle {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--green-bright);
  }
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-2);
    margin: 32px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s ease;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.15);
  }
  .card:hover::before { opacity: 1; }
  .card-icon { font-size: 24px; margin-bottom: 10px; }
  .card h2 {
    font-size: 15px;
    color: var(--blue);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .card p {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.5;
  }
  .hub { display: grid; gap: 14px; }
  .ecosystem { padding: 0; }
  .ecosystem > summary { padding: 20px 48px 20px 20px; cursor: pointer; color: var(--blue); list-style: none; position: relative; }
  .ecosystem > summary::-webkit-details-marker { display: none; }
  .ecosystem > summary::after { content: '⌄'; position: absolute; right: 20px; top: 18px; transition: transform .15s; }
  .ecosystem[open] > summary::after { transform: rotate(180deg); }
  .ecosystem summary span { display: block; margin-top: 6px; color: var(--text-2); font-size: 13px; }
  .ecosystem .grid { padding: 0 14px 14px; }
  .ecosystem .card { background: var(--bg); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
  .card .badges {
    margin-top: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 8px;
    background: var(--surface-2);
    border-radius: 10px;
    color: var(--text-2);
    text-transform: uppercase;
  }
  .badge.green { background: rgba(63, 185, 80, 0.15); color: var(--green-bright); }
  .badge.blue { background: rgba(88, 166, 255, 0.15); color: var(--blue); }
  .badge.violet { background: rgba(163, 113, 247, 0.15); color: var(--violet); }
  .badge.orange { background: rgba(255, 166, 87, 0.15); color: var(--orange); }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-3);
    text-align: center;
  }
@media(min-width:660px){.hub{grid-template-columns:1fr 1fr}.ecosystem{grid-column:1/-1}}
</style>
</head>
<body>

      <a class="card" href="honeycombs/fruits/mge/output/mandala_graph.html">Карта Мандалы</a>
      <a class="card" href="honeycombs/fruits/mge/output/commands.html">Команды Мандалы</a>
      <a class="card" href="honeycombs/fruits/mge/output/fruits.html">Fruits · Продукты</a>
      <a class="card" href="honeycombs/fruits/mge/output/knowledge.html">Knowledge · База знаний</a>
    </div></details>
  </nav>


</div>
</body>
</html>
