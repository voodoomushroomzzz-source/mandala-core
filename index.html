<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ Mandala Engineer — MYCEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@300;400;500&family=Nunito:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <style>
        :root {
            --bg: #030d09;
            --surface: #071209;
            --surface-2: #0a1a10;
            --line: #0f2518;
            --line-2: #193a26;
            --green: #059669;
            --green-2: #10b981;
            --green-bright: #34d399;
            --green-neon: #6ee7b7;
            --green-glow: rgba(16,185,129,0.12);
            --violet: #7c3aed;
            --violet-soft: #a78bfa;
            --violet-dim: rgba(124,58,237,0.12);
            --indigo: #3730a3;
            --indigo-soft: #818cf8;
            --text: #dcfce7;
            --text-2: #5a8a6a;
            --text-3: #254535;
            --text-dim: #3a6a4a;
            --mono: 'Fira Mono', monospace;
            --sans: 'Nunito', sans-serif;
            --copy: #10b981;
            --download: #14b8a6;
            --apply: #a78bfa;
            --radius: 8px;
            --radius-sm: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Glow pools */
        .glow-pool {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }
        .gp-1 {
            width: 600px; height: 400px;
            top: -100px; right: -200px;
            background: radial-gradient(ellipse, rgba(16,185,129,0.1) 0%, transparent 70%);
            animation: pool-drift 20s ease-in-out infinite alternate;
        }
        .gp-2 {
            width: 400px; height: 400px;
            bottom: -100px; left: -100px;
            background: radial-gradient(ellipse, rgba(124,58,237,0.08) 0%, transparent 70%);
        }
        @keyframes pool-drift {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.15) translate(-20px, 15px); }
        }

        /* Flower of Life с анимированным градиентом */
        .bg-flower {
            position: fixed;
            right: -220px; top: 50%;
            transform: translateY(-50%);
            width: 700px; height: 700px;
            opacity: 0.35;
            pointer-events: none;
            animation: flower-breathe 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
        }
        .bg-flower circle {
            stroke-width: 0.6;
        }
        @keyframes flower-breathe {
            0% { opacity: 0.2; transform: translateY(-50%) scale(0.98); }
            50% { opacity: 0.45; transform: translateY(-50%) scale(1.02); }
            100% { opacity: 0.3; transform: translateY(-50%) scale(1.0); }
        }

        /* Header */
        .header {
            height: 52px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green), var(--violet), var(--indigo), transparent);
            opacity: 0.3;
        }

        .h-left { display: flex; align-items: center; gap: 14px; }

        .logo-mark { width: 34px; height: 34px; }
        .logo-mark svg { width: 34px; height: 34px; }

        .brand-text {
            display: flex; flex-direction: column; gap: 1px;
        }
        .brand-name {
            font-family: var(--mono);
            font-size: 11px; font-weight: 400;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: #ffffff;
        }
        .brand-sub {
            font-family: var(--mono);
            font-size: 7px; letter-spacing: 2px; text-transform: uppercase;
            color: #6ee7b7;
        }

        .h-right { display: flex; align-items: center; gap: 12px; }

        .model-display {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #a7f3d0;
            background: transparent;
            border: 1px solid #2d5a4a;
            padding: 5px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* Селектор моделей */
        .model-selector {
            display: flex;
            gap: 4px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--line-2);
            border-radius: 8px;
            padding: 3px;
        }
        .model-btn {
            width: 30px;
            height: 24px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.35;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .model-btn.active { opacity: 1; border-color: currentColor; }
        .grok-btn  { color: #10b981; }
        .grok-btn.active  { background: rgba(16,185,129,0.12); }
        .claude-btn { color: #4f46e5; }
        .claude-btn.active { background: rgba(79,70,229,0.12); }

        /* Метки моделей в сообщениях */
        .model-label {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 6px;
            opacity: 0.7;
            vertical-align: middle;
        }
        .model-label.grok   { color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .model-label.claude { color: #4f46e5; border: 1px solid rgba(79,70,229,0.3); }

        .commit-sha {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1.5px;
            color: var(--text-2);
            background: var(--surface-2);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--line-2);
            transition: all 0.4s ease;
            cursor: default;
        }
        .commit-sha.updated {
            color: var(--green-bright);
            border-color: var(--green-2);
            background: rgba(16,185,129,0.1);
            box-shadow: 0 0 10px rgba(16,185,129,0.2);
        }

        .vsep { width: 1px; height: 18px; background: var(--line); }

        .status-orb {
            display: flex; align-items: center; gap: 6px;
        }
        .orb-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green-2);
            box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3);
            animation: orb-pulse 3s ease-in-out infinite;
        }
        @keyframes orb-pulse {
            0%,100% { box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 6px var(--green-2), 0 0 10px rgba(16,185,129,0.15); }
        }
        .orb-label { display: none; }

        /* Layout */
        .layout { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }


        /* Content */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Tabs */
        .tabs {
            height: 42px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center;
            padding: 0 22px;
            flex-shrink: 0;
            gap: 2px;
        }
        .tab {
            font-family: var(--mono); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase;
            color: #5a8a6a;
            background: transparent; border: none;
            cursor: pointer; padding: 0 16px; height: 100%;
            display: flex; align-items: center;
            transition: color 0.15s; position: relative;
        }
        .tab:hover { color: #a7f3d0; }
        .tab.active {
            color: #6ee7b7;
            text-shadow: 0 0 5px #10b981;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 8px; right: 8px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green-2), transparent);
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 28px 22px 20px; /* уменьшен нижний отступ */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg {
            display: flex; gap: 13px;
            max-width: 82%;
            min-width: 0;
            animation: mup 0.28s ease;
        }
        @keyframes mup {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.sys { align-self: center; max-width: 90%; }

        .av { width: 36px; height: 36px; flex-shrink: 0; margin-top: 3px; }
        .av svg { width: 36px; height: 36px; }

        .mbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .mname {
            font-family: var(--mono); font-size: 8px;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-3);
        }
        .msg.user .mname { text-align: right; }

        .bub {
            padding: 12px 16px;
            font-size: 13.5px; line-height: 1.7; font-weight: 300;
            word-break: break-word;
            overflow-wrap: break-word;
            min-width: 0;
        }
        .msg.assistant .bub {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 2px 12px 12px 12px;
            border-left: 2px solid;
            border-image: linear-gradient(to bottom, #10b981, #7c3aed, #3730a3) 1;
            border-image-slice: 1;
        }
        .msg.user .bub {
            background: rgba(124,58,237,0.07);
            border: 1px solid rgba(124,58,237,0.18);
            border-radius: 12px 2px 12px 12px;
            white-space: pre-wrap;
        }
        .msg.sys .bub {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.4);
            color: #6ee7b7;
            text-shadow: 0 0 8px rgba(16,185,129,0.6);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
            border-radius: 6px;
            padding: 10px 16px;
        }

        /* Code blocks */
        .code-block {
            margin: 12px 0; 
            border: 1px solid var(--line-2); 
            border-radius: var(--radius);
            overflow: hidden; 
            background: var(--surface); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        .code-header {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 6px 12px; 
            background: var(--surface-2); 
            border-bottom: 1px solid var(--line-2);
        }
        .code-lang {
            font-family: var(--mono); 
            font-size: 11px; 
            color: var(--green-bright);
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .code-actions { 
            display: flex; 
            gap: 2px; 
            flex-shrink: 0;
            margin-left: auto;
        }
        .code-btn {
            width: 28px;
            height: 24px;
            background: var(--surface); 
            border: 1px solid var(--line-2);
            border-radius: var(--radius-sm); 
            font-size: 12px;
            font-family: var(--mono); 
            cursor: pointer; 
            transition: all 0.15s ease;
            display: flex; 
            align-items: center; 
            justify-content: center;
            line-height: 1; 
        }
        .code-btn.copy { 
            color: var(--copy); 
            border-color: var(--copy); 
        }
        .code-btn.copy:hover { 
            background: var(--copy); 
            color: var(--bg); 
            box-shadow: 0 0 12px var(--copy);
            transform: translateY(-1px);
        }
        .code-btn.download { 
            color: var(--download); 
            border-color: var(--download); 
        }
        .code-btn.download:hover { 
            background: var(--download); 
            color: var(--bg); 
            box-shadow: 0 0 12px var(--download);
            transform: translateY(-1px);
        }
        .code-btn.apply { 
            color: var(--apply); 
            border-color: var(--apply); 
        }
        .code-btn.apply:hover { 
            background: var(--apply); 
            color: var(--bg); 
            box-shadow: 0 0 12px var(--apply);
            transform: translateY(-1px);
        }

        .code-btn.toggle {
            color: var(--text-dim);
            border-color: var(--line-2);
            font-size: 10px;
            letter-spacing: 1px;
        }
        .code-btn.toggle:hover {
            background: var(--surface-2);
            color: var(--text);
            transform: translateY(-1px);
        }
        .code-block.collapsed .code-content {
            display: none;
        }
        .code-block.collapsed .code-header {
            border-bottom: none;
        }
        .code-lines-hint {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            margin-left: 8px;
            opacity: 0.6;
        }

        .code-content {
            padding: 12px; 
            overflow-x: auto; 
            overflow-y: auto;
            background: var(--surface);
            font-family: var(--mono); 
            font-size: 12px; 
            line-height: 1.6;
            color: var(--text); 
            max-height: 400px; 
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Thinking indicator — аватарка катается над инпутом */
        /* Thinking indicator */
        .thinking {
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 22px;
        }
        .thinking.hidden { display: none; }
        .thinking-inner {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .thinking-icon svg {
            width: 22px;
            height: 22px;
            animation: think-pulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 4px currentColor);
        }
        @keyframes think-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.15); }
        }
        .thinking-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--text-2);
        }
        .thinking-dots span {
            display: inline-block;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: var(--text-2);
            margin: 0 1px;
            animation: dot-bounce 1.2s ease-in-out infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40%            { transform: translateY(-4px); opacity: 1; }
        }

        /* Input area — всегда яркая */
        .input-area {
            padding: 6px 22px 18px;
            flex-shrink: 0;
        }
        .irow { display: flex; align-items: flex-end; gap: 10px; }

        .ibtn {
            width: 38px; height: 38px;
            background: rgba(16,185,129,0.1);
            border: 2px solid var(--green-2);
            color: var(--green-bright);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; border-radius: 10px;
            transition: all 0.2s;
        }
        .ibtn:hover { 
            background: var(--green-2);
            color: var(--bg);
            box-shadow: 0 0 20px var(--green-2);
            transform: scale(1.05);
        }

        .ifield {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--green-2);
            border-radius: 10px;
            color: var(--text);
            font-family: var(--sans); font-weight: 300; font-size: 14px;
            padding: 10px 15px; outline: none;
            resize: none; max-height: 120px; line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .ifield:focus {
            border-color: var(--violet-soft);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
            background: linear-gradient(145deg, var(--surface), rgba(124,58,237,0.05));
        }
        .ifield::placeholder { color: var(--text-3); }

        .isend {
            background: linear-gradient(145deg, var(--green), var(--violet));
            border: 2px solid transparent;
            color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
        }
        .isend:hover {
            background: linear-gradient(145deg, var(--green-2), var(--violet-soft));
            box-shadow: 0 4px 30px rgba(124,58,237,0.7);
        }

        /* Claude observer button */
        .observer-btn {
            background: rgba(59,130,246,0.1);
            border-color: #3b82f6;
            color: #93c5fd;
            font-size: 18px;
        }
        .observer-btn:hover {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 20px rgba(59,130,246,0.5);
        }
        .observer-btn.active {
            background: linear-gradient(145deg, #1d4ed8, #4f46e5);
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 20px rgba(59,130,246,0.6), 0 0 40px rgba(79,70,229,0.3);
            animation: observer-pulse 2s ease-in-out infinite;
        }
        @keyframes observer-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(59,130,246,0.6); }
            50% { box-shadow: 0 0 30px rgba(59,130,246,0.9), 0 0 50px rgba(79,70,229,0.4); }
        }

        /* Observer message bubble */
        .msg.observer .bub {
            background: rgba(59,130,246,0.07);
            border: 1px solid rgba(59,130,246,0.25);
            border-radius: 2px 12px 12px 12px;
            border-left: 2px solid;
            border-image: linear-gradient(to bottom, #3b82f6, #6366f1, #8b5cf6) 1;
            border-image-slice: 1;
        }
        .msg.observer .mname { color: #60a5fa; }
        .observer-thinking-indicator {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 22px;
            font-family: var(--mono); font-size: 10px;
            color: #60a5fa; opacity: 0.7;
            letter-spacing: 2px;
        }
        .observer-thinking-indicator .dots span {
            animation: dots 1.5s steps(4, end) infinite;
        }


        .file-attachment {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--line-2);
            border-radius: var(--radius-sm);
            margin: 0 22px 8px;
            font-size: 12px;
            color: var(--text);
        }
        .file-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-info .file-icon {
            font-size: 16px;
        }
        .file-info .file-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-info .file-percent {
            font-family: var(--mono);
            color: var(--green-bright);
            min-width: 40px;
            text-align: right;
        }
        .file-info .remove {
            cursor: pointer;
            color: var(--text-3);
        }
        .file-info .remove:hover { color: #f43f5e; }
        .file-progress {
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
        }
        .file-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--green-2), var(--violet-soft));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Resonance indicator */
        .resonance-indicator {
            display: none !important; /* скрыт */
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            margin: 0 22px 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }
        .resonance-indicator.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .resonance-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: linear-gradient(135deg, var(--green-2), var(--violet));
            flex-shrink: 0;
            animation: resonance-pulse 2s ease-in-out infinite;
        }
        @keyframes resonance-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .resonance-bar {
            flex: 1;
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .resonance-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green-2), var(--violet-soft));
            border-radius: 2px;
            transition: width 0.5s ease;
            position: relative;
        }
        .resonance-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .resonance-value {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--green-bright);
            min-width: 35px;
            text-align: right;
        }
        .resonance-level-low .resonance-fill {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }
        .resonance-level-medium .resonance-fill {
            background: linear-gradient(90deg, #14b8a6, var(--green-2));
        }
        .resonance-level-high .resonance-fill {
            background: linear-gradient(90deg, var(--green-2), var(--violet-soft));
        }

        /* File tree */
        #file-tree {
            width: 250px;
            border-right: 1px solid var(--line);
            overflow-y: auto;
            padding: 12px;

        .seed-badge { padding: 3px 8px; background: var(--surface-2); border-radius: var(--radius-sm); color: var(--text-2); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: var(--surface);
            border: 1px solid var(--line-2); border-radius: var(--radius); color: var(--text);
            font-size: 12px; z-index: 200; transform: translateY(100px); opacity: 0;

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: var(--green-2); color: var(--green-bright); }
        .toast.error { border-color: #f43f5e; color: #f43f5e; }

        /* Utilities */
        .hidden { display: none !important; }
        .tab-content { display: none; flex: 1; overflow: hidden; }
        .tab-content.active { display: flex; flex-direction: column; }
        code {
            font-family: var(--mono); font-size: 12px; background: var(--surface-2);
            padding: 2px 6px; border-radius: var(--radius-sm); color: var(--green-bright);
        }

        /* Text selection colors */
        /* Green — обычный текст ответа СР */
        .msg.assistant .bub::selection,
        .msg.assistant .bub *::selection { background: rgba(16,185,129,0.35); color: #dcfce7; }
        /* Violet — код и технические вставки */
        code::selection, pre::selection, pre *::selection,
        .code-content::selection, .code-content *::selection { background: rgba(124,58,237,0.4); color: #ede9fe; }
        /* Indigo — сообщения пользователя */
        .msg.user .bub::selection,
        .msg.user .bub *::selection { background: rgba(55,48,163,0.45); color: #e0e7ff; }
        /* Системные */
        .msg.sys .bub::selection { background: rgba(16,185,129,0.25); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--green); }
    </style>
</head>

        <script>
        // ==================== КОНСТАНТЫ ====================
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        const API_BASE = 'https://mandala-engineer-chat.onrender.com'; // базовый URL для API
        const GITHUB_REPO = 'voodoomushroomzzz-source/mandala-core';

        // Глобальные переменные
        let chats = [];
        let currentChatId = null;
        let nextChatId = 1;
        let ws = null;
        let pendingFiles = [];
        let messageBuffer = '';
        let currentMessageDiv = null;
        let currentPatch = null;
        let editor = null; // для Monaco

        // DOM элементы
        const statusDot = document.getElementById('statusDot');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const thinkingEl = document.getElementById('thinking');
        const seedsGrid = document.getElementById('seedsGrid');
        const filePreview = document.getElementById('filePreview');
        const fileNameEl = document.getElementById('fileName');
        const filePercentEl = document.getElementById('filePercent');
        const fileProgressBar = document.getElementById('fileProgressBar');
        const chatList = document.getElementById('chatList');
        const fileTree = document.getElementById('file-tree');
        const currentFilePath = document.getElementById('current-file-path');
        const saveFileBtn = document.getElementById('save-file-btn');

        // ==================== ИНИЦИАЛИЗАЦИЯ MONACO ====================
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                value: '// Выберите файл для редактирования',
                language: 'text',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });
        });

        // ==================== ЗАГРУЗКА ЧАТОВ ====================
        function loadChats() {
            const saved = localStorage.getItem('mandala_chats');
            if (saved) {
                try {
                    chats = JSON.parse(saved);
                    nextChatId = Math.max(...chats.map(c => parseInt(c.id.replace('chat_', ''))), 0) + 1;
                } catch (e) {
                    chats = [];
                }
            }
            renderChatList();
        }

        function saveChats() {
            localStorage.setItem('mandala_chats', JSON.stringify(chats));
            chats.forEach(chat => {
                if (chat.messages && chat.messages.length) {
                    localStorage.setItem(`chat_${chat.id}_messages`, JSON.stringify(chat.messages));
                }
            });
        }

        function renderChatList() {
            chatList.innerHTML = chats.map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="switchChat('${chat.id}')">
                    <span class="chat-item-title">${escapeHtml(chat.name)}</span>
                    <div class="chat-item-actions">
                        <button class="chat-item-action" onclick="renameChat('${chat.id}', event)">✎</button>
                        <button class="chat-item-action delete" onclick="deleteChat('${chat.id}', event)">×</button>
                    </div>
                </div>
            `).join('');
        }

        function createNewChat(name = null) {
            const defaultName = name || `Чат ${nextChatId}`;
            const chatId = 'chat_' + (nextChatId++);
            const newChat = { id: chatId, name: defaultName, created: Date.now(), messages: [] };
            chats.push(newChat);
            saveChats();
            renderChatList();
            switchChat(chatId);
        }

        function switchChat(chatId) {
            if (currentChatId === chatId) return;
            if (currentChatId) saveCurrentChatMessages();
            currentChatId = chatId;
            localStorage.setItem('current_chat_id', chatId);
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                const savedMessages = localStorage.getItem(`chat_${chatId}_messages`);
                chat.messages = savedMessages ? JSON.parse(savedMessages) : [];
                messagesEl.innerHTML = '';
                if (chat.messages.length > 0) {
                    chat.messages.forEach(msg => {
                        if (msg.role === 'user') addUserMessage(msg.content, false);
                        else if (msg.role === 'assistant') appendFullMessage(msg.content, false);
                        else if (msg.role === 'system') addSystemMessage(msg.content, false);
                    });
                } else {
                    addSystemMessage('🌱 Новый чат. Добро пожаловать!', false);
                }
                renderChatList();
            }
        }

        function saveCurrentChatMessages() {
            if (!currentChatId) return;
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                const messages = [];
                document.querySelectorAll('.msg').forEach(msgEl => {
                    const role = msgEl.classList.contains('user') ? 'user' : 
                                msgEl.classList.contains('sys') ? 'system' : 'assistant';
                    const content = msgEl.querySelector('.bub').innerText;
                    messages.push({ role, content });
                });
                chat.messages = messages;
                localStorage.setItem(`chat_${currentChatId}_messages`, JSON.stringify(messages));
            }
        }

        function renameChat(chatId, event) {
            event.stopPropagation();
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            document.getElementById('renameInput').value = chat.name;
            document.getElementById('renameModal').classList.add('active');
            document.getElementById('confirmRenameBtn').dataset.chatId = chatId;
        }

        function closeRenameModal() {
            document.getElementById('renameModal').classList.remove('active');
        }

        function confirmRename() {
            const chatId = document.getElementById('confirmRenameBtn').dataset.chatId;
            const newName = document.getElementById('renameInput').value.trim();
            if (!chatId || !newName) return;
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.name = newName;
                saveChats();
                renderChatList();
            }
            closeRenameModal();
        }

        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (chats.length <= 1) {
                showToast('Нельзя удалить последний чат', 'error');
                return;
            }
            const index = chats.findIndex(c => c.id === chatId);
            if (index !== -1) {
                localStorage.removeItem(`chat_${chatId}_messages`);
                chats.splice(index, 1);
                if (currentChatId === chatId) switchChat(chats[0].id);
                else renderChatList();
                saveChats();
            }
        }

        // ==================== WEBSOCKET ====================
        function connect() {
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'init', session_id: currentChatId }));
            ws.onmessage = (e) => { try { handleMessage(JSON.parse(e.data)); } catch (ex) { console.error(ex); } };
            ws.onclose = () => { updateStatus('error'); showToast('◈ соединение разорвано', 'error'); setTimeout(connect, 3000); };
            ws.onerror = () => updateStatus('error');
        }

        function updateStatus(state) {
            statusDot.className = 'orb-dot';
            if (state === 'connected') {
                statusDot.style.background = 'var(--green-2)';
                statusDot.style.boxShadow = '0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3)';
            } else if (state === 'connecting') {
                statusDot.style.background = 'var(--violet-soft)';
                statusDot.style.boxShadow = '0 0 8px var(--violet-soft)';
            } else {
                statusDot.style.background = '#f43f5e';
                statusDot.style.boxShadow = '0 0 12px #f43f5e';
            }
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    updateStatus('connected');
                    if (data.core_version) {
                        document.getElementById('coreVersion').textContent = `◈ ${data.core_version}`;
                    }
                    break;
                case 'core_updated':
                    const verEl = document.getElementById('coreVersion');
                    if (verEl && data.version) {
                        verEl.textContent = `◈ ${data.version}`;
                        verEl.classList.add('updated');
                        setTimeout(() => verEl.classList.remove('updated'), 3000);
                    }
                    showToast(`◈ Ядро обновлено: ${data.version || ''}`, 'success');
                    break;
                case 'history':
                    // Бэкенд восстановил сессию из GitHub — рендерим историю
                    // Пропускаем protected служебные сообщения (инъекция ядра)
                    messagesEl.innerHTML = '';
                    (data.messages || []).forEach(msg => {
                        if (msg.role === 'user') addUserMessage(msg.content, false);
                        else if (msg.role === 'assistant') appendFullMessage(msg.content, false);
                    });
                    scrollToBottom();
                    break;
                case 'system':
                    addSystemMessage(data.text);
                    break;
                case 'stream':
                    handleStream(data.content, data.model);
                    break;
                case 'model_start':
                    if (currentMessageDiv) finishMessage();
                    showThinking(data.model);
                    break;
                case 'model_done':
                    hideThinking();
                    finishMessage();
                    break;
                case 'done':
                    finishMessage();
                    break;
                case 'error':
                    showToast(data.text, 'error');
                    hideThinking();
                    finishMessage();
                    break;
                case 'module_direct':
                    showToast(`◈ модуль ${data.name} получен`, 'success');
                    const formatted = `**Модуль ${data.name}:**\n\`\`\`json\n${data.content}\n\`\`\``;
                    appendFullMessage(formatted, true);
                    break;
                case 'modules_refreshed':
                    showToast(`◈ обновлено ${data.count} модулей`, 'success');
                    break;
                case 'tool_use':
                    // Реальный статус: что СР делает прямо сейчас
                    updateThinkingStatus(data);
                    break;
                case 'file_processed':
                    fileNameEl.textContent = `✅ ${data.summary}`;
                    fileProgressBar.style.width = '100%';
                    filePercentEl.textContent = '100%';
                    addSystemMessage(data.summary);
                    // НЕ прячем thinking — СР сейчас начнёт отвечать
                    setTimeout(() => {
                        filePreview.classList.add('hidden');
                        fileProgressBar.style.width = '0%';
                    }, 2000);
                    break;
                case 'file_read_done':
                    // Файл прочитан → обновляем статус и сразу просим СР ответить
                    updateThinkingStatus({ tool: 'read_file', path: data.path, model: Array.from(activeModels)[0] });
                    addSystemMessage(`◈ ${escapeHtml(data.label || data.path)} прочитан (${(data.size||0).toLocaleString()} символов) — СР изучает`);
                    // Автоматически отправляем ask чтобы СР ответил без дублирования
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'ask',
                            text: `Ты только что прочитал файл ${escapeHtml(data.label || data.path)}. Изучи его и дай своё мнение: что это, какова структура, что важно знать.`,
                            session_id: currentChatId,
                            models: getActiveModels()
                        }));
                    }
                    break;
                case 'patch_result':
                    handlePatchResult(data.results);
                    break;
                case 'resonance':
                    updateResonance(data.value, data.level);
                    break;
                case 'pong':
                    break;
                case 'observer_state':
                    setObserverState(data.active);
                    break;
                case 'observer_thinking':
                    showObserverThinking();
                    break;
                case 'observer_message':
                    hideObserverThinking();
                    addObserverMessage(data.content, data.model || 'claude');
                    break;
                case 'observer_error':
                    hideObserverThinking();
                    showToast('◬ Claude-наблюдатель не ответил', 'error');
                    break;
            }
        }

        // ==================== СООБЩЕНИЯ ====================
        function createMessageElement(role, model = null) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            // Определяем иконку и имя строго по model, не переиспользуем предыдущее
            let iconSvg, name;
            if (role === 'user') {
                iconSvg = '<svg viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="13" stroke="#7c3aed" stroke-width="0.8" opacity="0.4"/><circle cx="15" cy="15" r="6" stroke="#7c3aed" stroke-width="0.8" fill="rgba(124,58,237,0.08)"/><circle cx="15" cy="15" r="2" fill="#a78bfa" opacity="0.6"/></svg>';
                name = 'вы';
            } else if (model && modelIcons[model]) {
                iconSvg = modelIcons[model];
                name = modelNames[model] || 'СР';
            } else {
                // дефолт для assistant без модели — Грок
                iconSvg = modelIcons['grok'];
                name = 'СР';
            }
            if (model) div.dataset.model = model;
            div.innerHTML = `
                <div class="av">${iconSvg}</div>
                <div class="mbody">
                    <div class="mname">${name}</div>
                    <div class="bub"></div>
                </div>
            `;
            return div;
        }

        function addUserMessage(text, save = true) {
            const div = createMessageElement('user');
            // Детектируем файловые сообщения из истории
            const fileMatch = text.match(/^\[Файл загружен: (.+?)\]\n```[\s\S]*$/);
            const fileMatchSimple = text.match(/^\[Загружен файл: (.+?)\]$/);
            const patchMatch = text.match(/^\[Патч: (.+?)\]$/);
            const commentMatch = text.match(/^\[Комментарий к файлу (.+?)\]: ([\s\S]*)$/);
            const coreMatch = text.match(/^\[ЯДРО МАНДАЛЫ ЗАГРУЖЕНО\]/);
            const observerMatch = text.match(/^\[Комментарий внешнего наблюдателя Claude/);
            
            if (coreMatch || observerMatch) {
                // Системные инъекции — не показываем
                return;
            } else if (fileMatch || fileMatchSimple) {
                const fname = (fileMatch && fileMatch[1]) || (fileMatchSimple && fileMatchSimple[1]);
                div.querySelector('.bub').innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--green-bright);">📎 ${escapeHtml(fname)}</span>`;
            } else if (patchMatch) {
                div.querySelector('.bub').innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);border:1px solid rgba(167,139,250,0.3);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--violet-soft);">📦 ${escapeHtml(patchMatch[1])}</span>`;
            } else if (commentMatch) {
                div.querySelector('.bub').textContent = commentMatch[2] || text;
            } else {
                div.querySelector('.bub').textContent = text;
            }
            messagesEl.appendChild(div);
            scrollToBottom();
            if (save) saveCurrentChatMessages();
        }

        function addSystemMessage(text, save = true) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.innerHTML = `<div class="bub">${text}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
            if (save) saveCurrentChatMessages();
        }

        function appendFullMessage(text, save = true) {
            const div = createMessageElement('assistant');
            let html = escapeHtml(text);
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => renderCodeBlock(lang, code, true));
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--green-bright);">$1</strong>');
            html = html.replace(/\n/g, '<br>');
            div.querySelector('.bub').innerHTML = html;
            messagesEl.appendChild(div);
            scrollToBottom();
            if (save) saveCurrentChatMessages();
        }

        function handleStream(content, model) {
            if (!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant', model || 'grok');
                if (model) {
                    const nameEl = currentMessageDiv.querySelector('.mname');
                    const color = modelColors[model] || 'var(--green-bright)';
                    const label = `<span class="model-label ${model}">${modelNames[model] || model}</span>`;
                    nameEl.innerHTML = label;
                    nameEl.style.color = color;
                }
                messagesEl.appendChild(currentMessageDiv);
            }
            messageBuffer += content;
            const bub = currentMessageDiv.querySelector('.bub');
            let html = escapeHtml(messageBuffer);
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => renderCodeBlock(lang, code, true));
            html = html.replace(/```(\w*)\n([\s\S]*)$/, (match, lang, code) => {
                if (!messageBuffer.includes('```', messageBuffer.lastIndexOf('```')+3)) return renderCodeBlock(lang, code, false);
                return match;
            });
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--green-bright);">$1</strong>');
            html = html.replace(/\n/g, '<br>');
            bub.innerHTML = html;
            scrollToBottom();
        }

        function finishMessage() {
            hideThinking();
            if (currentMessageDiv) {
                saveCurrentChatMessages();
                currentMessageDiv = null;
                messageBuffer = '';
            }
        }

        function renderCodeBlock(lang, code, complete) {
            const copyBtnClass = 'code-btn copy';
            const downloadBtnClass = 'code-btn download';
            const applyBtnClass = 'code-btn apply';
            const lineCount = (code.match(/\n/g) || []).length + 1;
            const shouldCollapse = complete; // всегда свёрнут по умолчанию
            const collapsedClass = shouldCollapse ? 'collapsed' : '';
            const toggleBtn = complete
                ? `<button class="code-btn toggle" onclick="toggleCodeBlock(this)" title="Развернуть/свернуть">${shouldCollapse ? '▶' : '▼'}</button>`
                : '';
            const linesHint = complete
                ? `<span class="code-lines-hint">${lineCount} lines</span>`
                : '';
            const actions = complete ? `
                <div class="code-actions">
                    ${toggleBtn}
                    <button class="${copyBtnClass}" onclick="copyCodeFromBlock(this)" title="Копировать">◈</button>
                    <button class="${downloadBtnClass}" onclick="downloadCodeFromBlock(this)" title="Скачать">↓</button>
                    ${lang === 'json' ? `<button class="${applyBtnClass}" onclick="preparePatchFromBlock(this)" title="Применить патч">△</button>` : ''}
                </div>
            ` : '';
            return `
                <div class="code-block ${complete ? 'complete' : 'streaming'} ${collapsedClass}">
                    <div class="code-header">
                        <span class="code-lang">${lang || 'code'}</span>
                        ${linesHint}
                        ${actions}
                    </div>
                    <pre class="code-content">${escapeHtml(code)}</pre>
                </div>
            `;
        }

        window.toggleCodeBlock = function(btn) {
            const block = btn.closest('.code-block');
            const isCollapsed = block.classList.toggle('collapsed');
            btn.innerHTML = isCollapsed ? '▶' : '▼';
        };

        // Декодирование HTML-сущностей
        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        window.downloadCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const rawCode = block.querySelector('.code-content').textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            const lang = block.querySelector('.code-lang').textContent || 'txt';
            const blob = new Blob([decodedCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('◈ файл скачан', 'success');
        };

        window.copyCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            // Используем innerText вместо textContent + decodeHtmlEntities
            // innerText корректно сохраняет переносы строк из <pre>
            const code = block.querySelector('.code-content').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✓';
                showToast('◈ код скопирован', 'success');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1000);
            }).catch(err => {
                showToast('◈ ошибка копирования', 'error');
                console.error('Copy failed:', err);
            });
        };

        window.preparePatchFromBlock = function(btn) {
            const codeElement = btn.closest('.code-block').querySelector('.code-content');
            const rawCode = codeElement.textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            try {
                JSON.parse(decodedCode);
                currentPatch = decodedCode;
                document.getElementById('patchPreviewContent').textContent = decodedCode;
                document.getElementById('confirmPatchBtn').disabled = false;
                openPatchModal();
                showToast('◈ патч подготовлен', 'success');
            } catch(e) {
                showToast('◈ невалидный JSON: ' + e.message, 'error');
            }
        };

        // ==================== ОТПРАВКА СООБЩЕНИЙ ====================
        function sendMessage() {
            const text = inputEl.value.trim();
            if (pendingFiles.length > 0) {
                sendFiles(pendingFiles, text);
                clearFiles();
                inputEl.value = '';
                autoHeight();
                return;
            }
            if (!text) return;
            addUserMessage(text);
            inputEl.value = '';
            autoHeight();
            showThinking(Array.from(activeModels)[0]);
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения с сервером', 'error');
                hideThinking();
                return;
            }
            ws.send(JSON.stringify({ type: 'ask', text: text, session_id: currentChatId, models: getActiveModels() }));
        }

        async function sendFiles(files, caption) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            if (caption.trim()) addUserMessage(caption);
            showThinking(Array.from(activeModels)[0]);

            // Показываем индикатор загрузки
            filePreview.classList.remove('hidden');
            fileProgressBar.style.width = '0%';
            filePercentEl.textContent = '0%';

            let completed = 0;
            for (const file of files) {
                // Обновляем имя текущего файла
                fileNameEl.textContent = `⏳ ${file.name}`;

                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        ws.send(JSON.stringify({
                            type: 'file',
                            name: file.name,
                            content: e.target.result.split(',')[1],
                            file_type: file.type || 'application/octet-stream',
                            caption: inputEl.value.trim(),
                            session_id: currentChatId,
                            models: getActiveModels()
                        }));
                        completed++;
                        const percent = Math.round((completed / files.length) * 100);
                        fileProgressBar.style.width = percent + '%';
                        filePercentEl.textContent = percent + '%';
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
                await new Promise(r => setTimeout(r, 100));
            }

            // Показываем "ожидаем подтверждения от сервера"
            fileNameEl.textContent = `✓ ${files.map(f => f.name).join(', ')}`;
            saveCurrentChatMessages();

            // Прячем через 4 сек (к этому времени file_processed уже придёт)
            setTimeout(() => {
                filePreview.classList.add('hidden');
                fileProgressBar.style.width = '0%';
                filePercentEl.textContent = '0%';
            }, 4000);
        }

        // ==================== ФАЙЛЫ ====================
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            // Если текст в поле есть — показываем превью и ждём кнопки
            // Если текст пустой — сразу отправляем файл (СР сам знает что делать)
            if (inputEl.value.trim()) {
                pendingFiles = files;
                updateFilePreview();
                inputEl.focus();
            } else {
                pendingFiles = files;
                updateFilePreview();
                // Небольшой delay чтобы пользователь видел что файл принят
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        sendFiles(files, '');
                        clearFiles();
                    }
                }, 300);
            }
        }

        function updateFilePreview() {
            if (pendingFiles.length === 0) {
                filePreview.classList.add('hidden');
                return;
            }
            const names = pendingFiles.map(f => f.name).join(', ');
            fileNameEl.textContent = names;
            filePreview.classList.remove('hidden');
            fileProgressBar.style.width = '0%';
            filePercentEl.textContent = '0%';
        }

        function clearFiles() {
            pendingFiles = [];
            document.getElementById('fileInput').value = '';
            // Не прячем filePreview здесь — он скроется сам после подтверждения сервера
        }

        function setupDragDrop() {
            document.addEventListener('dragover', e => { e.preventDefault(); document.body.style.boxShadow = 'inset 0 0 50px var(--violet-dim)'; });
            document.addEventListener('dragleave', e => { if(e.target===document.body) document.body.style.boxShadow = ''; });
            document.addEventListener('drop', e => {
                e.preventDefault();
                document.body.style.boxShadow = '';
                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    if (inputEl.value.trim()) {
                        pendingFiles = files;
                        updateFilePreview();
                        inputEl.focus();
                    } else {
                        pendingFiles = files;
                        updateFilePreview();
                        setTimeout(() => {
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                sendFiles(files, '');
                                clearFiles();
                            }
                        }, 300);
                    }
                }
            });
        }

        // ==================== ВКЛАДКА ФАЙЛОВ ====================
        async function loadFileTree() {
            fileTree.innerHTML = 'Загрузка...';
            try {
                const response = await fetch(`${API_BASE}/api/tree`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const tree = buildTree(data.tree);
                fileTree.innerHTML = renderTree(tree);
                document.querySelectorAll('#file-tree .file').forEach(el => {
                    el.addEventListener('click', () => {
                        document.querySelectorAll('#file-tree .file').forEach(f => f.classList.remove('selected'));
                        el.classList.add('selected');
                        loadFile(el.dataset.path);
                    });
                });
            } catch (err) {
                fileTree.innerHTML = `❌ Ошибка загрузки: ${err.message}`;
            }
        }

        function buildTree(files) {
            const root = {};
            files.forEach(file => {
                if (file.type !== 'blob') return;
                const parts = file.path.split('/');
                let current = root;
                parts.forEach((part, i) => {
                    if (i === parts.length - 1) {
                        current[part] = { type: 'file', path: file.path };
                    } else {
                        if (!current[part]) current[part] = { type: 'dir', children: {} };
                        current = current[part].children;
                    }
                });
            });
            return root;
        }

        function renderTree(node, level = 0) {
            if (node.type === 'file') {
                const ext = node.path.split('.').pop();
                return `<div class="file file ${ext}" data-path="${node.path}" style="padding-left: ${level * 16 + 16}px">${node.path.split('/').pop()}</div>`;
            }
            let html = '';
            Object.keys(node).forEach(key => {
                if (key === 'type') return;
                const child = node[key];
                if (child.type === 'dir') {
                    html += `<div class="folder" style="padding-left: ${level * 16}px">${key}</div>`;
                    html += renderTree(child.children, level + 1);
                } else {
                    html += renderTree(child, level + 1);
                }
            });
            return html;

        async function loadFile(path) {
            currentFilePath.textContent = path;
            saveFileBtn.disabled = false;
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${path}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const content = await response.text();
                const ext = path.split('.').pop();
                const language = ext === 'json' ? 'json' : ext === 'py' ? 'python' : ext === 'html' ? 'html' : ext === 'js' ? 'javascript' : 'text';
                monaco.editor.setModelLanguage(editor.getModel(), language);
                editor.setValue(content);
                localStorage.setItem(`orig_${path}`, content);
                // Уведомляем СР об открытом файле
                addSystemMessage(`📁 Открыт файл: ${path}`, true);
            } catch (err) {
                editor.setValue(`// Ошибка загрузки: ${err.message}`);
            }
        }

        function saveCurrentFile() {
            const path = currentFilePath.textContent;
            if (!path) return;
            const content = editor.getValue();
            const patch = { file_path: path, content: content };
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'apply_patch', patch: patch, session_id: currentChatId }));
                showToast('◈ изменения отправлены', 'success');
                localStorage.setItem(`orig_${path}`, content);
            } else {
                showToast('◈ нет соединения', 'error');
            }
        }

            results.forEach(r => addSystemMessage(`◈ ${r.status==='success'?'✓':'✗'} ${r.file||r.module}: ${r.message}`));
        }

        // ==================== БЫСТРЫЕ ДЕЙСТВИЯ ====================
        function quickAction(action) {
            if (action === 'files') sendDirectMessage('/tree');
            else if (action === 'forget') {
                if (confirm('Очистить историю этого чата?')) {
                    messagesEl.innerHTML = '';
                    addSystemMessage('◈ история забыта');
                    saveCurrentChatMessages();
                }
            }
        }

        function sendDirectMessage(text) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            addUserMessage(text);
            showThinking(Array.from(activeModels)[0]);
            ws.send(JSON.stringify({ type: 'ask', text: text, session_id: currentChatId, models: getActiveModels() }));
        }

        // ==================== TOAST ====================
        function showToast(msg, type='success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==================== АНИМАЦИЯ ЦВЕТКА ЖИЗНИ ====================
        function animateFlowerGradient() {
            const grad = document.getElementById('livingGradient');
            if (!grad) return;
            let angle = 0;
            function step() {
                angle += 0.005;
                const x = 0.5 + 0.5 * Math.sin(angle);
                const y = 0.5 + 0.5 * Math.cos(angle);
                grad.setAttribute('x1', x);
                grad.setAttribute('y1', y);
                grad.setAttribute('x2', 1 - x);
                grad.setAttribute('y2', 1 - y);
                requestAnimationFrame(step);
            }
            step();
        }

        // ==================== ЗАПУСК ====================
        function init() {
            loadChats();
            if (chats.length === 0) createNewChat('Основной чат');
            else {
                const lastActive = localStorage.getItem('current_chat_id');
                if (lastActive && chats.find(c => c.id === lastActive)) switchChat(lastActive);
                else switchChat(chats[0].id);
            }
            connect();
            setupTabs();
            setupKeyboard();
            setupDragDrop();
            animateFlowerGradient();
        }

        init();
    </script>
</body>
</html>
