<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ Mandala Engineer</title>
    <style>
        /* ===== COSMIC GEOMETRY ===== */
        :root {
            --void: #050508;
            --deep: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a25;
            --border: #252533;
            --border-glow: #3a3a55;
            
            --star: #e8e8f0;
            --nebula: #a855f7;
            --nebula-dim: #7c3aed;
            --nebula-glow: #c084fc;
            --cosmos: #581c87;
            
            --pulse: #22d3ee;
            --pulse-dim: #0891b2;
            
            --font-mono: 'SF Mono', 'JetBrains Mono', Monaco, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            --radius: 8px;
            --radius-sm: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--void);
            color: var(--star);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            height: 48px;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--nebula), var(--cosmos));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 12px var(--nebula-dim);
        }

        .header-title {
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: var(--star);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Навигация в хедере */
        .header-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--border-glow);
            font-size: 11px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            color: var(--star);
            background: var(--surface);
        }

        .nav-btn.active {
            color: var(--nebula-glow);
            background: var(--surface);
            box-shadow: inset 0 -2px 0 var(--nebula);
        }

        /* Индикатор — просто светящаяся точка */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            box-shadow: 0 0 4px currentColor;
            transition: all 0.3s ease;
            margin-left: 12px;
        }

        .status-dot.connected {
            background: var(--pulse);
            box-shadow: 0 0 12px var(--pulse), 0 0 20px var(--pulse-dim);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .status-dot.connecting {
            background: var(--nebula);
            box-shadow: 0 0 8px var(--nebula);
            animation: pulse-glow 1s ease-in-out infinite;
        }

        .status-dot.error {
            background: #ef4444;
            box-shadow: 0 0 12px #ef4444;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        /* Геометрические кнопки */
        .btn-geo {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--border-glow);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .btn-geo:hover {
            color: var(--nebula-glow);
            background: var(--surface);
            text-shadow: 0 0 8px var(--nebula);
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 200px;
            background: var(--deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-section {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--border-glow);
            margin-bottom: 8px;
            padding-left: 8px;
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .module-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            color: var(--border-glow);
            transition: all 0.15s ease;
            font-family: var(--font-mono);
        }

        .module-item:hover {
            background: var(--surface);
            color: var(--star);
        }

        .module-item.active {
            background: linear-gradient(90deg, var(--cosmos), transparent);
            color: var(--nebula-glow);
            border-left: 2px solid var(--nebula);
        }

        .module-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--void);
        }

        /* ===== CHAT ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fade-in 0.3s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--border-glow);
            font-family: var(--font-mono);
        }

        .message-bubble {
            padding: 12px 14px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--cosmos), var(--nebula-dim));
            color: var(--star);
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.15);
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.assistant .message-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            align-self: center;
            max-width: 80%;
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--border-glow);
            font-size: 11px;
            text-align: center;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* ===== CODE BLOCKS (ИНТЕРАКТИВНЫЕ) ===== */
        .code-block {
            margin: 12px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--deep);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .code-lang {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--nebula-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-actions {
            display: flex;
            gap: 6px;
        }

        .code-btn {
            padding: 4px 10px;
            background: var(--deep);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--border-glow);
            font-size: 10px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-btn:hover {
            border-color: var(--nebula);
            color: var(--nebula-glow);
            background: var(--surface-hover);
        }

        .code-btn.apply {
            border-color: var(--pulse-dim);
            color: var(--pulse);
        }

        .code-btn.apply:hover {
            background: var(--pulse-dim);
            color: var(--void);
            box-shadow: 0 0 12px var(--pulse);
        }

        .code-content {
            padding: 12px;
            overflow-x: auto;
            background: var(--deep);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--star);
            max-height: 400px;
            overflow-y: auto;
        }

        /* Подсветка синтаксиса (минимальная) */
        .code-content .key { color: var(--nebula-glow); }
        .code-content .string { color: #22d3ee; }
        .code-content .number { color: #f59e0b; }
        .code-content .bool { color: #ec4899; }
        .code-content .null { color: #6b7280; }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 12px 16px;
            background: var(--deep);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--star);
            font-size: 14px;
            outline: none;
            transition: all 0.15s ease;
            font-family: var(--font-sans);
        }

        .message-input:focus {
            border-color: var(--nebula);
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.1);
        }

        .message-input::placeholder {
            color: var(--border-glow);
        }

        .message-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Кнопки геометрические */
        .btn-attach {
            width: 36px;
            height: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--border-glow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.15s ease;
        }

        .btn-attach:hover {
            border-color: var(--nebula);
            color: var(--nebula-glow);
        }

        .btn-send {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--nebula), var(--nebula-dim));
            border: none;
            border-radius: var(--radius);
            color: var(--star);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--nebula-glow);
            font-size: 12px;
            font-family: var(--font-mono);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--nebula);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
            box-shadow: 0 0 8px var(--nebula);
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== MODULE VIEWER ===== */
        .module-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .module-toolbar {
            height: 40px;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .module-name {
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--nebula-glow);
            font-family: var(--font-mono);
        }

        .module-actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 4px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--border-glow);
            font-size: 11px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-sm:hover {
            border-color: var(--nebula);
            color: var(--nebula-glow);
        }

        .module-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
            background: var(--void);
        }

        .module-content pre {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--star);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--border-glow);
            gap: 12px;
        }

        .empty-state-icon {
            width: 48px;
            height: 48px;
            background: var(--surface);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--border);
        }

        /* ===== SEEDS ===== */
        .seeds-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .seeds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .seed-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .seed-card:hover {
            border-color: var(--nebula);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.1);
        }

        .seed-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .seed-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--star);
        }

        .seed-id {
            font-size: 10px;
            color: var(--border-glow);
            font-family: var(--font-mono);
        }

        .seed-desc {
            font-size: 12px;
            color: var(--border-glow);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .seed-meta {
            display: flex;
            gap: 6px;
            font-size: 10px;
        }

        .seed-badge {
            padding: 3px 8px;
            background: var(--deep);
            border-radius: var(--radius-sm);
            color: var(--border-glow);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== PATCH CONFIRMATION MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--nebula-glow);
            font-family: var(--font-mono);
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: var(--border-glow);
            cursor: pointer;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .modal-close:hover {
            color: var(--star);
            background: var(--deep);
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
        }

        .patch-preview-box {
            background: var(--deep);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            max-height: 200px;
            overflow: auto;
        }

        .patch-preview-box pre {
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.5;
            color: var(--star);
            margin: 0;
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background: var(--deep);
            color: var(--border-glow);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--nebula);
            color: var(--star);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--nebula), var(--nebula-dim));
            color: var(--star);
        }

        .btn-primary:hover {
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--star);
            font-size: 12px;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            font-family: var(--font-mono);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--pulse); color: var(--pulse); }
        .toast.error { border-color: #ef4444; color: #ef4444; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-glow);
        }

        /* ===== UTILITIES ===== */
        .hidden { display: none !important; }
        
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Inline code */
        code {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--deep);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            color: var(--nebula-glow);
        }

        /* File attachment indicator */
        .file-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--border-glow);
        }

        .file-attachment .remove {
            margin-left: auto;
            cursor: pointer;
            color: var(--border-glow);
        }

        .file-attachment .remove:hover {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">◈</div>
            <div class="header-title">MANDALA ENGINEER</div>
        </div>
        <div class="header-right">
            <!-- Навигация в хедере вместо отдельной секции -->
            <nav class="header-nav">
                <button class="nav-btn active" data-tab="chat">◈ чат</button>
                <button class="nav-btn" data-tab="modules">◈ модули</button>
                <button class="nav-btn" data-tab="incubae">◈ семена</button>
                <button class="nav-btn" onclick="quickAction('milestones')">◈ вехи</button>
                <button class="nav-btn" onclick="quickAction('status')">◉ статус</button>
            </nav>
            <button class="btn-geo" onclick="refreshModules()" title="Обновить">↻</button>

    <!-- Patch Modal -->
    <div class="modal-overlay" id="patchModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">◈ ПРИМЕНИТЬ ПАТЧ</div>
                <button class="modal-close" onclick="closePatchModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="patch-preview-box" id="patchPreviewBox">
                    <pre id="patchPreviewContent">загрузите JSON-патч...</pre>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePatchModal()">отмена</button>
                <button class="btn btn-primary" id="confirmPatchBtn" onclick="confirmPatch()" disabled>применить</button>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".json,.txt,.md" style="display: none" onchange="handleFileSelect(event)">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- JavaScript -->
    <script>
        // ===== CONFIG =====
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        
        // Session ID
        const SESSION_ID = localStorage.getItem('mc_session') || (() => {
            const id = 'mc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            localStorage.setItem('mc_session', id);
            return id;
        })();

        // ===== STATE =====
        let ws = null;
        let currentModule = null;
        let modulesCache = {};
        let currentPatch = null;
        let pendingFile = null;
        
        // Streaming state
        let messageBuffer = '';
        let currentMessageDiv = null;
        let codeBuffer = '';
        let inCodeBlock = false;
        let codeLanguage = '';

        // ===== DOM =====
        const statusDot = document.getElementById('statusDot');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const moduleContentEl = document.getElementById('moduleContent');
        const moduleNameEl = document.getElementById('moduleName');
        const filePreview = document.getElementById('filePreview');
        const fileNameEl = document.getElementById('fileName');

        // ===== INITIALIZATION =====
        function init() {
            connect();
            setupTabs();
            setupModules();
            setupKeyboard();
            setupDragDrop();
        }

        // ===== WEBSOCKET =====
        function connect() {
            updateStatus('connecting');
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'init',
                    session_id: SESSION_ID
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onclose = () => {
                updateStatus('error');
                disableInput();
                showToast('◈ соединение разорвано', 'error');
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (e) => {
                console.error('WebSocket error:', e);
                updateStatus('error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    updateStatus('connected');
                    enableInput();
                    addSystemMessage(`◈ соединение установлено [${data.session_id}]`);
                    addSystemMessage(`◈ модулей загружено: ${data.modules_loaded?.length || 0}`);
                    break;
                    
                case 'history':
                    messagesEl.innerHTML = '';
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            if (msg.role === 'user') {
                                addUserMessage(msg.content);
                            } else if (msg.role === 'assistant') {
                                appendFullMessage(msg.content);
                            }
                        });
                    }
                    scrollToBottom();
                    break;
                    
                case 'system':
                    addSystemMessage(data.text);
                    break;
                    
                case 'stream':
                    handleStream(data.content);
                    break;
                    
                case 'done':
                    finishMessage();
                    break;
                    
                case 'error':
                    showToast(data.text, 'error');
                    hideTyping();
                    finishMessage();
                    break;
                    
                case 'module_direct':
                    displayModule(data.name, data.content);
                    addSystemMessage(`◈ модуль ${data.name} получен`);
                    break;
                    
                case 'modules_refreshed':
                    showToast(`◈ обновлено ${data.count} модулей`, 'success');
                    break;
                    
                case 'file_processed':
                    addSystemMessage(data.summary);
                    break;
                    
                case 'patch_result':
                    handlePatchResult(data.results);
                    break;
                    
                case 'pong':
                    break;
            }
        }

        // ===== STREAMING WITH LIVE TYPING =====
        function handleStream(content) {
            if (!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant');
                messagesEl.appendChild(currentMessageDiv);
            }
            
            messageBuffer += content;
            
            // Parse code blocks on the fly
            const parsed = parseStreamingContent(messageBuffer);
            currentMessageDiv.querySelector('.message-bubble').innerHTML = parsed;
            
            scrollToBottom();
        }

        function parseStreamingContent(text) {
            // Simple markdown parser that handles code blocks
            let html = escapeHtml(text);
            
            // Handle complete code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return renderCodeBlock(lang, code, true);
            });
            
            // Handle incomplete code blocks (still streaming)
            html = html.replace(/```(\w*)\n([\s\S]*)$/, (match, lang, code) => {
                if (!text.includes('```', text.lastIndexOf('```') + 3)) {
                    return renderCodeBlock(lang, code, false);
                }
                return match;
            });
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--nebula-glow);">$1</strong>');
            
            // Newlines
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        function renderCodeBlock(lang, code, complete) {
            const actions = complete ? `
                <div class="code-actions">
                    <button class="code-btn" onclick="copyCodeFromBlock(this)">⎘ копировать</button>
                    <button class="code-btn" onclick="downloadCodeFromBlock(this)">↓ скачать</button>
                    ${lang === 'json' ? '<button class="code-btn apply" onclick="preparePatchFromBlock(this)">△ применить</button>' : ''}
                </div>
            ` : '';
            
            return `
                <div class="code-block ${complete ? 'complete' : 'streaming'}">
                    <div class="code-header">
                        <span class="code-lang">${lang || 'code'}</span>
                        ${actions}
                    </div>
                    <pre class="code-content">${escapeHtml(code)}</pre>
                </div>
            `;
        }

        function finishMessage() {
            hideTyping();
            
            // Final parse to ensure all code blocks are interactive
            if (currentMessageDiv) {
                const bubble = currentMessageDiv.querySelector('.message-bubble');
                let html = bubble.innerHTML;
                
                // Ensure all code blocks have proper actions
                bubble.querySelectorAll('.code-block').forEach(block => {
                    if (!block.querySelector('.code-actions')) {
                        const lang = block.querySelector('.code-lang')?.textContent || '';
                        const code = block.querySelector('.code-content')?.textContent || '';
                        if (lang && code) {
                            block.outerHTML = renderCodeBlock(lang, code, true);
                        }
                    }
                });
            }
            
            currentMessageDiv = null;
            messageBuffer = '';
        }

        function appendFullMessage(text) {
            const div = createMessageElement('assistant');
            let html = escapeHtml(text);
            
            // Parse complete message
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return renderCodeBlock(lang, code, true);
            });
            
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--nebula-glow);">$1</strong>');
            html = html.replace(/\n/g, '<br>');
            
            div.querySelector('.message-bubble').innerHTML = html;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ===== CODE BLOCK ACTIONS =====
        window.copyCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const code = block.querySelector('.code-content').textContent;
            navigator.clipboard.writeText(code);
            showToast('◈ код скопирован', 'success');
        };

        window.downloadCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const code = block.querySelector('.code-content').textContent;
            const lang = block.querySelector('.code-lang').textContent || 'txt';
            
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('◈ файл скачан', 'success');
        };

        window.preparePatchFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const code = block.querySelector('.code-content').textContent;
            
            try {
                const json = JSON.parse(code);
                currentPatch = code;
                
                document.getElementById('patchPreviewContent').textContent = JSON.stringify(json, null, 2);
                document.getElementById('confirmPatchBtn').disabled = false;
                
                openPatchModal();
                showToast('◈ патч подготовлен к применению', 'success');
            } catch (e) {
                showToast('◈ невалидный JSON', 'error');
            }
        };

        // ===== MESSAGING =====
        function sendMessage() {
            const text = inputEl.value.trim();
            
            // Если есть прикреплённый файл
            if (pendingFile) {
                sendFile(pendingFile, text);
                clearFile();
                inputEl.value = '';
                return;
            }
            
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            addUserMessage(text);
            inputEl.value = '';
            showTyping();
            
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function sendFile(file, caption = '') {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            
            showTyping();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result.split(',')[1]; // base64
                
                ws.send(JSON.stringify({
                    type: 'file',
                    name: file.name,
                    content: content,
                    type: file.type,
                    caption: caption,
                    session_id: SESSION_ID
                }));
                
                addSystemMessage(`◈ файл ${file.name} отправлен`);
            };
            reader.readAsDataURL(file);
        }

        // ===== FILE HANDLING =====
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            pendingFile = file;
            fileNameEl.textContent = file.name;
            filePreview.classList.remove('hidden');
            
            // Фокус на ввод для добавления комментария
            inputEl.focus();
        }

        function clearFile() {
            pendingFile = null;
            filePreview.classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        // ===== DRAG & DROP =====
        function setupDragDrop() {
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                document.body.style.boxShadow = 'inset 0 0 50px var(--nebula-dim)';
            });

            document.addEventListener('dragleave', (e) => {
                if (e.target === document.body) {
                    document.body.style.boxShadow = '';
                }
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                document.body.style.boxShadow = '';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    pendingFile = files[0];
                    fileNameEl.textContent = pendingFile.name;
                    filePreview.classList.remove('hidden');
                    inputEl.focus();
                }
            });
        }

        // ===== UI HELPERS =====
        function createMessageElement(role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const icon = role === 'user' ? '◉' : role === 'assistant' ? '◈' : '○';
            
            div.innerHTML = `
                <div class="message-header">${icon} ${role === 'user' ? 'вы' : role === 'assistant' ? 'СР' : 'система'}</div>
                <div class="message-bubble"></div>
            `;
            return div;
        }

        function addUserMessage(text) {
            const div = createMessageElement('user');
            div.querySelector('.message-bubble').textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== STATUS & INPUT =====
        function updateStatus(state) {
            statusDot.className = 'status-dot ' + state;
        }

        function enableInput() {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function disableInput() {
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        function showTyping() {
            typingEl.classList.remove('hidden');
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.classList.add('hidden');
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ===== TABS =====
        function setupTabs() {
            // Хедер-навигация
            document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabName = btn.dataset.tab;
                    
                    document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tabName}`).classList.add('active');
                    
                    if (tabName === 'incubae') loadSeeds();
                });
            });
        }

        // ===== MODULES =====
        function setupModules() {
            document.querySelectorAll('.module-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.module-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    const name = item.dataset.module;
                    requestModule(name);
                    // Переключаем на вкладку модулей
                    document.querySelector('.nav-btn[data-tab="modules"]').click();
                });
            });
        }

        function requestModule(name) {
            currentModule = name;
            
            if (modulesCache[name]) {
                displayModule(name, modulesCache[name]);
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'module',
                    name: name,
                    session_id: SESSION_ID
                }));
            }
        }

        function displayModule(name, content) {
            modulesCache[name] = content;
            currentModule = name;
            
            moduleNameEl.innerHTML = `<span>○</span><span>${name}</span>`;
            
            let displayContent;
            try {
                const parsed = JSON.parse(content);
                displayContent = JSON.stringify(parsed, null, 2);
            } catch {
                displayContent = content;
            }
            
            moduleContentEl.innerHTML = `<pre style="color: var(--star);">${escapeHtml(displayContent)}</pre>`;
        }

        function downloadModule() {
            if (!currentModule || !modulesCache[currentModule]) {
                showToast('◈ сначала выберите модуль', 'error');
                return;
            }
            
            const blob = new Blob([modulesCache[currentModule]], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentModule}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('◈ модуль скачан', 'success');
        }

        function copyModule() {
            if (!currentModule || !modulesCache[currentModule]) {
                showToast('◈ сначала выберите модуль', 'error');
                return;
            }
            
            navigator.clipboard.writeText(modulesCache[currentModule]);
            showToast('◈ модуль скопирован', 'success');
        }

        // ===== SEEDS =====
        async function loadSeeds() {
            const grid = document.getElementById('seedsGrid');
            grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">○</div><div>загрузка...</div></div>';
            
            try {
                const response = await fetch('https://raw.githubusercontent.com/voodoomushroomzzz-source/mandala-core/main/incubae.json');
                if (!response.ok) throw new Error('ошибка');
                
                const data = await response.json();
                const seeds = data.seeds || [];
                
                if (!seeds.length) {
                    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">○</div><div>нет семян</div></div>';
                    return;
                }
                
                grid.innerHTML = seeds.map(seed => `
                    <div class="seed-card" onclick="askAboutSeed('${seed.id}')">
                        <div class="seed-header">
                            <div class="seed-title">${escapeHtml(seed.name || 'без названия')}</div>
                            <div class="seed-id">${seed.id}</div>
                        </div>
                        <div class="seed-desc">${escapeHtml(seed.description || '')}</div>
                        <div class="seed-meta">
                            <span class="seed-badge">${seed.version || 'v1.0'}</span>
                            <span class="seed-badge">${seed.status || 'active'}</span>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">×</div><div>${err.message}</div></div>`;
            }
        }

        window.askAboutSeed = function(seedId) {
            sendDirectMessage(`Расскажи о семени ${seedId}`);
            // Возвращаемся в чат
            document.querySelector('.nav-btn[data-tab="chat"]').click();
        };

        // ===== PATCH MODAL =====
        function openPatchModal() {
            document.getElementById('patchModal').classList.add('active');
        }

        function closePatchModal() {
            document.getElementById('patchModal').classList.remove('active');
            currentPatch = null;
            document.getElementById('confirmPatchBtn').disabled = true;
            document.getElementById('patchPreviewContent').textContent = 'загрузите JSON-патч...';
        }

        function confirmPatch() {
            if (!currentPatch || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            try {
                const patch = JSON.parse(currentPatch);
                
                ws.send(JSON.stringify({
                    type: 'apply_patch',
                    patch: patch,
                    session_id: SESSION_ID
                }));
                
                closePatchModal();
                showToast('◈ патч отправлен', 'success');
                addSystemMessage('◈ применение патча...');
                
            } catch (e) {
                showToast('◈ ошибка патча', 'error');
            }
        }

        function handlePatchResult(results) {
            results.forEach(r => {
                const status = r.status === 'success' ? '✓' : '✗';
                addSystemMessage(`◈ ${status} ${r.module}: ${r.message}`);
            });
        }

        // ===== QUICK ACTIONS =====
        function quickAction(action) {
            switch(action) {
                case 'seeds':
                    sendDirectMessage('Покажи активные семена из incubae');
                    break;
                case 'milestones':
                    sendDirectMessage('Покажи последние milestones из Akasha');
                    break;
                case 'status':
                    sendDirectMessage('Статус системы');
                    break;
            }
        }

        function sendDirectMessage(text) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            addUserMessage(text);
            showTyping();
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function refreshModules() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            ws.send(JSON.stringify({
                type: 'refresh_modules',
                session_id: SESSION_ID
            }));
            showToast('◈ обновление модулей', 'success');
        }

        // ===== KEYBOARD =====
        function setupKeyboard() {
            inputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // ===== TOAST =====
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== START =====
        init();
    </script>
</body>
</html>
