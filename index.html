<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala — инженерный чат</title>
    <style>
        /* ===== ГЕОМЕТРИЧЕСКИЙ МИНИМАЛИЗМ ===== */
        :root {
            --bg-deep: #0a0c10;
            --bg-surface: #11131f;
            --bg-surface-hover: #1a1b2e;
            --border-subtle: #252842;
            --border-glow: #3e4a7a;
            --accent-primary: #6b4f8c;
            --accent-secondary: #4a3a6b;
            --text-primary: #e0e0ff;
            --text-muted: #7a7ab3;
            --success: #5fbb7a;
            --warning: #c99b5f;
            --error: #bf5f6f;
            
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            
            --shadow-glow: 0 0 15px rgba(107, 79, 140, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            letter-spacing: 0.2px;
            font-weight: 400;
            transition: opacity 0.2s;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            height: 60px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-primary);
            border: 1px solid var(--border-glow);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .logo span {
            transform: rotate(-45deg);
        }

        .header-title {
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            width: 12px;
            height: 12px;
            border-radius: 0;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status.connected { 
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            border-radius: 0;
            transform: rotate(45deg);
        }
        
        .status.connecting { 
            background: var(--warning);
            animation: pulse 1.5s infinite;
            border-radius: 50%;
        }
        
        .status.error { 
            background: var(--error);
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        /* ===== ПАНЕЛЬ КОМАНД (СВЕРХУ) ===== */
        .commands-panel {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .command-card {
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }

        .command-card:hover {
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        .command-icon {
            font-size: 18px;
            color: var(--accent-primary);
        }

        .command-info {
            flex: 1;
        }

        .command-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .command-key {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* ===== ОСНОВНОЙ ЛЭЙАУТ ===== */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== ЦЕНТРАЛЬНАЯ ЧАСТЬ (ЧАТ) ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-deep);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .message-bubble {
            padding: 12px 18px;
            line-height: 1.6;
            font-size: 14px;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .message-bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
        }

        .message.user .message-bubble::after {
            content: '◈';
            position: absolute;
            bottom: -8px;
            right: 12px;
            color: var(--border-glow);
            font-size: 12px;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.assistant .message-bubble {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .message.assistant .message-bubble::before {
            content: '△';
            position: absolute;
            top: -8px;
            left: 12px;
            color: var(--border-subtle);
            font-size: 12px;
        }

        .message.system {
            align-self: center;
            max-width: 60%;
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 8px;
            border: none;
            font-style: italic;
        }

        /* Код в сообщениях */
        .code-block {
            margin-top: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-deep);
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .code-actions {
            display: flex;
            gap: 8px;
        }

        .code-action {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .code-action:hover {
            border-color: var(--border-glow);
            color: var(--text-primary);
            background: var(--bg-surface-hover);
        }

        .code-content {
            padding: 12px;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            background: var(--bg-deep);
            white-space: pre-wrap;
        }

        /* Таблицы */
        .message table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            border: 1px solid var(--border-subtle);
        }

        .message th {
            background: var(--bg-surface);
            padding: 8px 12px;
            text-align: left;
            font-weight: 500;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-glow);
        }

        .message td {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .message tr:last-child td {
            border-bottom: none;
        }

        /* ===== ОБЛАСТЬ ВВОДА ===== */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
        }

        .input-area::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .message-input:focus {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
        }

        .message-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
        }

        .action-btn:hover {
            border-color: var(--border-glow);
            color: var(--accent-primary);
            background: var(--bg-surface-hover);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            border-color: var(--border-glow);
            color: var(--accent-primary);
            background: var(--bg-surface-hover);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== ПРАВАЯ ПАНЕЛЬ МОДУЛЕЙ ===== */
        .modules-panel {
            width: 280px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .modules-panel-title {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .module-card {
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .module-card:hover {
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        .module-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .module-card-icon {
            font-size: 20px;
            color: var(--accent-primary);
        }

        .module-card-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .module-card-blocks {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .module-block-item {
            font-size: 12px;
            padding: 6px 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .module-block-item:hover {
            border-color: var(--border-glow);
            color: var(--text-primary);
        }

        /* ===== КАРТОЧКИ ДАННЫХ (ДЛЯ КОМАНД) ===== */
        .data-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-deep);
        }

        .data-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            transition: all 0.2s;
        }

        .data-card:hover {
            border-color: var(--border-glow);
        }

        .data-card-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .data-card-content {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .data-card-meta {
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 8px;
        }

        /* ===== ТИПИНГ ===== */
        .typing {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(1) { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .typing-dot:nth-child(2) { clip-path: circle(50% at 50% 50%); animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); transform: rotate(180deg); animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== ТОСТЫ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            font-size: 12px;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }

        /* ===== СКРОЛЛБАР ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-glow);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="header-left">
            <div class="logo"><span>◈</span></div>
            <div class="header-title">/engineer</div>
        </div>
        <div class="header-right">
            <button class="btn-icon" onclick="refreshModules()" title="обновить модули">↻</button>
            <div class="status" id="status"></div>
        </div>
    </header>

    <!-- Панель команд (сверху) -->
    <div class="commands-panel">
        <div class="command-card" onclick="showSeeds()">
            <span class="command-icon">○</span>
            <div class="command-info">
                <div class="command-name">семена</div>
                <div class="command-key">/seeds</div>
            </div>
        </div>
        <div class="command-card" onclick="showMilestones()">
            <span class="command-icon">◈</span>
            <div class="command-info">
                <div class="command-name">вехи</div>
                <div class="command-key">/milestones</div>
            </div>
        </div>
        <div class="command-card" onclick="showStatus()">
            <span class="command-icon">◉</span>
            <div class="command-info">
                <div class="command-name">статус</div>
                <div class="command-key">/status</div>
            </div>
        </div>
        <div class="command-card" onclick="showModulesList()">
            <span class="command-icon">□</span>
            <div class="command-info">
                <div class="command-name">модули</div>
                <div class="command-key">/modules</div>
            </div>
        </div>
        <div class="command-card" onclick="showHelp()">
            <span class="command-icon">?</span>
            <div class="command-info">
                <div class="command-name">помощь</div>
                <div class="command-key">/help</div>
            </div>
        </div>
    </div>

    <!-- Основная часть -->
    <div class="main">
        <!-- Чат (центр) -->
        <div class="content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message system">
                        <div class="message-bubble">
                            установка соединения...
                        </div>
                    </div>
                </div>
                
                <div class="typing hidden" id="typing">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span>ср печатает</span>
                </div>
                
                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="сообщение..."
                            disabled
                        >
                    </div>
                    <div class="input-actions">
                        <button class="action-btn" onclick="document.getElementById('fileUpload').click()" title="загрузить файл">📎</button>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель модулей -->
        <div class="modules-panel" id="modulesPanel">
            <div class="modules-panel-title">модули</div>
            <div id="modulesList"></div>
            <!-- Сюда будут подгружаться карточки модулей -->
        </div>
    </div>

    <!-- Скрытый input для загрузки файлов -->
    <input type="file" id="fileUpload" style="display: none" onchange="uploadFile(this)">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== КОНФИГУРАЦИЯ =====
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        const API_URL = 'https://mandala-engineer-chat.onrender.com';
        const GITHUB_RAW = 'https://raw.githubusercontent.com/voodoomushroomzzz-source/mandala-core/main';
        
        const SESSION_ID = localStorage.getItem('mc_session') || (() => {
            const id = 'mc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            localStorage.setItem('mc_session', id);
            return id;
        })();

        // ===== СОСТОЯНИЕ =====
        let ws = null;
        let modulesCache = {};
        let currentMessageDiv = null;
        let messageBuffer = '';

        // ===== DOM =====
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const modulesPanelEl = document.getElementById('modulesPanel');

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        function init() {
            connect();
            setupModulesPanel();
            setupDragAndDrop();
        }

        // ===== WEBSOCKET =====
        function connect() {
            updateStatus('connecting');
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'init',
                    session_id: SESSION_ID
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onclose = () => {
                updateStatus('error');
                disableInput();
                showToast('соединение разорвано', 'error');
                setTimeout(connect, 3000);
            };
            
            ws.onerror = () => {
                updateStatus('error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    updateStatus('connected');
                    enableInput();
                    addSystemMessage(`соединение установлено [${data.session_id}]`);
                    addSystemMessage(`модулей: ${data.modules_loaded?.length || 0}`);
                    break;
                    
                case 'history':
                    messagesEl.innerHTML = '';
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            if (msg.role === 'user') {
                                addUserMessage(msg.content);
                            } else if (msg.role === 'assistant') {
                                appendAssistantMessage(msg.content);
                            }
                        });
                    } else {
                        addSystemMessage('новая сессия');
                    }
                    scrollToBottom();
                    break;
                    
                case 'system':
                    addSystemMessage(data.text);
                    break;
                    
                case 'stream':
                    handleStream(data.content);
                    break;
                    
                case 'done':
                    finishMessage();
                    break;
                    
                case 'error':
                    showToast(data.text, 'error');
                    hideTyping();
                    break;
                    
                case 'module_direct':
                    // Показываем модуль в чате (но можно и в панель, но пока оставим)
                    appendAssistantMessage(`📦 модуль ${data.name}:\n\`\`\`json\n${data.content}\n\`\`\``);
                    break;
                    
                case 'modules_refreshed':
                    showToast(`обновлено ${data.count} модулей`, 'success');
                    break;
                    
                case 'file_processed':
                    addSystemMessage(data.summary);
                    break;
                    
                case 'pong':
                    break;
            }
        }

        // ===== СООБЩЕНИЯ =====
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            addUserMessage(text);
            inputEl.value = '';
            showTyping();
            
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function handleStream(content) {
            if (!currentMessageDiv) {
                currentMessageDiv = document.createElement('div');
                currentMessageDiv.className = 'message assistant';
                currentMessageDiv.innerHTML = `
                    <div class="message-header">ср</div>
                    <div class="message-bubble"></div>
                `;
                messagesEl.appendChild(currentMessageDiv);
            }
            
            messageBuffer += content;
            currentMessageDiv.querySelector('.message-bubble').innerHTML = formatMessage(messageBuffer);
            scrollToBottom();
        }

        function finishMessage() {
            hideTyping();
            // Пост-обработка: ищем блоки кода и заменяем на карточки с кнопками
            if (currentMessageDiv) {
                enhanceCodeBlocks(currentMessageDiv);
            }
            currentMessageDiv = null;
            messageBuffer = '';
        }

        function appendAssistantMessage(text) {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `
                <div class="message-header">ср</div>
                <div class="message-bubble">${formatMessage(text)}</div>
            `;
            messagesEl.appendChild(div);
            enhanceCodeBlocks(div);
            scrollToBottom();
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="message-header">садовник</div>
                <div class="message-bubble">${escapeHtml(text)}</div>
            `;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // Форматирование текста с эмодзи, таблицами и кодом
        function formatMessage(text) {
            let html = escapeHtml(text)
                .replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    return `<div class="code-block" data-code="${encodeURIComponent(code)}" data-lang="${lang}">
                        <div class="code-header">
                            <span>${lang || 'code'}</span>
                            <div class="code-actions">
                                <button class="code-action" onclick="copyCode(this)">копировать</button>
                                <button class="code-action" onclick="downloadCode(this)">скачать</button>
                                ${lang === 'json' ? '<button class="code-action" onclick="applyCode(this)">применить</button>' : ''}
                            </div>
                        </div>
                        <pre class="code-content">${escapeHtml(code)}</pre>
                    </div>`;
                })
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            // Простая замена эмодзи-текста на символы (можно расширить)
            html = html.replace(/:-?\)/g, '😊')
                       .replace(/:-?\(/g, '😢')
                       .replace(/;;/g, '😉');
            
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Обработка кодовых блоков после вставки
        function enhanceCodeBlocks(container) {
            // Уже обработано в formatMessage, но нужно добавить data-атрибуты
        }

        // Копирование кода
        window.copyCode = function(btn) {
            const block = btn.closest('.code-block');
            const code = decodeURIComponent(block.dataset.code);
            navigator.clipboard.writeText(code);
            showToast('код скопирован', 'success');
        };

        // Скачивание кода
        window.downloadCode = function(btn) {
            const block = btn.closest('.code-block');
            const code = decodeURIComponent(block.dataset.code);
            const lang = block.dataset.lang || 'txt';
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('файл скачан', 'success');
        };

        // Применение кода (отправка как патч, если JSON)
        window.applyCode = function(btn) {
            const block = btn.closest('.code-block');
            const code = decodeURIComponent(block.dataset.code);
            try {
                const json = JSON.parse(code);
                // Отправляем как патч
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'apply_patch',
                        patch: json,
                        session_id: SESSION_ID
                    }));
                    addSystemMessage('🔄 патч отправлен на применение');
                } else {
                    showToast('нет соединения', 'error');
                }
            } catch (e) {
                showToast('это не JSON, нельзя применить', 'error');
            }
        };

        // ===== ЗАГРУЗКА ФАЙЛОВ =====
        function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('❌ нет соединения', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result.split(',')[1];
                ws.send(JSON.stringify({
                    type: 'file',
                    name: file.name,
                    content: content,
                    type: file.type,
                    session_id: SESSION_ID
                }));
                addSystemMessage(`📁 файл ${file.name} отправлен`);
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // ===== DRAG AND DROP =====
        function setupDragAndDrop() {
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                document.body.style.opacity = '0.8';
            });

            document.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                document.body.style.opacity = '1';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadFileFromDrop(files[0]);
                }
            });
        }

        function uploadFileFromDrop(file) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('❌ нет соединения', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result.split(',')[1];
                ws.send(JSON.stringify({
                    type: 'file',
                    name: file.name,
                    content: content,
                    type: file.type,
                    session_id: SESSION_ID
                }));
                addSystemMessage(`📁 файл ${file.name} отправлен`);
            };
            reader.readAsDataURL(file);
        }

        // ===== ПАНЕЛЬ МОДУЛЕЙ =====
        const modulesData = [
            { name: 'initium', icon: '⚡', blocks: ['конституция', 'директивы', 'линзы', 'unified_entry'] },
            { name: 'sphaerae', icon: '◉', blocks: ['biosphaera', 'noosphaera', 'cosmosphaera', 'module_map'] },
            { name: 'akasha_chronicorum', icon: '◈', blocks: ['biosphaera', 'noosphaera', 'cosmosphaera', 'artifact_registry'] },
            { name: 'philosophia', icon: '◇', blocks: ['онтология', 'принципы', 'свидетельства', 'методология'] },
            { name: 'geometria_sacra', icon: '△', blocks: ['цветок жизни', 'меркаба', 'резонанс', 'визуализация'] },
            { name: 'incubae', icon: '○', blocks: ['активные семена', 'архив', 'протоколы'] },
            { name: 'tectosphaera', icon: '□', blocks: ['защита', 'инструменты', 'наставления', 'инфраструктура'] }
        ];

        function setupModulesPanel() {
            renderModulesList();
        }

        function renderModulesList() {
            const html = modulesData.map(module => `
                <div class="module-card" data-module="${module.name}">
                    <div class="module-card-header">
                        <span class="module-card-icon">${module.icon}</span>
                        <span class="module-card-name">${module.name}</span>
                    </div>
                    <div class="module-card-blocks">
                        ${module.blocks.map(block => `
                            <div class="module-block-item" onclick="event.stopPropagation(); requestModuleBlock('${module.name}', '${block}')">${block}</div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('modulesList').innerHTML = html;
            
            // Добавляем обработчик клика на всю карточку (показать модуль целиком)
            document.querySelectorAll('.module-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('module-block-item')) {
                        const moduleName = card.dataset.module;
                        requestModule(moduleName);
                    }
                });
            });
        }

        function requestModule(moduleName) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'module',
                    name: moduleName,
                    session_id: SESSION_ID
                }));
            } else {
                showToast('нет соединения', 'error');
            }
        }

        function requestModuleBlock(moduleName, block) {
            // Отправляем запрос на раскрытие блока
            const text = `расскажи подробнее о блоке ${block} в модуле ${moduleName}`;
            if (ws && ws.readyState === WebSocket.OPEN) {
                addUserMessage(text);
                showTyping();
                ws.send(JSON.stringify({
                    type: 'ask',
                    text: text,
                    session_id: SESSION_ID
                }));
            }
        }

        // ===== КОМАНДЫ (КАРТОЧКИ) =====
        async function showSeeds() {
            // Показываем карточки семян
            showDataCards('seeds');
        }

        async function showMilestones() {
            showDataCards('milestones');
        }

        async function showStatus() {
            // Показываем статус системы
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                const statusHtml = `
                    <div class="data-cards">
                        <div class="data-card">
                            <div class="data-card-title">🔌 соединение</div>
                            <div class="data-card-content">подключений: ${data.connections}</div>
                            <div class="data-card-meta">статус: ${data.status}</div>
                        </div>
                        <div class="data-card">
                            <div class="data-card-title">📦 модули</div>
                            <div class="data-card-content">загружено: ${data.modules}</div>
                            <div class="data-card-meta">github: ${data.github_token}</div>
                        </div>
                        <div class="data-card">
                            <div class="data-card-title">💾 сессии</div>
                            <div class="data-card-content">в кэше: ${data.sessions_cached}</div>
                            <div class="data-card-meta">moonshot: ${data.moonshot_api}</div>
                        </div>
                    </div>
                `;
                showOverlay(statusHtml);
            } catch (e) {
                showToast('ошибка загрузки статуса', 'error');
            }
        }

        async function showModulesList() {
            // Показываем список модулей
            try {
                const response = await fetch(`${API_URL}/kernel`);
                const data = await response.json();
                const modulesHtml = `
                    <div class="data-cards">
                        ${data.modules_loaded.map(m => `
                            <div class="data-card" onclick="requestModule('${m}')">
                                <div class="data-card-title">📦 ${m}</div>
                                <div class="data-card-meta">версия: ...</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                showOverlay(modulesHtml);
            } catch (e) {
                showToast('ошибка загрузки модулей', 'error');
            }
        }

        function showHelp() {
            const helpHtml = `
                <div class="data-cards">
                    <div class="data-card">
                        <div class="data-card-title">○ семена</div>
                        <div class="data-card-content">/seeds — список активных семян</div>
                    </div>
                    <div class="data-card">
                        <div class="data-card-title">◈ вехи</div>
                        <div class="data-card-content">/milestones — последние достижения</div>
                    </div>
                    <div class="data-card">
                        <div class="data-card-title">◉ статус</div>
                        <div class="data-card-content">/status — состояние системы</div>
                    </div>
                    <div class="data-card">
                        <div class="data-card-title">□ модули</div>
                        <div class="data-card-content">/modules — список модулей</div>
                    </div>
                    <div class="data-card">
                        <div class="data-card-title">? помощь</div>
                        <div class="data-card-content">/help — это сообщение</div>
                    </div>
                </div>
            `;
            showOverlay(helpHtml);
        }

        // Временное отображение карточек поверх чата (просто добавим в чат как системное сообщение)
        function showDataCards(type) {
            // Для простоты пока отправим запрос СР, а он вернёт данные
            let query = '';
            if (type === 'seeds') query = 'покажи активные семена из incubae';
            else if (type === 'milestones') query = 'покажи последние вехи из akasha';
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                addUserMessage(query);
                showTyping();
                ws.send(JSON.stringify({
                    type: 'ask',
                    text: query,
                    session_id: SESSION_ID
                }));
            }
        }

        function showOverlay(html) {
            // Просто добавляем в чат как системное сообщение с карточками
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${html}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ===== СТАТУС =====
        function updateStatus(state) {
            statusEl.className = 'status ' + state;
        }

        function enableInput() {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function disableInput() {
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        function showTyping() {
            typingEl.classList.remove('hidden');
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.classList.add('hidden');
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function refreshModules() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'refresh_modules',
                    session_id: SESSION_ID
                }));
                showToast('обновление модулей...', 'success');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== KEYBOARD =====
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== СТАРТ =====
        init();
    </script>
</body>
