<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ Mandala Engineer — MYCEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@300;400;500&family=Nunito:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <style>
        :root {
            --bg: #030d09;
            --surface: #071209;
            --surface-2: #0a1a10;
            --line: #0f2518;
            --line-2: #193a26;
            --green: #059669;
            --green-2: #10b981;
            --green-bright: #34d399;
            --green-neon: #6ee7b7;
            --green-glow: rgba(16,185,129,0.12);
            --violet: #7c3aed;
            --violet-soft: #a78bfa;
            --violet-dim: rgba(124,58,237,0.12);
            --indigo: #3730a3;
            --indigo-soft: #818cf8;
            --text: #dcfce7;
            --text-2: #5a8a6a;
            --text-3: #254535;
            --mono: 'Fira Mono', monospace;
            --sans: 'Nunito', sans-serif;
            --copy: #10b981;
            --download: #10b981;
            --apply: #a78bfa;
            --radius: 8px;
            --radius-sm: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .glow-pool {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }
        .gp-1 {
            width: 600px; height: 400px;
            top: -100px; right: -200px;
            background: radial-gradient(ellipse, rgba(16,185,129,0.1) 0%, transparent 70%);
            animation: pool-drift 20s ease-in-out infinite alternate;
        }
        .gp-2 {
            width: 400px; height: 400px;
            bottom: -100px; left: -100px;
            background: radial-gradient(ellipse, rgba(124,58,237,0.08) 0%, transparent 70%);
        }
        @keyframes pool-drift {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.15) translate(-20px, 15px); }
        }

        .bg-flower {
            position: fixed;
            right: -220px; top: 50%;
            transform: translateY(-50%);
            width: 700px; height: 700px;
            opacity: 0.4;
            pointer-events: none;
            animation: flower-breathe 8s ease-in-out infinite alternate;
        }
        .bg-flower circle {
            stroke: #10b981;
            stroke-width: 0.6;
        }
        @keyframes flower-breathe {
            from { opacity: 0.3; transform: translateY(-50%) scale(1); }
            to { opacity: 0.5; transform: translateY(-50%) scale(1.03); }
        }

        .header {
            height: 52px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green), transparent);
            opacity: 0.3;
        }

        .h-left { display: flex; align-items: center; gap: 14px; }

        .logo-mark { width: 34px; height: 34px; }
        .logo-mark svg { width: 34px; height: 34px; }

        .brand-text {
            display: flex; flex-direction: column; gap: 1px;
        }
        .brand-name {
            font-family: var(--mono);
            font-size: 11px; font-weight: 400;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: #ffffff;
        }
        .brand-sub {
            font-family: var(--mono);
            font-size: 7px; letter-spacing: 2px; text-transform: uppercase;
            color: #6ee7b7;
        }

        .h-right { display: flex; align-items: center; gap: 12px; }

        .model-dropdown {
            position: relative;
        }

        .model-trigger {
            display: flex; align-items: center; gap: 7px;
            font-family: var(--mono); font-size: 9px;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: #a7f3d0;
            background: transparent;
            border: 1px solid #2d5a4a;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .model-trigger:hover { color: #6ee7b7; border-color: rgba(16,185,129,0.5); }
        .model-trigger.open { color: #6ee7b7; border-color: rgba(16,185,129,0.6); background: rgba(16,185,129,0.1); }

        .model-trigger .mt-arrow {
            font-size: 7px;
            transition: transform 0.2s;
            opacity: 0.5;
        }
        .model-trigger.open .mt-arrow { transform: rotate(180deg); opacity: 1; }

        .model-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--surface-2);
            border: 1px solid var(--line-2);
            border-radius: 10px;
            overflow: hidden;
            min-width: 140px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 30px rgba(16,185,129,0.05);
            opacity: 0;
            transform: translateY(-6px) scale(0.97);
            pointer-events: none;
            transition: all 0.18s ease;
            z-index: 100;
        }
        .model-menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .model-menu-header {
            padding: 8px 12px 6px;
            font-family: var(--mono); font-size: 7px;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--text-3);
            border-bottom: 1px solid var(--line);
        }

        .model-option {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            cursor: pointer;
            transition: background 0.12s;
            border: none; background: transparent;
            width: 100%; text-align: left;
        }
        .model-option:hover { background: rgba(16,185,129,0.07); }
        .model-option.active { background: rgba(16,185,129,0.1); }

        .mo-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--line-2);
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .model-option.active .mo-dot {
            background: var(--green-2);
            box-shadow: 0 0 8px var(--green-2);
        }
        .model-option:hover .mo-dot { background: var(--text-3); }

        .mo-name {
            font-family: var(--mono); font-size: 10px;
            letter-spacing: 0.5px;
            color: #a7f3d0;
            transition: color 0.12s;
        }
        .model-option:hover .mo-name { color: #6ee7b7; }
        .model-option.active .mo-name { color: #6ee7b7; }

        .vsep { width: 1px; height: 18px; background: var(--line); }

        .status-orb {
            display: flex; align-items: center; gap: 6px;
        }
        .orb-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green-2);
            box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3);
            animation: orb-pulse 3s ease-in-out infinite;
        }
        @keyframes orb-pulse {
            0%,100% { box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 6px var(--green-2), 0 0 10px rgba(16,185,129,0.15); }
        }
        .orb-label { display: none; }

        .layout { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }

        .sidebar {
            width: 188px;
            border-right: 1px solid var(--line);
            display: flex; flex-direction: column;
            padding: 22px 0;
            flex-shrink: 0;
            position: relative;
            transition: width 0.3s ease;
        }
        .sidebar.collapsed { width: 48px; }
        .sidebar.collapsed .sidebar-toggle { transform: rotate(180deg); }
        .sidebar.collapsed .nav-wrap,
        .sidebar.collapsed .logo-mini { display: flex; }
        .sidebar.collapsed .nav-title,
        .sidebar.collapsed .nav-item span:not(.nicon) { display: none; }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom,
                transparent,
                var(--green) 40%,
                var(--violet) 70%,
                transparent);
            opacity: 0.5;
        }

        .sidebar-toggle {
            position: absolute; right: -12px; top: 12px;
            width: 24px; height: 24px;
            background: var(--surface);
            border: 1px solid var(--line-2);
            border-radius: 50%;
            color: var(--text-3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            z-index: 10;
            transition: all 0.2s ease;
        }
        .sidebar-toggle:hover {
            border-color: var(--green-2);
            color: var(--green-bright);
            transform: scale(1.1);
        }

        .logo-mini {
            display: none;
            width: 28px; height: 28px;
            margin: 12px auto;
            background: var(--green);
            border-radius: var(--radius-sm);
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--bg);
        }

        .nav-wrap { padding: 0 14px; transition: opacity 0.2s ease; }

        .nav-title {
            font-family: var(--mono); font-size: 7px;
            letter-spacing: 3px; text-transform: uppercase;
            color: #6ee7b7;
            text-shadow: 0 0 5px rgba(16,185,129,0.3);
            margin-bottom: 14px;
        }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 10px;
            width: 100%; background: transparent; border: none;
            color: #a7f3d0;
            font-family: var(--sans);
            font-size: 12px; font-weight: 300;
            cursor: pointer; text-align: left;
            border-radius: 8px; margin-bottom: 2px;
            transition: all 0.15s;
        }
        .nav-item:hover {
            color: #ffffff;
            background: var(--green-glow);
        }

        .nicon {
            font-size: 9px; width: 14px; text-align: center;
            color: var(--text-3); transition: all 0.2s;
        }
        .nav-item:hover .nicon {
            color: var(--green-2);
            text-shadow: 0 0 8px var(--green-2);
        }

        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .tabs {
            height: 42px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center;
            padding: 0 22px;
            flex-shrink: 0;
        }
        .tab {
            font-family: var(--mono); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase;
            color: #5a8a6a;
            background: transparent; border: none;
            cursor: pointer; padding: 0 16px; height: 100%;
            display: flex; align-items: center;
            transition: color 0.15s; position: relative;
        }
        .tab:hover { color: #a7f3d0; }
        .tab.active {
            color: #6ee7b7;
            text-shadow: 0 0 5px #10b981;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 8px; right: 8px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green-2), transparent);
        }

        .messages {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 28px 22px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .msg {
            display: flex; gap: 13px;
            max-width: 82%;
            min-width: 0;
            animation: mup 0.28s ease;
        }
        @keyframes mup {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.sys { align-self: center; max-width: 90%; }

        .av { width: 36px; height: 36px; flex-shrink: 0; margin-top: 3px; }
        .av svg { width: 36px; height: 36px; }

        .mbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .mname {
            font-family: var(--mono); font-size: 8px;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-3);
        }
        .msg.user .mname { text-align: right; }

        .bub {
            padding: 12px 16px;
            font-size: 13.5px; line-height: 1.7; font-weight: 300;
            word-break: break-word;
            overflow-wrap: break-word;
            min-width: 0;
        }
        .msg.assistant .bub {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 2px 12px 12px 12px;
            border-left: 1px solid rgba(16,185,129,0.2);
        }
        .msg.user .bub {
            background: rgba(124,58,237,0.07);
            border: 1px solid rgba(124,58,237,0.18);
            border-radius: 12px 2px 12px 12px;
        }
        .msg.sys .bub {
            background: transparent; border: none;
            color: var(--text-3); font-family: var(--mono);
            font-size: 9px; letter-spacing: 1.5px; text-align: center;
        }

        .code-block {
            margin: 12px 0; 
            border: 1px solid var(--line-2); 
            border-radius: var(--radius);
            overflow: hidden; 
            background: var(--surface); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        .code-header {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 6px 12px; 
            background: var(--surface-2); 
            border-bottom: 1px solid var(--line-2);
        }
        .code-lang {
            font-family: var(--mono); 
            font-size: 11px; 
            color: var(--green-bright);
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .code-actions { 
            display: flex; 
            gap: 2px; 
            flex-shrink: 0;
        }
        .code-btn {
            padding: 4px 8px; 
            background: var(--surface); 
            border: 1px solid var(--line-2);
            border-radius: var(--radius-sm); 
            font-size: 11px;
            font-family: var(--mono); 
            cursor: pointer; 
            transition: all 0.15s ease;
            display: flex; 
            align-items: center; 
            justify-content: center;
            line-height: 1; 
            min-width: 28px;
        }
        .code-btn.download { color: var(--download); border-color: var(--download); }
        .code-btn.download:hover { background: var(--download); color: var(--bg); box-shadow: 0 0 8px var(--download); }
        .code-btn.apply { color: var(--apply); border-color: var(--apply); }
        .code-btn.apply:hover { background: var(--apply); color: var(--bg); box-shadow: 0 0 8px var(--apply); }

        .code-content {
            padding: 12px; 
            overflow-x: auto; 
            overflow-y: auto;
            background: var(--surface);
            font-family: var(--mono); 
            font-size: 12px; 
            line-height: 1.6;
            color: var(--text); 
            max-height: 400px; 
            white-space: pre;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 22px 10px;
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green-bright);
        }
        .thinking .logo {
            width: 36px;
            height: 36px;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzNCAzNCI+PHJlY3Qgd2lkdGg9IjM0IiBoZWlnaHQ9IjM0IiBmaWxsPSJub25lIiAvPjxjaXJjbGUgY3g9IjE3IiBjeT0iMTciIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIGZpbGw9Im5vbmUiIC8+PGNpcmNsZSBjeD0iMTciIGN5PSIxMCIgcj0iNyIgc3Ryb2tlPSIjMTBiOTgxIiBzdHJva2Utd2lkdGg9IjAuOCIgb3BhY2l0eT0iMC42IiBmaWxsPSJub25lIiAvPjxjaXJjbGUgY3g9IjE3IiBjeT0iMjQiIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIG9wYWNpdHk9IjAuNiIgZmlsbD0ibm9uZSIgLz48Y2lyY2xlIGN4PSIyMy4wNiIgY3k9IjEzLjUiIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIG9wYWNpdHk9IjAuNiIgZmlsbD0ibm9uZSIgLz48Y2lyY2xlIGN4PSIyMy4wNiIgY3k9IjIwLjUiIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIG9wYWNpdHk9IjAuNiIgZmlsbD0ibm9uZSIgLz48Y2lyY2xlIGN4PSIxMC45NCIgY3k9IjEzLjUiIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIG9wYWNpdHk9IjAuNiIgZmlsbD0ibm9uZSIgLz48Y2lyY2xlIGN4PSIxMC45NCIgY3k9IjIwLjUiIHI9IjciIHN0cm9rZT0iIzEwYjk4MSIgc3Ryb2tlLXdpZHRoPSIwLjgiIG9wYWNpdHk9IjAuNiIgZmlsbD0ibm9uZSIgLz48Y2lyY2xlIGN4PSIxNyIgY3k9IjE3IiByPSIxNiIgc3Ryb2tlPSIjMDU5NjY5IiBzdHJva2Utd2lkdGg9IjAuNSIgb3BhY2l0eT0iMC40IiBmaWxsPSJub25lIiAvPjxjaXJjbGUgY3g9IjE3IiBjeT0iMTciIHI9IjIiIGZpbGw9IiMzNGQzOTkiIG9wYWNpdHk9IjAuOSIgLz48L3N2Zz4=') center/contain no-repeat;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .dots {
            display: inline-block;
        }
        .dots::after {
            content: '';
            display: inline-block;
            width: 2ch;
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .input-area {
            padding: 14px 22px 18px;
            border-top: 1px solid var(--line);
            flex-shrink: 0;
        }
        .irow { display: flex; align-items: flex-end; gap: 10px; }

        .ibtn {
            width: 38px; height: 38px;
            background: transparent;
            border: 1px solid var(--line-2);
            color: var(--text-3); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; border-radius: 10px;
            transition: all 0.2s;
        }
        .ibtn:hover { color: var(--green-bright); border-color: rgba(16,185,129,0.3); }

        .ifield {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text);
            font-family: var(--sans); font-weight: 300; font-size: 14px;
            padding: 10px 15px; outline: none;
            resize: none; max-height: 120px; line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .ifield:focus {
            border-color: var(--violet-soft);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
            background: linear-gradient(145deg, var(--surface), rgba(124,58,237,0.05));
        }
        .ifield::placeholder { color: var(--text-3); }

        .isend {
            background: linear-gradient(145deg, var(--green), var(--violet));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
        }
        .isend:hover {
            background: linear-gradient(145deg, var(--green-2), var(--violet-soft));
            box-shadow: 0 4px 30px rgba(124,58,237,0.7);
        }
        .isend:disabled { opacity: 0.4; cursor: not-allowed; }

        .file-attachment {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: var(--surface); border: 1px solid var(--line-2);
            border-radius: var(--radius-sm); margin: 0 22px 8px; font-size: 12px; color: var(--text);
        }
        .file-attachment .remove { margin-left: auto; cursor: pointer; color: var(--text-3); }
        .file-attachment .remove:hover { color: #f43f5e; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3,13,9,0.9); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius);
            width: 100%; max-width: 500px; max-height: 80vh; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding: 16px; border-bottom: 1px solid var(--line-2);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-title { font-size: 14px; font-weight: 500; color: var(--green-bright); font-family: var(--mono); }
        .modal-close {
            width: 28px; height: 28px; border: none; background: transparent; color: var(--text-3);
            cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .modal-close:hover { color: var(--text); background: var(--surface-2); }
        .modal-body { padding: 16px; overflow-y: auto; }
        .patch-preview-box {
            background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
            padding: 12px; max-height: 200px; overflow: auto;
        }
        .patch-preview-box pre { font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--text); margin: 0; }
        .modal-footer {
            padding: 16px; border-top: 1px solid var(--line-2);
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;

        <script>
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        const SESSION_ID = localStorage.getItem('mc_session') || (() => {
            const id = 'mc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
            localStorage.setItem('mc_session', id); return id;
        })();

        let ws = null, currentModule = null, modulesCache = {}, currentPatch = null;
        let pendingFiles = [];
        let sidebarCollapsed = localStorage.getItem('mc_sidebar_collapsed') === 'true';
        let messageBuffer = '', currentMessageDiv = null;

        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ДЛЯ ФАЗЫ 1 ==========
        let fileTreeVisible = true;
        let currentFile = null;
        let editor = null;
        let openFiles = [];
        let currentDiff = null;
        let githubToken = localStorage.getItem('github_token');
        let githubUser = null;

        const statusDot = document.getElementById('statusDot');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const thinkingEl = document.getElementById('thinking');
        const seedsGrid = document.getElementById('seedsGrid');
        const filePreview = document.getElementById('filePreview');
        const fileNameEl = document.getElementById('fileName');
        const sidebar = document.getElementById('sidebar');
        const modelTrigger = document.getElementById('modelTrigger');
        const modelMenu = document.getElementById('modelMenu');
        const modelLabel = document.getElementById('modelLabel');
        const modelOptions = document.querySelectorAll('.model-option');

        // Инициализация Monaco Editor
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                value: '// Выберите файл для редактирования',
                language: 'text',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });
            
            editor.getModel().onDidChangeContent(() => {
                if (currentFile) {
                    showDiffForCurrentFile();
                }
            });
        });

        // ========== ЗАГРУЗКА ДЕРЕВА ФАЙЛОВ ==========
        async function loadFileTree() {
            const content = document.getElementById('fileTreeContent');
            content.innerHTML = 'Загрузка...';
            
            try {
                const response = await fetch('/api/tree');
                const data = await response.json();
                
                if (data.error) {
                    content.innerHTML = `❌ ${data.error}`;
                    return;
                }
                
                const tree = buildTree(data.tree);
                content.innerHTML = renderTree(tree);
                
                document.querySelectorAll('.file-tree-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const path = el.dataset.path;
                        if (path) loadFile(path);
                    });
                });
            } catch (err) {
                content.innerHTML = `❌ ${err.message}`;
            }
        }

        function buildTree(files) {
            const root = {};
            files.forEach(file => {
                if (file.type !== 'blob') return;
                const parts = file.path.split('/');
                let current = root;
                parts.forEach((part, i) => {
                    if (i === parts.length - 1) {
                        current[part] = { type: 'file', path: file.path };
                    } else {
                        if (!current[part]) current[part] = { type: 'dir', children: {} };
                        current = current[part].children;
                    }
                });
            });
            return root;
        }

        function renderTree(node, level = 0) {
            if (node.type === 'file') {
                const ext = node.path.split('.').pop();
                return `<div class="file-tree-item file ${ext}" data-path="${node.path}" style="padding-left: ${level * 16 + 16}px">${node.path.split('/').pop()}</div>`;
            }
            
            let html = '';
            Object.keys(node).forEach(key => {
                if (key === 'type') return;
                const child = node[key];
                if (child.type === 'dir') {
                    html += `<div class="file-tree-item folder" style="padding-left: ${level * 16}px">${key}</div>`;
                    html += renderTree(child.children, level + 1);
                } else {
                    html += renderTree(child, level + 1);
                }
            });
            return html;
        }

        async function loadFile(path) {
            currentFile = path;
            
            if (!openFiles.includes(path)) {
                openFiles.push(path);
                renderTabs();
            }
            
            try {
                const response = await fetch(`https://raw.githubusercontent.com/voodoomushroomzzz-source/mandala-core/main/${path}`);
                const content = await response.text();
                
                const ext = path.split('.').pop();
                const language = ext === 'json' ? 'json' : ext === 'py' ? 'python' : ext === 'html' ? 'html' : ext === 'js' ? 'javascript' : 'text';
                
                monaco.editor.setModelLanguage(editor.getModel(), language);
                editor.setValue(content);
                
                localStorage.setItem(`orig_${path}`, content);
            } catch (err) {
                editor.setValue(`// Ошибка загрузки: ${err.message}`);
            }
        }

        function renderTabs() {
            const tabs = document.getElementById('editorTabs');
            tabs.innerHTML = openFiles.map(path => {
                const name = path.split('/').pop();
                return `<div class="editor-tab ${path === currentFile ? 'active' : ''}" onclick="switchFile('${path}')">
                    ${name}
                    <span class="editor-tab-close" onclick="closeFile('${path}', event)">×</span>
                </div>`;
            }).join('');
        }

        function switchFile(path) {
            currentFile = path;
            renderTabs();
            loadFile(path);
        }

        function closeFile(path, event) {
            event.stopPropagation();
            openFiles = openFiles.filter(p => p !== path);
            if (currentFile === path) {
                currentFile = openFiles[0] || null;
                if (currentFile) loadFile(currentFile);
                else editor.setValue('// Выберите файл для редактирования');
            }
            renderTabs();
        }

        // ========== DIFF ==========
        async function showDiffForCurrentFile() {
            if (!currentFile) return;
            
            const original = localStorage.getItem(`orig_${currentFile}`);
            const current = editor.getValue();
            
            if (original === current) {
                document.getElementById('diffContainer').style.display = 'none';
                return;
            }
            
            document.getElementById('diffContainer').style.display = 'block';
            document.getElementById('applyChangesBtn').style.display = 'inline-block';
            
            const diff = simpleDiff(original, current);
            document.getElementById('diffContent').innerHTML = diff.map(line => {
                if (line.startsWith('+')) return `<div class="diff-line add">${escapeHtml(line)}</div>`;
                if (line.startsWith('-')) return `<div class="diff-line remove">${escapeHtml(line)}</div>`;
                return `<div class="diff-line">${escapeHtml(line)}</div>`;
            }).join('');
            
            currentDiff = {
                path: currentFile,
                original: original,
                current: current
            };
        }

        function simpleDiff(original, current) {
            const origLines = original.split('\n');
            const currLines = current.split('\n');
            const diff = [];
            
            if (origLines.length !== currLines.length) {
                diff.push(`📊 строк: ${origLines.length} → ${currLines.length}`);
            }
            
            for (let i = 0; i < Math.min(origLines.length, currLines.length); i++) {
                if (origLines[i] !== currLines[i]) {
                    diff.push(`- ${origLines[i]}`);
                    diff.push(`+ ${currLines[i]}`);
                }
            }
            
            return diff.slice(0, 20);
        }

        async function applyChanges() {
            if (!currentDiff) return;
            
            const patch = {
                file_path: currentDiff.path,
                content: currentDiff.current
            };
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'apply_patch',
                    patch: patch,
                    session_id: SESSION_ID
                }));
                
                localStorage.setItem(`orig_${currentDiff.path}`, currentDiff.current);
                clearDiff();
                showToast('✅ Патч отправлен', 'success');
            } else {
                showToast('❌ Нет соединения', 'error');
            }
        }

        function clearDiff() {
            document.getElementById('diffContainer').style.display = 'none';
            document.getElementById('applyChangesBtn').style.display = 'none';
            currentDiff = null;
        }

        function toggleFileTree() {
            fileTreeVisible = !fileTreeVisible;
            document.getElementById('fileTree').classList.toggle('collapsed', !fileTreeVisible);
            document.getElementById('editorContainer').classList.toggle('full-width', !fileTreeVisible);
            document.getElementById('diffContainer').classList.toggle('full-width', !fileTreeVisible);
            document.querySelector('.messages').classList.toggle('full-width', !fileTreeVisible);
            document.querySelector('.input-area').classList.toggle('full-width', !fileTreeVisible);
        }

        // ========== OAuth GITHUB ==========
        function initOAuth() {
            const clientId = 'Ov23liuSAMPLE12345'; // ЗАМЕНИ НА РЕАЛЬНЫЙ ПОСЛЕ СОЗДАНИЯ OAuth APP
            const redirectUri = window.location.origin + '/oauth/callback';
            
            const authBtn = document.createElement('button');
            authBtn.className = 'auth-button';
            authBtn.id = 'authButton';
            
            if (githubToken) {
                authBtn.innerHTML = '✓ GitHub';
                authBtn.classList.add('logged-in');
                fetchUserInfo();
            } else {
                authBtn.innerHTML = '🔐 войти через GitHub';
                authBtn.onclick = () => {
                    window.location.href = `https://github.com/login/oauth/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&scope=repo`;
                };
            }
            
            document.querySelector('.h-right').appendChild(authBtn);
        }

        async function fetchUserInfo() {
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${githubToken}` }
                });
                if (response.ok) {
                    githubUser = await response.json();
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Custom model dropdown logic
        modelTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = modelMenu.classList.contains('open');
            modelMenu.classList.toggle('open', !isOpen);
            modelTrigger.classList.toggle('open', !isOpen);
        });

        modelOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                const value = opt.dataset.value;
                modelOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                modelLabel.textContent = value;
                modelMenu.classList.remove('open');
                modelTrigger.classList.remove('open');
                changeModel(value);
            });
        });

        document.addEventListener('click', () => {
            modelMenu.classList.remove('open');
            modelTrigger.classList.remove('open');
        });

        function init() {
            if (sidebarCollapsed) sidebar.classList.add('collapsed');
            connect();
            setupTabs();
            setupKeyboard();
            setupDragDrop();
            setTimeout(() => {
                loadFileTree();
                initOAuth();
            }, 1000);
        }

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            sidebar.classList.toggle('collapsed', sidebarCollapsed);
            localStorage.setItem('mc_sidebar_collapsed', sidebarCollapsed);
        }

        function connect() {
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.onopen = () => ws.send(JSON.stringify({type:'init', session_id:SESSION_ID}));
            ws.onmessage = (e) => { try { handleMessage(JSON.parse(e.data)); } catch (ex) { console.error(ex); } };
            ws.onclose = () => { updateStatus('error'); disableInput(); showToast('◈ соединение разорвано', 'error'); setTimeout(connect,3000); };
            ws.onerror = () => updateStatus('error');
        }

        function updateStatus(state) {
            statusDot.className = 'orb-dot';
            if (state === 'connected') {
                statusDot.style.background = 'var(--green-2)';
                statusDot.style.boxShadow = '0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3)';
            } else if (state === 'connecting') {
                statusDot.style.background = 'var(--violet-soft)';
                statusDot.style.boxShadow = '0 0 8px var(--violet-soft)';
            } else {
                statusDot.style.background = '#f43f5e';
                statusDot.style.boxShadow = '0 0 12px #f43f5e';
            }
        }
                    function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    updateStatus('connected'); enableInput();
                    addSystemMessage(`◈ соединение установлено [${data.session_id}]`);
                    addSystemMessage(`◈ модулей загружено: ${data.modules_loaded?.length||0}`);
                    break;
                case 'history':
                    messagesEl.innerHTML = '';
                    if(data.messages?.length) data.messages.forEach(m => {
                        if(m.role==='user') addUserMessage(m.content);
                        else if(m.role==='assistant') appendFullMessage(m.content);
                    });
                    scrollToBottom();
                    break;
                case 'system': addSystemMessage(data.text); break;
                case 'stream': handleStream(data.content); break;
                case 'done': finishMessage(); break;
                case 'error': showToast(data.text,'error'); hideThinking(); finishMessage(); break;
                case 'module_direct': showToast(`◈ модуль ${data.name} получен`,'success'); break;
                case 'modules_refreshed': showToast(`◈ обновлено ${data.count} модулей`,'success'); break;
                case 'file_processed': addSystemMessage(data.summary); break;
                case 'patch_result': handlePatchResult(data.results); break;
                case 'pong': break;
            }
        }

        function createMessageElement(role) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            const iconSvg = role === 'user' 
                ? '<svg viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="13" stroke="#7c3aed" stroke-width="0.8" opacity="0.4"/><circle cx="15" cy="15" r="6" stroke="#7c3aed" stroke-width="0.8" fill="rgba(124,58,237,0.08)"/><circle cx="15" cy="15" r="2" fill="#a78bfa" opacity="0.6"/></svg>'
                : '<svg viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="7" stroke="#10b981" stroke-width="0.8"/><circle cx="15" cy="8"  r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="15" cy="22" r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="21.06" cy="11.5" r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="21.06" cy="18.5" r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="8.94" cy="11.5"  r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="8.94" cy="18.5"  r="7" stroke="#10b981" stroke-width="0.8" opacity="0.5"/><circle cx="15" cy="15" r="2" fill="#34d399" opacity="0.9"/></svg>';
            const name = role === 'user' ? 'вы' : (role === 'assistant' ? 'СР' : 'система');
            div.innerHTML = `
                <div class="av">${iconSvg}</div>
                <div class="mbody">
                    <div class="mname">${name}</div>
                    <div class="bub"></div>
                </div>
            `;
            return div;
        }

        function addUserMessage(text) {
            const div = createMessageElement('user');
            div.querySelector('.bub').textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.innerHTML = `<div class="bub">${text}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function appendFullMessage(text) {
            const div = createMessageElement('assistant');
            let html = escapeHtml(text);
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => renderCodeBlock(lang, code, true));
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--green-bright);">$1</strong>');
            html = html.replace(/\n/g, '<br>');
            div.querySelector('.bub').innerHTML = html;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function handleStream(content) {
            if(!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant');
                messagesEl.appendChild(currentMessageDiv);
            }
            messageBuffer += content;
            const bub = currentMessageDiv.querySelector('.bub');
            let html = escapeHtml(messageBuffer);
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => renderCodeBlock(lang, code, true));
            html = html.replace(/```(\w*)\n([\s\S]*)$/, (match, lang, code) => {
                if(!messageBuffer.includes('```', messageBuffer.lastIndexOf('```')+3)) return renderCodeBlock(lang, code, false);
                return match;
            });
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--green-bright);">$1</strong>');
            html = html.replace(/\n/g, '<br>');
            bub.innerHTML = html;
            scrollToBottom();
        }

        function finishMessage() { hideThinking(); currentMessageDiv = null; messageBuffer = ''; }

        function renderCodeBlock(lang, code, complete) {
            const downloadBtnClass = 'code-btn download';
            const applyBtnClass = 'code-btn apply';
            const actions = complete ? `
                <div class="code-actions">
                    <button class="${downloadBtnClass}" onclick="downloadCodeFromBlock(this)" title="Скачать">↓</button>
                    ${lang === 'json' ? `<button class="${applyBtnClass}" onclick="preparePatchFromBlock(this)" title="Применить патч">△</button>` : ''}
                </div>
            ` : '';
            return `
                <div class="code-block ${complete?'complete':'streaming'}">
                    <div class="code-header"><span class="code-lang">${lang||'code'}</span>${actions}</div>
                    <pre class="code-content">${escapeHtml(code)}</pre>
                </div>
            `;
        }

        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        window.downloadCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const rawCode = block.querySelector('.code-content').textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            const lang = block.querySelector('.code-lang').textContent || 'txt';
            const blob = new Blob([decodedCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('◈ файл скачан', 'success');
        };

        window.preparePatchFromBlock = function(btn) {
            const codeElement = btn.closest('.code-block').querySelector('.code-content');
            const rawCode = codeElement.textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            try {
                JSON.parse(decodedCode);
                currentPatch = decodedCode;
                document.getElementById('patchPreviewContent').textContent = decodedCode;
                document.getElementById('confirmPatchBtn').disabled = false;
                openPatchModal();
                showToast('◈ патч подготовлен', 'success');
            } catch(e) {
                showToast('◈ невалидный JSON: ' + e.message, 'error');
            }
        };

        function sendMessage() {
            const text = inputEl.value.trim();
            if (pendingFiles.length > 0) {
                sendFiles(pendingFiles, text);
                clearFiles();
                inputEl.value = '';
                autoHeight();
                return;
            }
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            addUserMessage(text);
            inputEl.value = '';
            autoHeight();
            showThinking();
            ws.send(JSON.stringify({type:'ask', text:text, session_id:SESSION_ID}));
        }

        async function sendFiles(files, caption) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            if (caption.trim()) addUserMessage(caption);
            showThinking();
            for (const file of files) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        ws.send(JSON.stringify({
                            type: 'file',
                            name: file.name,
                            content: e.target.result.split(',')[1],
                            file_type: file.type || 'application/octet-stream',
                            caption: '',
                            session_id: SESSION_ID
                        }));
                        addSystemMessage(`◈ файл ${file.name} отправлен`);
                        addSystemMessage(`📄 ${file.name} (${file.size} байт)`);
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
                await new Promise(r => setTimeout(r, 100));
            }
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            pendingFiles = files;
            updateFilePreview();
            inputEl.focus();
        }

        function updateFilePreview() {
            if (pendingFiles.length === 0) {
                filePreview.classList.add('hidden');
                return;
            }
            const names = pendingFiles.map(f => f.name).join(', ');
            fileNameEl.textContent = `📎 ${pendingFiles.length} файл(ов): ${names}`;
            filePreview.classList.remove('hidden');
        }

        function clearFiles() {
            pendingFiles = [];
            filePreview.classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        function setupDragDrop() {
            document.addEventListener('dragover', e => { e.preventDefault(); document.body.style.boxShadow = 'inset 0 0 50px var(--violet-dim)'; });
            document.addEventListener('dragleave', e => { if(e.target===document.body) document.body.style.boxShadow = ''; });
            document.addEventListener('drop', e => {
                e.preventDefault(); document.body.style.boxShadow = '';
                const files = Array.from(e.dataTransfer.files);
                if(files.length>0) {
                    pendingFiles = files;
                    updateFilePreview();
                    inputEl.focus();
                }
            });
        }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function enableInput() { inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus(); }
        function disableInput() { inputEl.disabled = true; sendBtn.disabled = true; }
        function showThinking() { thinkingEl.classList.remove('hidden'); scrollToBottom(); }
        function hideThinking() { thinkingEl.classList.add('hidden'); }
        function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
        function autoHeight() { inputEl.style.height = 'auto'; inputEl.style.height = inputEl.scrollHeight + 'px'; }

        function setupKeyboard() {
            inputEl.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
            inputEl.addEventListener('input', autoHeight);
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tabName}`).classList.add('active');
                    if(tabName==='incubae') loadSeeds();
                });
            });
        }

        async function loadSeeds() {
            seedsGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">○</div><div>загрузка...</div></div>';
            try {
                const response = await fetch('https://raw.githubusercontent.com/voodoomushroomzzz-source/mandala-core/main/incubae.json');
                if(!response.ok) throw new Error('ошибка загрузки');
                const data = await response.json();
                const seeds = data.seeds || [];
                if(!seeds.length) { seedsGrid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">○</div><div>нет семян</div></div>'; return; }
                seedsGrid.innerHTML = seeds.map(seed => `
                    <div class="seed-card" onclick="askAboutSeed('${seed.id}')">
                        <div class="seed-header"><div class="seed-title">${escapeHtml(seed.name||'без названия')}</div><div class="seed-id">${seed.id}</div></div>
                        <div class="seed-desc">${escapeHtml(seed.description||'')}</div>
                        <div class="seed-meta"><span class="seed-badge">${seed.version||'v1.0'}</span><span class="seed-badge">${seed.status||'active'}</span></div>
                    </div>
                `).join('');
            } catch(err) { seedsGrid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">×</div><div>${err.message}</div></div>`; }
        }
        window.askAboutSeed = (seedId) => sendDirectMessage(`Расскажи о семени ${seedId}`);

        function openPatchModal() { document.getElementById('patchModal').classList.add('active'); }
        function closePatchModal() {
            document.getElementById('patchModal').classList.remove('active');
            currentPatch = null; document.getElementById('confirmPatchBtn').disabled = true;
            document.getElementById('patchPreviewContent').textContent = 'загрузите JSON-патч...';
        }
        function confirmPatch() {
            if(!currentPatch || !ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify({type:'apply_patch', patch:JSON.parse(currentPatch), session_id:SESSION_ID}));
                closePatchModal(); showToast('◈ патч отправлен','success'); addSystemMessage('◈ применение патча...');
            } catch(e) { showToast('◈ ошибка патча','error'); }
        }
        function handlePatchResult(results) { results.forEach(r => addSystemMessage(`◈ ${r.status==='success'?'✓':'✗'} ${r.file||r.module}: ${r.message}`)); }

        function quickAction(action) {
            if(action==='seeds') sendDirectMessage('Покажи активные семена из incubae');
            else if(action==='milestones') sendDirectMessage('Покажи последние milestones из Akasha');
            else if(action==='status') sendDirectMessage('Статус системы');
            else if(action==='sync') sendDirectMessage('/sync');
            else if(action==='files') sendDirectMessage('/tree');
            else if(action==='forget') {
                messagesEl.innerHTML = '';
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'clear_history', session_id: SESSION_ID}));
                }
                addSystemMessage('◈ история забыта');
            }
        }

        function sendDirectMessage(text) {
            if(!ws || ws.readyState !== WebSocket.OPEN) { showToast('◈ нет соединения','error'); return; }
            addUserMessage(text); showThinking(); ws.send(JSON.stringify({type:'ask', text:text, session_id:SESSION_ID}));
        }
                    function changeModel(model) {
            if(!ws || ws.readyState !== WebSocket.OPEN) { showToast('◈ нет соединения','error'); return; }
            sendDirectMessage(`/model ${model}`);
        }

        function showToast(msg,type='success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg; toast.className = `toast ${type} show`;
            setTimeout(()=>toast.classList.remove('show'),3000);
        }

        init();
    </script>
