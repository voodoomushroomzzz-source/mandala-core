<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala — инженерный чат</title>
    <style>
        /* ===== ГЕОМЕТРИЧЕСКИЙ МИНИМАЛИЗМ ===== */
        :root {
            --bg-deep: #0a0c10;
            --bg-surface: #11131f;
            --bg-surface-hover: #1a1b2e;
            --border-subtle: #252842;
            --border-glow: #3e4a7a;
            --accent-primary: #6b4f8c;
            --accent-secondary: #4a3a6b;
            --text-primary: #e0e0ff;
            --text-muted: #7a7ab3;
            --success: #5fbb7a;
            --warning: #c99b5f;
            --error: #bf5f6f;
            
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            --font-sans: 'Inter', -apple-system, 'SF Pro Display', system-ui, sans-serif;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            
            --shadow-glow: 0 0 15px rgba(107, 79, 140, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            letter-spacing: 0.2px;
            font-weight: 400;
        }

        /* ===== КОСМИЧЕСКИЙ ХЕДЕР ===== */
        .header {
            height: 60px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-primary);
            border: 1px solid var(--border-glow);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .logo span {
            transform: rotate(-45deg);
        }

        .header-title {
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            width: 12px;
            height: 12px;
            border-radius: 0;
            background: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status.connected { 
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            border-radius: 0;
            transform: rotate(45deg);
        }
        
        .status.connecting { 
            background: var(--warning);
            animation: pulse 1.5s infinite;
            border-radius: 50%;
        }
        
        .status.error { 
            background: var(--error);
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
            border: 1px solid transparent;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        /* ===== ОСНОВНОЙ ЛЭЙАУТ ===== */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ — КОМАНДЫ ===== */
        .sidebar {
            width: 200px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px 0;
            position: relative;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 10%;
            height: 80%;
            width: 1px;
            background: linear-gradient(180deg, transparent, var(--accent-primary), transparent);
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .command-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .command-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .command-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            border-left-color: var(--accent-primary);
        }

        .command-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0.7;
        }

        .command-key {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-primary);
            margin-left: auto;
            opacity: 0.6;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-deep);
        }

        /* ===== ЧАТ ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .message-bubble {
            padding: 12px 18px;
            line-height: 1.6;
            font-size: 14px;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .message-bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
        }

        .message.user .message-bubble::after {
            content: '◈';
            position: absolute;
            bottom: -8px;
            right: 12px;
            color: var(--border-glow);
            font-size: 12px;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.assistant .message-bubble {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }

        .message.assistant .message-bubble::before {
            content: '△';
            position: absolute;
            top: -8px;
            left: 12px;
            color: var(--border-subtle);
            font-size: 12px;
        }

        .message.system {
            align-self: center;
            max-width: 60%;
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 8px;
            border: none;
            font-style: italic;
        }

        /* ===== ОБЛАСТЬ ВВОДА ===== */
        .input-area {
            padding: 20px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
        }

        .input-area::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .message-input:focus {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
        }

        .message-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            border-color: var(--border-glow);
            color: var(--accent-primary);
            background: var(--bg-surface-hover);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== ИНДИКАТОР ПЕЧАТИ ===== */
        .typing {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .typing-dots {
            display: flex;
            gap: 6px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(1) { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .typing-dot:nth-child(2) { clip-path: circle(50% at 50% 50%); animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); transform: rotate(180deg); animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== КОД В СООБЩЕНИЯХ ===== */
        .message pre {
            background: var(--bg-deep);
            padding: 12px;
            border: 1px solid var(--border-subtle);
            overflow-x: auto;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.4;
        }

        .message code {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--bg-deep);
            padding: 2px 6px;
            border: 1px solid var(--border-subtle);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .dropzone {
            border: 1px dashed var(--border-subtle);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-deep);
        }

        .dropzone:hover {
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn:hover {
            border-color: var(--border-glow);
            background: var(--bg-surface-hover);
        }

        .btn-primary {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-primary);
            color: var(--bg-deep);
            border-color: var(--accent-primary);
        }

        /* ===== ТОСТЫ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            font-size: 12px;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }

        /* ===== СКРОЛЛБАР ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-glow);
        }

        /* ===== УТИЛИТЫ ===== */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Хедер -->
    <header class="header">
        <div class="header-left">
            <div class="logo"><span>◈</span></div>
            <div class="header-title">/engineer</div>
        </div>
        <div class="header-right">
            <button class="btn-icon" onclick="openPatchModal()" title="загрузить патч">↑</button>
            <button class="btn-icon" onclick="document.getElementById('fileUpload').click()" title="загрузить файл">◉</button>
            <button class="btn-icon" onclick="refreshModules()" title="обновить модули">↻</button>
            <div class="status" id="status"></div>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="main">
        <!-- Левая панель с командами -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">команды</div>
                <div class="command-list">
                    <div class="command-item" onclick="quickAction('seeds')">
                        <span class="command-icon">○</span>
                        <span>семена</span>
                        <span class="command-key">/seeds</span>
                    </div>
                    <div class="command-item" onclick="quickAction('milestones')">
                        <span class="command-icon">◈</span>
                        <span>вехи</span>
                        <span class="command-key">/milestones</span>
                    </div>
                    <div class="command-item" onclick="quickAction('status')">
                        <span class="command-icon">◉</span>
                        <span>статус</span>
                        <span class="command-key">/status</span>
                    </div>
                    <div class="command-item" onclick="quickAction('modules')">
                        <span class="command-icon">□</span>
                        <span>модули</span>
                        <span class="command-key">/modules</span>
                    </div>
                    <div class="command-item" onclick="quickAction('help')">
                        <span class="command-icon">?</span>
                        <span>помощь</span>
                        <span class="command-key">/help</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">модули</div>
                <div class="command-list" id="moduleList">
                    <div class="command-item" data-module="initium">
                        <span class="command-icon">⚡</span>
                        <span>initium</span>
                    </div>
                    <div class="command-item" data-module="sphaerae">
                        <span class="command-icon">◉</span>
                        <span>sphaerae</span>
                    </div>
                    <div class="command-item" data-module="akasha_chronicorum">
                        <span class="command-icon">◈</span>
                        <span>akasha</span>
                    </div>
                    <div class="command-item" data-module="philosophia">
                        <span class="command-icon">◇</span>
                        <span>philosophia</span>
                    </div>
                    <div class="command-item" data-module="geometria_sacra">
                        <span class="command-icon">△</span>
                        <span>geometria</span>
                    </div>
                    <div class="command-item" data-module="incubae">
                        <span class="command-icon">○</span>
                        <span>incubae</span>
                    </div>
                    <div class="command-item" data-module="tectosphaera">
                        <span class="command-icon">□</span>
                        <span>tectosphaera</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Чат (единственная вкладка) -->
        <main class="content">
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message system">
                        <div class="message-bubble">
                            установка соединения...
                        </div>
                    </div>
                </div>
                
                <div class="typing hidden" id="typing">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span>ср печатает</span>
                </div>
                
                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            class="message-input" 
                            id="messageInput" 
                            placeholder="сообщение..."
                            disabled
                        >
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>→</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно загрузки патча -->
    <div class="modal-overlay" id="patchModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">загрузка патча</div>
                <button class="modal-close" onclick="closePatchModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <div>перетащите json или нажмите для выбора</div>
                    <input type="file" id="fileInput" accept=".json" hidden onchange="handleFileSelect(event)">
                </div>
                <div class="patch-preview hidden" id="patchPreview">
                    <pre id="patchContent"></pre>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closePatchModal()">отмена</button>
                <button class="btn btn-primary hidden" id="applyPatchBtn" onclick="applyPatch()">применить</button>
            </div>
        </div>
    </div>

    <!-- Скрытый input для загрузки файлов -->
    <input type="file" id="fileUpload" style="display: none" onchange="uploadFile(this)">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== КОНФИГУРАЦИЯ =====
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        const API_URL = 'https://mandala-engineer-chat.onrender.com';
        
        const SESSION_ID = localStorage.getItem('mc_session') || (() => {
            const id = 'mc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            localStorage.setItem('mc_session', id);
            return id;
        })();

        // ===== СОСТОЯНИЕ =====
        let ws = null;
        let modulesCache = {};
        let currentPatch = null;
        let messageBuffer = '';
        let currentMessageDiv = null;

        // ===== DOM =====
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        function init() {
            connect();
            setupModules();
            setupKeyboard();
            setupDragDrop();
        }

        // ===== WEBSOCKET =====
        function connect() {
            updateStatus('connecting');
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'init',
                    session_id: SESSION_ID
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onclose = () => {
                updateStatus('error');
                disableInput();
                showToast('соединение разорвано', 'error');
                setTimeout(connect, 3000);
            };
            
            ws.onerror = () => {
                updateStatus('error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    updateStatus('connected');
                    enableInput();
                    addSystemMessage(`соединение установлено [${data.session_id}]`);
                    addSystemMessage(`модулей: ${data.modules_loaded?.length || 0}`);
                    break;
                    
                case 'history':
                    messagesEl.innerHTML = '';
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            if (msg.role === 'user') {
                                addUserMessage(msg.content);
                            } else if (msg.role === 'assistant') {
                                const div = createMessageElement('assistant');
                                div.querySelector('.message-bubble').textContent = msg.content;
                                messagesEl.appendChild(div);
                            }
                        });
                    } else {
                        addSystemMessage('новая сессия');
                    }
                    scrollToBottom();
                    break;
                    
                case 'system':
                    addSystemMessage(data.text);
                    break;
                    
                case 'stream':
                    handleStream(data.content);
                    break;
                    
                case 'done':
                    finishMessage();
                    break;
                    
                case 'error':
                    showToast(data.text, 'error');
                    hideTyping();
                    break;
                    
                case 'module_direct':
                    displayModuleDirect(data.name, data.content);
                    addSystemMessage(`модуль ${data.name} получен`);
                    break;
                    
                case 'modules_refreshed':
                    showToast(`обновлено ${data.count} модулей`, 'success');
                    break;
                    
                case 'pong':
                    break;
            }
        }

        // ===== СООБЩЕНИЯ =====
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            addUserMessage(text);
            inputEl.value = '';
            showTyping();
            
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function handleStream(content) {
            if (!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant');
                messagesEl.appendChild(currentMessageDiv);
            }
            
            messageBuffer += content;
            currentMessageDiv.querySelector('.message-bubble').innerHTML = formatMessage(messageBuffer);
            scrollToBottom();
        }

        function finishMessage() {
            hideTyping();
            currentMessageDiv = null;
            messageBuffer = '';
        }

        // ===== ЗАГРУЗКА ФАЙЛОВ =====
        function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result.split(',')[1];
                ws.send(JSON.stringify({
                    type: 'file',
                    name: file.name,
                    content: content,
                    type: file.type,
                    session_id: SESSION_ID
                }));
                addSystemMessage(`📁 файл ${file.name} отправлен`);
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // ===== UI ХЕЛПЕРЫ =====
        function createMessageElement(role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="message-header">${role === 'user' ? 'садовник' : 'ср'}</div>
                <div class="message-bubble"></div>
            `;
            return div;
        }

        function addUserMessage(text) {
            const div = createMessageElement('user');
            div.querySelector('.message-bubble').textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function formatMessage(text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            return html
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        function showTyping() {
            typingEl.classList.remove('hidden');
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.classList.add('hidden');
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ===== СТАТУС =====
        function updateStatus(state) {
            statusEl.className = 'status ' + state;
        }

        function enableInput() {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function disableInput() {
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        // ===== МОДУЛИ =====
        function setupModules() {
            document.querySelectorAll('.command-item[data-module]').forEach(item => {
                item.addEventListener('click', () => {
                    const name = item.dataset.module;
                    requestModule(name);
                });
            });
        }

        function requestModule(name) {
            if (modulesCache[name]) {
                displayModuleDirect(name, modulesCache[name]);
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'module',
                    name: name,
                    session_id: SESSION_ID
                }));
            }
        }

        function displayModuleDirect(name, content) {
            modulesCache[name] = content;
            
            try {
                const parsed = JSON.parse(content);
                const formatted = JSON.stringify(parsed, null, 2);
                const preview = formatted.slice(0, 500) + (formatted.length > 500 ? '...' : '');
                
                addSystemMessage(`📦 модуль ${name}:`);
                addSystemMessage(`<pre>${escapeHtml(preview)}</pre>`);
            } catch {
                addSystemMessage(`📦 модуль ${name} получен`);
            }
        }

        // ===== БЫСТРЫЕ ДЕЙСТВИЯ =====
        function quickAction(action) {
            const commands = {
                'seeds': 'покажи активные семена',
                'milestones': 'последние milestones',
                'status': 'статус системы',
                'modules': 'список модулей',
                'help': 'доступные команды: /seeds, /milestones, /status, /modules, /help'
            };
            sendDirectMessage(commands[action] || action);
        }

        function sendDirectMessage(text) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('нет соединения', 'error');
                return;
            }
            addUserMessage(text);
            showTyping();
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function refreshModules() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('нет соединения', 'error');
                return;
            }
            ws.send(JSON.stringify({
                type: 'refresh_modules',
                session_id: SESSION_ID
            }));
            showToast('обновление модулей...', 'success');
        }

        // ===== ПАТЧИ =====
        function openPatchModal() {
            document.getElementById('patchModal').classList.add('active');
            document.getElementById('patchPreview').classList.add('hidden');
            document.getElementById('applyPatchBtn').classList.add('hidden');
            currentPatch = null;
        }

        function closePatchModal() {
            document.getElementById('patchModal').classList.remove('active');
        }

        function setupDragDrop() {
            const dropzone = document.getElementById('dropzone');
            
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('active');
            });
            
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('active');
            });
            
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('active');
                const file = e.dataTransfer.files[0];
                if (file) readFile(file);
            });
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) readFile(file);
        }

        function readFile(file) {
            if (!file.name.endsWith('.json')) {
                showToast('требуется json', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const content = e.target.result;
                    JSON.parse(content);
                    currentPatch = content;
                    
                    document.getElementById('patchContent').textContent = content.slice(0, 500) + '...';
                    document.getElementById('patchPreview').classList.remove('hidden');
                    document.getElementById('applyPatchBtn').classList.remove('hidden');
                } catch (err) {
                    showToast('невалидный json', 'error');
                }
            };
            reader.readAsText(file);
        }

        async function applyPatch() {
            if (!currentPatch) return;
            
            closePatchModal();
            showToast('применение патча...', 'success');
            
            try {
                const response = await fetch(`${API_URL}/api/apply-patch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: currentPatch
                });
                
                if (response.ok) {
                    showToast('патч применён', 'success');
                    refreshModules();
                } else {
                    showToast('ошибка применения', 'error');
                }
            } catch (err) {
                showToast('ошибка сети', 'error');
            }
        }

        // ===== KEYBOARD =====
        function setupKeyboard() {
            inputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // ===== УТИЛИТЫ =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== СТАРТ =====
        init();
    </script>
</body>
</html>
