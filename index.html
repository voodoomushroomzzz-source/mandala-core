<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ Mandala Engineer</title>
    <style>
        :root {
            --void: #050508;
            --deep: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a25;
            --border: #252533;
            --border-glow: #3a3a55;
            
            /* Фиолетовая тема + белый */
            --star: #ffffff;
            --star-dim: #a0a0b0;
            --nebula: #a855f7;
            --nebula-dim: #7c3aed;
            --nebula-glow: #c084fc;
            --nebula-pale: #e9d5ff;
            
            --font-mono: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            --radius: 6px;
            --radius-sm: 3px;
            --sidebar-width: 200px;
            --sidebar-collapsed: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--void);
            color: var(--star);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            height: 44px;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Initium — монохромный, не выбивается */
        .logo {
            width: 24px;
            height: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--star);
        }

        .header-title {
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: var(--star);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            width: 28px;
            height: 28px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--star-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            color: var(--star);
            border-color: var(--border-glow);
            background: var(--surface);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-glow);
            margin-left: 6px;
        }

        .status-dot.connected {
            background: var(--nebula);
            box-shadow: 0 0 8px var(--nebula);
        }

        .status-dot.connecting {
            background: var(--nebula-dim);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s ease;
            position: relative;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-toggle {
            position: absolute;
            right: -10px;
            top: 10px;
            width: 20px;
            height: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--star-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            z-index: 10;
        }

        .sidebar-section {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        /* ЯРКОСТЬ ТЕКСТА МЕНЮ — +25% */
        .sidebar-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--star);
            opacity: 1;
            margin-bottom: 6px;
            filter: brightness(1.25);
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .module-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            color: var(--star);
            opacity: 1;
            filter: brightness(1.25);
            transition: all 0.1s ease;
            font-family: var(--font-mono);
        }

        .module-item:hover {
            background: var(--surface);
        }

        .module-item.active {
            background: var(--surface);
            color: var(--nebula-glow);
        }

        .module-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--star-dim);
        }

        .module-item.active .module-icon {
            color: var(--nebula-glow);
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            color: var(--star);
            opacity: 1;
            filter: brightness(1.25);
            background: transparent;
            border: none;
            text-align: left;
            font-family: var(--font-mono);
            transition: all 0.1s ease;
        }

        .quick-btn:hover {
            background: var(--surface);
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== TABS ===== */
        .tabs {
            height: 32px;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 4px;
            flex-shrink: 0;
        }

        .tab {
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            color: var(--star-dim);
            border: none;
            background: transparent;
            transition: all 0.1s ease;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab:hover {
            color: var(--star);
        }

        .tab.active {
            color: var(--nebula-glow);
            background: var(--surface);
        }

        /* ===== CHAT ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 92%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            animation: fade-in 0.2s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--star-dim);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .message-bubble {
            padding: 10px 12px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .message-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--star);
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.assistant .message-bubble {
            background: var(--deep);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system {
            align-self: center;
            max-width: 80%;
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--star-dim);
            font-size: 10px;
            text-align: center;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* ===== CODE BLOCK — КОМПАКТНЫЕ КНОПКИ ===== */
        .code-block {
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--deep);
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .code-lang {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--nebula-glow);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* КОМПАКТНАЯ ГРУППА КНОПОК — МИНИМАЛИЗМ В СИМВОЛАХ */
        .code-actions {
            display: flex;
            gap: 2px;
        }

        .code-btn {
            width: 22px;
            height: 22px;
            background: var(--deep);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--star-dim);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .code-btn:hover {
            color: var(--star);
            border-color: var(--border-glow);
            background: var(--surface);
        }

        .code-btn.apply:hover {
            color: var(--nebula-glow);
            border-color: var(--nebula-dim);
        }

        .code-content {
            padding: 10px;
            overflow-x: auto;
            background: var(--deep);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            color: var(--star);
            max-height: 400px;
            overflow-y: auto;
        }

        /* Подсветка синтаксиса — фиолетовые акценты */
        .code-content .key { color: var(--nebula-glow); }
        .code-content .string { color: var(--nebula-pale); }
        .code-content .number { color: var(--star); }
        .code-content .bool { color: var(--nebula); }
        .code-content .null { color: var(--star-dim); }

        /* ===== INPUT ===== */
        .input-area {
            padding: 10px 14px;
            background: var(--deep);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        /* TEXTAREA вместо input — для переносов строк */
        .message-input {
            width: 100%;
            min-height: 36px;
            max-height: 120px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--star);
            font-size: 14px;
            line-height: 1.4;
            outline: none;
            resize: none;
            font-family: var(--font-sans);
            overflow-y: auto;
        }

        .message-input:focus {
            border-color: var(--nebula-dim);
        }

        .message-input::placeholder {
            color: var(--star-dim);
        }

        .btn-attach {
            width: 32px;
            height: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--star-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.1s ease;
        }

        .btn-attach:hover {
            color: var(--star);
            border-color: var(--border-glow);
        }

        .btn-send {
            width: 32px;
            height: 32px;
            background: var(--nebula-dim);
            border: none;
            border-radius: var(--radius);
            color: var(--void);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.1s ease;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--nebula);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== TYPING ===== */
        .typing {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            color: var(--nebula-glow);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background: var(--nebula);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== SEEDS ===== */
        .seeds-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }

        .seeds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }

        .seed-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .seed-card:hover {
            border-color: var(--nebula-dim);
        }

        .seed-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .seed-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--star);
        }

        .seed-id {
            font-size: 9px;
            color: var(--star-dim);
            font-family: var(--font-mono);
        }

        .seed-desc {
            font-size: 11px;
            color: var(--star-dim);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .seed-meta {
            display: flex;
            gap: 4px;
            font-size: 9px;
        }

        .seed-badge {
            padding: 2px 6px;
            background: var(--deep);
            border-radius: var(--radius-sm);
            color: var(--star-dim);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-glow);
        }

        /* ===== UTILS ===== */
        .hidden { display: none !important; }
        
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        code {
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--deep);
            padding: 1px 4px;
            border-radius: var(--radius-sm);
            color: var(--nebula-glow);
        }

        .file-attachment {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin: 0 14px 8px;
            font-size: 11px;
            color: var(--star);
        }

        .file-attachment .remove {
            margin-left: auto;
            cursor: pointer;
            color: var(--star-dim);
        }

        .file-attachment .remove:hover {
            color: var(--star);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">◈</div>
            <div class="header-title">MANDALA ENGINEER</div>
        </div>
        <div class="header-right">
            <button class="btn-icon" onclick="refreshModules()" title="Обновить">↻</button>
            <button class="btn-icon" onclick="openPatchModal()" title="Патч">△</button>
            <div class="status-dot" id="statusDot"></div>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
            
            <div class="sidebar-section">
                <div class="sidebar-title">◈ Модули</div>
                <div class="module-list" id="moduleList">
                    <div class="module-item" data-module="initium">
                        <span class="module-icon">◉</span>
                        <span>initium</span>
                    </div>
                    <div class="module-item" data-module="sphaerae">
                        <span class="module-icon">◉</span>
                        <span>sphaerae</span>
                    </div>
                    <div class="module-item" data-module="akasha_chronicorum">
                        <span class="module-icon">◉</span>
                        <span>akasha</span>
                    </div>
                    <div class="module-item" data-module="philosophia">
                        <span class="module-icon">◉</span>
                        <span>philosophia</span>
                    </div>
                    <div class="module-item" data-module="geometria_sacra">
                        <span class="module-icon">◉</span>
                        <span>geometria</span>
                    </div>
                    <div class="module-item" data-module="incubae">
                        <span class="module-icon">◉</span>
                        <span>incubae</span>
                    </div>
                    <div class="module-item" data-module="tectosphaera">
                        <span class="module-icon">◉</span>
                        <span>tectosphaera</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">◈ Навигация</div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAction('seeds')">
                        <span>◉</span>
                        <span>семена</span>
                    </button>
                    <button class="quick-btn" onclick="quickAction('milestones')">
                        <span>◉</span>
                        <span>вехи</span>
                    </button>
                    <button class="quick-btn" onclick="quickAction('status')">
                        <span>◉</span>
                        <span>статус</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="tabs">
                <button class="tab active" data-tab="chat">◈ чат</button>
                <button class="tab" data-tab="incubae">◈ семена</button>
            </div>

            <div class="tab-content active" id="tab-chat">
                <div class="chat-container">
                    <div class="messages" id="messages">
                        <div class="message system">
                            <div class="message-bubble">◈ соединение...</div>
                        </div>
                    </div>
                    
                    <div class="typing hidden" id="typing">
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                        <span>СР печатает</span>
                    </div>
                    
                    <div id="filePreview" class="hidden">
                        <div class="file-attachment">
                            <span>◈</span>
                            <span id="fileName">file</span>
                            <span class="remove" onclick="clearFile()">×</span>
                        </div>
                    </div>
                    
                    <div class="input-area">
                        <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Файл">◎</button>
                        <div class="input-wrapper">
                            <textarea 
                                class="message-input" 
                                id="messageInput" 
                                rows="1"
                                placeholder="Впиши волну…"
                                disabled
                            ></textarea>
                        </div>
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-incubae">
                <div class="seeds-container">
                    <div class="seeds-grid" id="seedsGrid">
                        <div class="empty-state">
                            <div class="message system">
                                <div class="message-bubble">◈ загрузка семян...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <input type="file" id="fileInput" accept=".json,.txt,.md,.py" style="display: none" onchange="handleFileSelect(event)">

    <script>
        // Конфиг для Render + Moonshot
        const WS_URL = window.location.protocol === 'https:' 
            ? `wss://${window.location.host}/ws`
            : `ws://${window.location.host}/ws`;
        
        const SESSION_ID = localStorage.getItem('mc_session') || (() => {
            const id = 'mc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            localStorage.setItem('mc_session', id);
            return id;
        })();

        let ws = null;
        let currentModule = null;
        let pendingFile = null;
        let sidebarCollapsed = localStorage.getItem('mc_sidebar_collapsed') === 'true';
        let messageBuffer = '';
        let currentMessageDiv = null;

        const statusDot = document.getElementById('statusDot');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const sidebar = document.getElementById('sidebar');

        function init() {
            if (sidebarCollapsed) sidebar.classList.add('collapsed');
            connect();
            setupTabs();
            setupModules();
            setupKeyboard();
            setupDragDrop();
            setupTextarea();
        }

        function setupTextarea() {
            // Автовысота textarea
            inputEl.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            sidebar.classList.toggle('collapsed', sidebarCollapsed);
            localStorage.setItem('mc_sidebar_collapsed', sidebarCollapsed);
        }

        function connect() {
            updateStatus('connecting');
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'init',
                    session_id: SESSION_ID
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            };
            
            ws.onclose = () => {
                updateStatus('error');
                disableInput();
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (e) => {
                console.error('WS error:', e);
                updateStatus('error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    updateStatus('connected');
                    enableInput();
                    addSystemMessage(`◈ connected [${data.session_id}]`);
                    addSystemMessage(`◈ modules: ${data.modules_loaded?.length || 0}`);
                    break;
                    
                case 'history':
                    messagesEl.innerHTML = '';
                    if (data.messages?.length) {
                        data.messages.forEach(msg => {
                            if (msg.role === 'user') addUserMessage(msg.content);
                            else if (msg.role === 'assistant') appendFullMessage(msg.content);
                        });
                    }
                    scrollToBottom();
                    break;
                    
                case 'system':
                    addSystemMessage(data.text);
                    break;
                    
                case 'stream':
                    handleStream(data.content);
                    break;
                    
                case 'done':
                    finishMessage();
                    break;
                    
                case 'error':
                    addSystemMessage(`◈ error: ${data.text}`);
                    hideTyping();
                    finishMessage();
                    break;
                    
                case 'module_direct':
                    addSystemMessage(`◈ module ${data.name} loaded`);
                    break;
                    
                case 'modules_refreshed':
                    addSystemMessage(`◈ refreshed ${data.count} modules`);
                    break;
                    
                case 'file_processed':
                    addSystemMessage(data.summary);
                    break;
                    
                case 'patch_result':
                    data.results?.forEach(r => {
                        const icon = r.status === 'success' ? '◈' : '×';
                        addSystemMessage(`${icon} ${r.module}: ${r.message}`);
                    });
                    break;
            }
        }

        function handleStream(content) {
            if (!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant');
                messagesEl.appendChild(currentMessageDiv);
            }
            
            messageBuffer += content;
            currentMessageDiv.querySelector('.message-bubble').innerHTML = parseContent(messageBuffer);
            scrollToBottom();
        }

        function parseContent(text) {
            let html = escapeHtml(text);
            
            // Блоки кода
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return renderCodeBlock(lang, code);
            });
            
            // Инлайн-код
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Жирный — фиолетовый
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong style="color: var(--nebula-glow);">$1</strong>');
            
            // Переносы строк
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        function renderCodeBlock(lang, code) {
            return `
                <div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${lang || 'code'}</span>
                        <div class="code-actions">
                            <button class="code-btn" onclick="copyCode(this)" title="Копировать">⎘</button>
                            <button class="code-btn" onclick="downloadCode(this)" title="Скачать">↓</button>
                            ${lang === 'json' ? '<button class="code-btn apply" onclick="applyCode(this)" title="Применить">△</button>' : ''}
                        </div>
                    </div>
                    <pre class="code-content">${escapeHtml(code)}</pre>
                </div>
            `;
        }

        function finishMessage() {
            hideTyping();
            currentMessageDiv = null;
            messageBuffer = '';
        }

        function appendFullMessage(text) {
            const div = createMessageElement('assistant');
            div.querySelector('.message-bubble').innerHTML = parseContent(text);
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ===== ДЕЙСТВИЯ С КОДОМ =====
        window.copyCode = function(btn) {
            const code = btn.closest('.code-block').querySelector('.code-content').textContent;
            navigator.clipboard.writeText(code);
        };

        window.downloadCode = function(btn) {
            const block = btn.closest('.code-block');
            const code = block.querySelector('.code-content').textContent;
            const lang = block.querySelector('.code-lang').textContent || 'txt';
            
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.applyCode = function(btn) {
            const code = btn.closest('.code-block').querySelector('.code-content').textContent;
            try {
                const json = JSON.parse(code);
                // Отправляем как патч
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'apply_patch',
                        patch: json,
                        session_id: SESSION_ID
                    }));
                    addSystemMessage('◈ patch sent');
                }
            } catch (e) {
                addSystemMessage('× invalid json');
            }
        };

        // ===== ОТПРАВКА СООБЩЕНИЙ =====
        function sendMessage() {
            const text = inputEl.value.trim();
            
            if (pendingFile) {
                sendFile(pendingFile, text);
                clearFile();
                inputEl.value = '';
                inputEl.style.height = 'auto';
                return;
            }
            
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            addUserMessage(text);
            inputEl.value = '';
            inputEl.style.height = 'auto';
            showTyping();
            
            ws.send(JSON.stringify({
                type: 'ask',
                text: text,
                session_id: SESSION_ID
            }));
        }

        function sendFile(file, caption = '') {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            showTyping();
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result.split(',')[1];
                
                ws.send(JSON.stringify({
                    type: 'file',
                    name: file.name,
                    content: content,
                    file_type: file.type || 'application/octet-stream',
                    caption: caption,
                    session_id: SESSION_ID
                }));
                
                addSystemMessage(`◈ file: ${file.name}`);
            };
            reader.readAsDataURL(file);
        }

        // ===== ФАЙЛЫ =====
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            pendingFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('filePreview').classList.remove('hidden');
            inputEl.focus();
        }

        function clearFile() {
            pendingFile = null;
            document.getElementById('filePreview').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        function setupDragDrop() {
            ['dragover', 'dragleave', 'drop'].forEach(evt => {
                document.addEventListener(evt, (e) => {
                    e.preventDefault();
                    if (evt === 'drop' && e.dataTransfer.files.length) {
                        pendingFile = e.dataTransfer.files[0];
                        document.getElementById('fileName').textContent = pendingFile.name;
                        document.getElementById('filePreview').classList.remove('hidden');
                    }
                });
            });
        }

        // ===== КЛАВИАТУРА =====
        function setupKeyboard() {
            inputEl.addEventListener('keydown', (e) => {
                // Shift+Enter = новая строка
                if (e.key === 'Enter' && e.shiftKey) {
                    e.stopPropagation();
                    return; // позволяем textarea вставить \n
                }
                
                // Enter = отправить
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // ===== UI =====
        function createMessageElement(role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const icon = role === 'user' ? '◉' : role === 'assistant' ? '◈' : '○';
            const name = role === 'user' ? 'ты' : role === 'assistant' ? 'СР' : 'система';
            
            div.innerHTML = `
                <div class="message-header">${icon} ${name}</div>
                <div class="message-bubble"></div>
            `;
            return div;
        }

        function addUserMessage(text) {
            const div = createMessageElement('user');
            div.querySelector('.message-bubble').textContent = text;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus(state) {
            statusDot.className = 'status-dot ' + state;
        }

        function enableInput() {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function disableInput() {
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        function showTyping() {
            typingEl.classList.remove('hidden');
            scrollToBottom();
        }

        function hideTyping() {
            typingEl.classList.add('hidden');
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ===== ТАБЫ =====
        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
                    
                    if (tab.dataset.tab === 'incubae') loadSeeds();
                });
            });
        }

        // ===== МОДУЛИ =====
        function setupModules() {
            document.querySelectorAll('.module-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.module-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'module',
                            name: item.dataset.module,
                            session_id: SESSION_ID
                        }));
                    }
                });
            });
        }

        // ===== СЕМЕНА =====
        async function loadSeeds() {
            const grid = document.getElementById('seedsGrid');
            grid.innerHTML = '<div class="message system"><div class="message-bubble">◈ loading...</div></div>';
            
            try {
                const res = await fetch('https://raw.githubusercontent.com/voodoomushroomzzz-source/mandala-core/main/incubae.json');
                const data = await res.json();
                const seeds = data.seeds || [];
                
                if (!seeds.length) {
                    grid.innerHTML = '<div class="message system"><div class="message-bubble">◈ no seeds</div></div>';
                    return;
                }
                
                grid.innerHTML = seeds.map(s => `
                    <div class="seed-card" onclick="askSeed('${s.id}')">
                        <div class="seed-header">
                            <div class="seed-title">${escapeHtml(s.name || 'untitled')}</div>
                            <div class="seed-id">${s.id}</div>
                        </div>
                        <div class="seed-desc">${escapeHtml(s.description || '')}</div>
                        <div class="seed-meta">
                            <span class="seed-badge">${s.version || 'v1'}</span>
                            <span class="seed-badge">${s.status || 'active'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<div class="message system"><div class="message-bubble">× ${err.message}</div></div>`;
            }
        }

        window.askSeed = function(id) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            addUserMessage(`seed ${id}`);
            showTyping();
            ws.send(JSON.stringify({
                type: 'ask',
                text: `Расскажи о семени ${id}`,
                session_id: SESSION_ID
            }));
        };

        function quickAction(action) {
            const texts = {
                seeds: 'Покажи активные семена',
                milestones: 'Покажи последние milestones',
                status: 'Статус системы'
            };
            if (ws && ws.readyState === WebSocket.OPEN) {
                addUserMessage(texts[action]);
                showTyping();
                ws.send(JSON.stringify({
                    type: 'ask',
                    text: texts[action],
                    session_id: SESSION_ID
                }));
            }
        }

        function refreshModules() {
            if (!ws || ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'refresh_modules',
                    session_id: SESSION_ID
                }));
                addSystemMessage('◈ refreshing...');
            }
        }

        function openPatchModal() {
            // Заглушка — патчи через кнопки в коде
            addSystemMessage('◈ use △ in code blocks');
        }

        init();
    </script>
</body>
</html>
