<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala Engineer Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 {
            color: #00d4aa;
            border-bottom: 2px solid #00d4aa;
            padding-bottom: 10px;
        }
        #status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .connected { background: #00d4aa; color: #1a1a2e; }
        .disconnected { background: #ff6b6b; color: white; }
        .connecting { background: #ffd93d; color: #1a1a2e; }
        
        #messages {
            height: 400px;
            overflow-y: auto;
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }
        .user { background: #0f3460; margin-left: 20%; }
        .assistant { background: #1a1a2e; margin-right: 20%; border-left: 3px solid #00d4aa; }
        .system { background: #533483; font-style: italic; font-size: 0.9em; }
        .error { background: #ff6b6b; color: white; }
        
        #inputArea {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            background: #00d4aa;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #00b894; }
        button:disabled { background: #666; cursor: not-allowed; }
        
        .command-hint {
            margin-top: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .command-hint code {
            background: #0f3460;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4aa;
        }
    </style>
</head>
<body>
    <h1>🔧 Mandala Engineer Chat</h1>
    
    <div id="status" class="disconnected">⭕ Отключено</div>
    
    <div id="messages"></div>
    
    <div id="inputArea">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Отправить</button>
    </div>
    
    <div class="command-hint">
        <strong>Команды:</strong><br>
        <code>привет</code> — простой диалог<br>
        <code>модуль [имя]</code> — запросить модуль (пока заглушка)<br>
        Кнопка <strong>Enter</strong> — отправить
    </div>

    <script>
        let ws = null;
        let currentMessageDiv = null;
        let fullResponse = '';
        
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        function connect() {
            statusDiv.className = 'connecting';
            statusDiv.textContent = '🟡 Подключение...';
            
            // Используем относительный путь для WebSocket (будет работать на Render)
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                statusDiv.className = 'connected';
                statusDiv.textContent = '🟢 Подключено к СР';
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                addMessage('system', 'Соединение установлено. СР готов к диалогу.');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onclose = () => {
                statusDiv.className = 'disconnected';
                statusDiv.textContent = '🔴 Отключено';
                input.disabled = true;
                sendBtn.disabled = true;
                addMessage('error', 'Соединение разорвано. Перезагрузите страницу.');
            };
            
            ws.onerror = (error) => {
                statusDiv.className = 'disconnected';
                statusDiv.textContent = '❌ Ошибка соединения';
                addMessage('error', 'Ошибка WebSocket: ' + error);
            };
        }
        
        function handleMessage(data) {
            if (data.type === 'stream') {
                if (!currentMessageDiv) {
                    currentMessageDiv = document.createElement('div');
                    currentMessageDiv.className = 'message assistant';
                    messagesDiv.appendChild(currentMessageDiv);
                }
                fullResponse += data.content;
                currentMessageDiv.textContent = fullResponse;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                
            } else if (data.type === 'done') {
                currentMessageDiv = null;
                fullResponse = '';
                addMessage('system', '✓ Ответ получен');
                
            } else if (data.type === 'error') {
                addMessage('error', 'Ошибка: ' + data.text);
                currentMessageDiv = null;
                fullResponse = '';
                
            } else if (data.type === 'module') {
                addMessage('system', `Модуль ${data.name}: ${data.status}`);
                if (data.note) {
                    addMessage('assistant', data.note);
                }
            }
        }
        
        function addMessage(type, text) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function sendMessage() {
            const text = input.value.trim();
            if (!text || !ws) return;
            
            let message = {};
            if (text.startsWith('модуль ') || text.startsWith('module ')) {
                const name = text.split(' ')[1];
                message = { type: 'module', name: name };
                addMessage('user', `📦 Запрос модуля: ${name}`);
            } else {
                message = { type: 'ask', text: text };
                addMessage('user', text);
            }
            
            ws.send(JSON.stringify(message));
            input.value = '';
            currentMessageDiv = null;
            fullResponse = '';
        }
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        connect();
    </script>
</body>
</html>
