repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: strip-html-escape
        name: strip-html-escape
        entry: python scripts/strip_html_escape.py
        language: python
        files: \.(py|toml|yaml|yml|json)$
        pass_filenames: true