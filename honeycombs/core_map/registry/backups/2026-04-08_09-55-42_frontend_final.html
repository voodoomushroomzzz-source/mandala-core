<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ Mandala Engineer — MYCEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@300;400;500&family=Nunito:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <!-- Marked.js для markdown таблиц -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        :root {
            --bg: #030d09;
            --surface: #071209;
            --surface-2: #0a1a10;
            --line: #0f2518;
            --line-2: #193a26;
            --green: #059669;
            --green-2: #10b981;
            --green-bright: #34d399;
            --green-neon: #6ee7b7;
            --green-glow: rgba(16,185,129,0.12);
            --violet: #7c3aed;
            --violet-soft: #a78bfa;
            --violet-dim: rgba(124,58,237,0.12);
            --indigo: #3730a3;
            --indigo-soft: #818cf8;
            --text: #dcfce7;
            --text-2: #5a8a6a;
            --text-3: #254535;
            --text-dim: #3a6a4a;
            --mono: 'Fira Mono', monospace;
            --sans: 'Nunito', sans-serif;
            --copy: #10b981;
            --download: #14b8a6;
            --apply: #a78bfa;
            --radius: 8px;
            --radius-sm: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-weight: 300;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }


        /* ═══════════════════════════════════════════
           ЭКРАН ПАРОЛЯ
        ═══════════════════════════════════════════ */
        /* ══ ЭКРАН ПАРОЛЯ ══ */
        #passwordScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: #030d09;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.8s ease;
        }
        #passwordScreen.hidden { display: none; }

        .pw-scene {
            position: relative; width: 300px; height: 300px;
            margin-bottom: 36px;
        }
        .pw-scene-inner {
            width: 100%; height: 100%; position: relative;
        }
        /* Один слой — просто плоский цветок */
        .pw-layer-b { display: none; }
        .pw-layer-f {
            position: absolute; inset: 0;
        }
        .pw-layer-f svg {
            width: 100%; height: 100%;
            animation: pw-pulse-f 5s ease-in-out infinite alternate;
        }
        @keyframes pw-pulse-f {
            from {
                opacity: 0.45;
                transform: scale(0.94);
                filter: drop-shadow(0 0 6px #10b981) drop-shadow(0 0 14px #7c3aed);
            }
            to {
                opacity: 1;
                transform: scale(1.06);
                filter: drop-shadow(0 0 22px #10b981) drop-shadow(0 0 50px #7c3aed) drop-shadow(0 0 80px #10b981);
            }
        }
        .pw-halo {
            position: absolute; inset: -50px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(16,185,129,0.09) 0%, rgba(124,58,237,0.04) 40%, transparent 68%);
            animation: pw-pulse-f 5s ease-in-out infinite alternate;
        }
        .pw-title {
            font-family: var(--mono); font-size: 11px; letter-spacing: 5px;
            text-transform: uppercase; color: var(--text-2);
            margin-bottom: 28px; text-align: center;
        }
        .pw-hidden-input {
            position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;
        }
        .pw-glyphs {
            display: flex; gap: 9px; align-items: center; justify-content: center;
            padding: 13px 22px;
            border: 1px solid var(--line-2); border-radius: 10px;
            background: rgba(3,13,9,0.85); cursor: text;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .pw-glyphs.active {
            border-color: rgba(16,185,129,0.45);
            box-shadow: 0 0 0 2px rgba(16,185,129,0.1), 0 0 22px rgba(16,185,129,0.06);
        }
        .pw-glyphs.error {
            border-color: #be123c !important;
            box-shadow: 0 0 0 2px rgba(190,18,60,0.25) !important;
            animation: pw-shake 0.4s ease;
        }
        @keyframes pw-shake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-9px); }
            60%     { transform: translateX(9px); }
            80%     { transform: translateX(-4px); }
        }
        .pw-slot {
            width: 18px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            position: relative; flex-shrink: 0;
        }
        .pw-slot svg { width: 100%; height: 100%; display: block; transition: opacity 0.15s; }
        .pw-slot.empty svg  { opacity: 0.13; filter: none; }
        .pw-slot.filled svg {
            opacity: 1; animation: pw-slot-pop 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }
        @keyframes pw-slot-pop {
            from { filter: none; transform: scale(0.5); opacity: 0; }
            to   { filter: drop-shadow(0 0 4px #10b981); transform: scale(1); opacity: 1; }
        }
        .pw-slot.cursor::after {
            content: ''; position: absolute; bottom: 2px; left: 50%;
            transform: translateX(-50%);
            width: 1.5px; height: 11px;
            background: var(--green-bright);
            animation: pw-caret 1s steps(1) infinite;
        }
        @keyframes pw-caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
        .pw-error {
            margin-top: 16px; font-family: var(--mono); font-size: 10px;
            color: #fb7185; letter-spacing: 3px;
            text-align: center; height: 14px;
            opacity: 0; transition: opacity 0.25s;
        }
        .pw-error.show { opacity: 1; }

        /* ══ ТУЛТИП КАРТОЧКИ СОТЫ ══ */
        .hc-tooltip {
            position: absolute; z-index: 200;
            top: calc(100% + 8px); left: 50%;
            transform: translateX(-50%);
            min-width: 180px; max-width: 260px;
            background: var(--surface-2);
            border: 1px solid var(--line-2);
            border-radius: var(--radius);
            padding: 10px 12px;
            pointer-events: none;
            opacity: 0; transition: opacity 0.18s;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(16,185,129,0.05);
        }
        .hc-tooltip.show { opacity: 1; }
        .hc-tooltip-title {
            font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
            color: var(--green-bright); margin-bottom: 7px; text-transform: uppercase;
        }
        .hc-tooltip-file {
            font-family: var(--mono); font-size: 8px; color: var(--text-2);
            padding: 2px 0; border-bottom: 1px solid var(--line);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .hc-tooltip-file:last-child { border-bottom: none; }
        .hc-tooltip::after {
            content: ''; position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-bottom-color: var(--line-2);
        }

        /* Glow pools */
        .glow-pool {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }
        .gp-1 {
            width: 600px; height: 400px;
            top: -100px; right: -200px;
            background: radial-gradient(ellipse, rgba(16,185,129,0.1) 0%, transparent 70%);
            animation: pool-drift 20s ease-in-out infinite alternate;
        }
        .gp-2 {
            width: 400px; height: 400px;
            bottom: -100px; left: -100px;
            background: radial-gradient(ellipse, rgba(124,58,237,0.08) 0%, transparent 70%);
        }
        @keyframes pool-drift {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.15) translate(-20px, 15px); }
        }

        /* Flower of Life с анимированным градиентом */
        .bg-flower {
            position: fixed;
            right: -220px; top: 50%;
            transform: translateY(-50%);
            width: 700px; height: 700px;
            opacity: 0.35;
            pointer-events: none;
            animation: flower-breathe 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
        }
        .bg-flower circle {
            stroke-width: 0.7;
        }
        @keyframes flower-breathe {
            0%   { opacity: 0.20; transform: translateY(-50%) scale(0.97);
                   filter: drop-shadow(0 0 0px rgba(16,185,129,0)) drop-shadow(0 0 0px rgba(124,58,237,0)); }
            50%  { opacity: 0.48; transform: translateY(-50%) scale(1.02);
                   filter: drop-shadow(0 0 6px rgba(16,185,129,0.5)) drop-shadow(0 0 22px rgba(16,185,129,0.22)) drop-shadow(0 0 45px rgba(124,58,237,0.15)); }
            100% { opacity: 0.28; transform: translateY(-50%) scale(0.99);
                   filter: drop-shadow(0 0 2px rgba(16,185,129,0.2)) drop-shadow(0 0 8px rgba(16,185,129,0.08)); }
        }

        /* Header */
        .header {
            height: 52px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green), var(--violet), var(--indigo), transparent);
            opacity: 0.3;
        }

        .h-left { display: flex; align-items: center; gap: 14px; }

        .logo-mark { width: 34px; height: 34px; }
        .logo-mark svg { width: 34px; height: 34px; }

        .brand-text {
            display: flex; flex-direction: column; gap: 1px;
        }
        .brand-name {
            font-family: var(--mono);
            font-size: 11px; font-weight: 400;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: #ffffff;
        }
        .brand-sub {
            font-family: var(--mono);
            font-size: 7px; letter-spacing: 2px; text-transform: uppercase;
            color: #6ee7b7;
        }

        .h-right { display: flex; align-items: center; gap: 12px; }

        .model-display {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #a7f3d0;
            background: transparent;
            border: 1px solid #2d5a4a;
            padding: 5px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* Селектор моделей */
        /* Кнопки выбора моделей удалены — используется только DeepSeek */

        /* Метки моделей в сообщениях */
        .model-label {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 6px;
            opacity: 0.7;
            vertical-align: middle;
        }
        .model-label.deepseek { color: #10b981; border: 1px solid rgba(16,185,129,0.3); }

        .commit-sha {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1.5px;
            color: var(--text-2);
            background: var(--surface-2);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--line-2);
            transition: all 0.4s ease;
            cursor: default;
        }
        .commit-sha.updated {
            color: var(--green-bright);
            border-color: var(--green-2);
            background: rgba(16,185,129,0.1);
            box-shadow: 0 0 10px rgba(16,185,129,0.2);
        }

        .vsep { width: 1px; height: 18px; background: var(--line); }

        .status-orb {
            display: flex; align-items: center; gap: 6px;
        }
        .orb-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green-2);
            box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3);
            animation: orb-pulse 3s ease-in-out infinite;
        }
        @keyframes orb-pulse {
            0%,100% { box-shadow: 0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 6px var(--green-2), 0 0 10px rgba(16,185,129,0.15); }
        }
        .orb-label { display: none; }

        /* Layout */
        .layout { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }

        /* Content (единственная колонка, без боковой панели) */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Tabs */
        .tabs {
            height: 42px;
            border-bottom: 1px solid var(--line);
            display: flex; align-items: center;
            justify-content: center;
            padding: 0 22px;
            flex-shrink: 0;
            gap: 2px;
        }
        .tab {
            font-family: var(--mono); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase;
            color: #5a8a6a;
            background: transparent; border: none;
            cursor: pointer; padding: 0 16px; height: 100%;
            display: flex; align-items: center;
            transition: color 0.15s; position: relative;
        }
        .tab:hover { color: #a7f3d0; }
        .tab.active {
            color: #6ee7b7;
            text-shadow: 0 0 5px #10b981;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 8px; right: 8px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--green-2), transparent);
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 28px 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg {
            display: flex; gap: 13px;
            max-width: 82%;
            min-width: 0;
            animation: mup 0.28s ease;
        }
        /* Сообщения с кодом растягиваем шире */
        .msg.assistant:has(.code-block) {
            max-width: 96%;
        }
        @keyframes mup {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.sys { align-self: center; max-width: 90%; }

        .av { width: 36px; height: 36px; flex-shrink: 0; margin-top: 3px; }
        .av svg { width: 36px; height: 36px; }

        .mbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .mname {
            font-family: var(--mono); font-size: 8px;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-3);
        }
        .msg.user .mname { text-align: right; }

        .bub {
            padding: 12px 16px;
            font-size: 13.5px; line-height: 1.7; font-weight: 300;
            word-break: break-word;
            overflow-wrap: break-word;
            min-width: 0;
            overflow: visible;
        }
        .msg.assistant .bub {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 2px 12px 12px 12px;
            border-left: 2px solid;
            border-image: linear-gradient(to bottom, #10b981, #7c3aed, #3730a3) 1;
            border-image-slice: 1;
        }
        .msg.user .bub {
            background: rgba(124,58,237,0.07);
            border: 1px solid rgba(124,58,237,0.18);
            border-radius: 12px 2px 12px 12px;
            white-space: pre-wrap;
        }
        .msg.sys .bub {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.4);
            color: #6ee7b7;
            text-shadow: 0 0 8px rgba(16,185,129,0.6);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
            border-radius: 6px;
            padding: 10px 16px;
        }

        /* ========== MARKDOWN TABLES ========== */
        .bub table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 12px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .bub table thead {
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(124,58,237,0.15));
        }
        .bub table th {
            padding: 10px 12px;
            text-align: left;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--green-bright);
            border-bottom: 2px solid var(--line-2);
        }
        .bub table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            color: var(--text);
            line-height: 1.5;
        }
        .bub table tbody tr:hover {
            background: rgba(16,185,129,0.05);
        }
        .bub table tbody tr:last-child td {
            border-bottom: none;
        }
        /* Выравнивание по центру для числовых столбцов */
        .bub table td:has(code),
        .bub table th:has(code) {
            text-align: right;
            font-family: var(--mono);
        }

        /* Code blocks */
        .code-block {
            margin: 12px 0; 
            border: 1px solid var(--line-2); 
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        .code-header {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 6px 12px; 
            background: var(--surface-2); 
            border-bottom: 1px solid var(--line-2);
        }
        .code-lang {
            font-family: var(--mono); 
            font-size: 11px; 
            color: var(--green-bright);
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .code-actions { 
            display: flex; 
            gap: 2px; 
            flex-shrink: 0;
            margin-left: auto;
        }
        .code-btn {
            width: 28px;
            height: 24px;
            background: var(--surface); 
            border: 1px solid var(--line-2);
            border-radius: var(--radius-sm); 
            font-size: 12px;
            font-family: var(--mono); 
            cursor: pointer; 
            transition: all 0.15s ease;
            display: flex; 
            align-items: center; 
            justify-content: center;
            line-height: 1; 
        }
        /* ◈ copy — зелёный */
        .code-btn.copy {
            color: #10b981;
            border-color: rgba(16,185,129,0.45);
        }
        .code-btn.copy:hover {
            background: #10b981; color: #030d09;
            box-shadow: 0 0 14px rgba(16,185,129,0.55);
            transform: translateY(-1px);
        }
        /* ↓ download — индиго */
        .code-btn.download {
            color: #818cf8;
            border-color: rgba(129,140,248,0.45);
        }
        .code-btn.download:hover {
            background: #818cf8; color: #030d09;
            box-shadow: 0 0 14px rgba(129,140,248,0.55);
            transform: translateY(-1px);
        }
        /* △ apply — фиолетовый */
        .code-btn.apply {
            color: #a78bfa;
            border-color: rgba(167,139,250,0.45);
        }
        .code-btn.apply:hover {
            background: #a78bfa; color: #030d09;
            box-shadow: 0 0 14px rgba(167,139,250,0.55);
            transform: translateY(-1px);
        }

        .code-btn.toggle {
            color: var(--text-dim);
            border-color: var(--line-2);
            font-size: 10px;
            letter-spacing: 1px;
        }
        .code-btn.toggle:hover {
            background: var(--surface-2);
            color: var(--text);
            transform: translateY(-1px);
        }
        .code-block.collapsed .code-content {
            display: none;
        }
        .code-block.collapsed .code-header {
            border-bottom: none;
        }
        .code-lines-hint {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            margin-left: 8px;
            opacity: 0.6;
        }

        .code-body {
            display: flex;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 520px;
            background: #0d1f16;
            min-width: 0;
        }
        .code-content {
            padding: 12px 14px;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            color: var(--text);
            white-space: pre;
            word-break: normal;
            overflow-wrap: normal;
            flex: 1;
            min-width: 0;
        }

        /* Thinking indicator */
        .thinking {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 8px 22px 6px;
            gap: 5px;
        }
        .thinking.hidden { display: none; }
        .thinking-inner {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .thinking-icon svg {
            width: 22px;
            height: 22px;
            animation: think-pulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 4px currentColor);
        }
        /* Для цветка deepseek — своя анимация, не think-pulse */
        .thinking-icon svg.deepseek-flower {
            animation: flower-spin 3s linear infinite, flower-pulse-icon 1.5s ease-in-out infinite;
            filter: none;
        }
        @keyframes think-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.15); }
        }
        @keyframes flower-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes flower-pulse-icon {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 3px #10b981); }
            50%       { opacity: 1;   filter: drop-shadow(0 0 9px #34d399) drop-shadow(0 0 16px rgba(16,185,129,0.5)); }
        }
        .thinking-label {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--text-2);
        }
        .thinking-dots span {
            display: inline-block;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: var(--text-2);
            margin: 0 1px;

            overflow: hidden;

            overflow: hidden;
            text-overflow: ellipsis;

        .activity-item.current {
            color: var(--text-2);
        }
        .activity-item.done {
            color: var(--text-3);
            opacity: 0.5 !important;
        }
        .activity-icon {

            opacity: 0.7;
        }
        .activity-path {
            overflow: hidden;

            color: var(--green);

        }

        /* Observer button */
            50% { box-shadow: 0 0 30px rgba(59,130,246,0.9), 0 0 50px rgba(79,70,229,0.4); }
        }

        /* Observer message bubble */
            background: rgba(59,130,246,0.07);

        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius);

        .btn-secondary { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--line-2); }

        .btn-primary { background: var(--surface); color: var(--green-bright); border: 1px solid var(--green); }
        .btn-primary:hover { background: var(--green); color: var(--bg); box-shadow: 0 4px 15px var(--green); }

        /* ══ ПРОТОКОЛЫ ══ */
        .proto-btn {

        }
        .proto-btn:hover {
            border-color: rgba(167,139,250,0.9);
            color: #c4b5fd;
            background: rgba(124,58,237,0.12);
            box-shadow: 0 0 10px rgba(124,58,237,0.2);
        }
        .proto-btn.active {
            border-color: #a78bfa;
            color: #030d09;
            background: #7c3aed;
            box-shadow: 0 0 14px rgba(124,58,237,0.5);
        }
        .proto-tip {
            display: none;
            position: absolute;
            bottom: calc(100% + 7px);

            transform: translateX(-50%);

            max-width: 240px;

            transform: translateX(-50%);

            border-top-color: rgba(124,58,237,0.45);

        /* === СОТЫ === */

        .file-card-desc { font-size: 11px; color: var(--text-2); }

        .seeds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

            background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius);
            padding: 14px; transition: all 0.15s ease; cursor: pointer;
        }
        .seed-card:hover { border-color: var(--green-2); box-shadow: 0 4px 20px rgba(16,185,129,0.1); }

        .seed-title { font-size: 13px; font-weight: 500; color: var(--text); }

        .toast {

        .toast.error { border-color: #f43f5e; color: #f43f5e; }

        /* Utilities */
        .hidden { display: none !important; }
        .tab-content { display: none; flex: 1; overflow: hidden; }
        .tab-content.active { display: flex; flex-direction: column; }
        code {
            font-family: var(--mono); font-size: 12px; background: var(--surface-2);
            padding: 2px 6px; border-radius: var(--radius-sm); color: var(--green-bright);
        }

        /* ===== DEEPSEEK FLOWER ICON ===== */
        @keyframes flower-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes flower-pulse {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 3px #10b981); transform: rotate(var(--rot, 0deg)) scale(1); }
            50%       { opacity: 1;   filter: drop-shadow(0 0 8px #34d399) drop-shadow(0 0 14px rgba(16,185,129,0.5)); transform: rotate(var(--rot, 0deg)) scale(1.12); }

        .deepseek-flower {
            width: 30px; height: 30px;
            transition: all 0.3s ease;
        }
        .deepseek-flower.thinking {
            animation: flower-spin 3s linear infinite, flower-pulse 1.5s ease-in-out infinite;
        }

        /* Text selection — 3 цвета по роли */
        /* DeepSeek → зелёный */
        .msg.assistant .bub::selection,
        .msg.assistant .bub *::selection { background: rgba(16,185,129,0.32); color: #dcfce7; }

        .msg.user .bub::selection,
        .msg.user .bub *::selection { background: rgba(129,140,248,0.38); color: #e0e7ff; }
        /* Системные → зелёный dim */
        .msg.sys .bub::selection,
        .msg.sys .bub *::selection { background: rgba(16,185,129,0.18); color: #dcfce7; }
        /* Код → фиолетовый */
        code::selection, pre::selection, pre *::selection,
        .code-content::selection, .code-content *::selection { background: rgba(167,139,250,0.38); color: #ede9fe; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--green); }

        <script>
        // ==================== КОНСТАНТЫ ====================
        // Явно указываем адрес Render (не динамический)
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        const API_BASE = 'https://mandala-engineer-chat.onrender.com';
        const GITHUB_REPO = 'voodoomushroomzzz-source/mandala-core';

        // Глобальные переменные
        let ws = null;
        let pendingFiles = [];
        let messageBuffer = '';
        let currentMessageDiv = null;
        let currentPatch = null;
        let editor = null; // для Monaco
        let mainMessages = []; // массив сообщений текущего чата

        // DOM элементы
        const statusDot = document.getElementById('statusDot');
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const thinkingEl = document.getElementById('thinking');
        const filePreview = document.getElementById('filePreview');
        const fileNameEl = document.getElementById('fileName');
        const filePercentEl = document.getElementById('filePercent');
        const fileProgressBar = document.getElementById('fileProgressBar');
        const fileTree = document.getElementById('file-tree');
        const currentFilePath = document.getElementById('current-file-path');
        const saveFileBtn = document.getElementById('save-file-btn');

        // ==================== ИНИЦИАЛИЗАЦИЯ MONACO ====================
        if (!window._monacoInitialized) {
            window._monacoInitialized = true;
            require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
            require(['vs/editor/editor.main'], function() {
                editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                    value: '// Выберите файл для редактирования',
                    language: 'text',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    minimap: { enabled: false }
                });
            });
        }

        // ==================== ЗАГРУЗКА СООБЩЕНИЙ ====================
        function loadMessages() {
            const saved = localStorage.getItem('main_chat_messages');
            if (saved) {
                try {
                    mainMessages = JSON.parse(saved);
                    messagesEl.innerHTML = '';
                    mainMessages.forEach(msg => {
                        if (msg.role === 'user') renderUserMessage(msg.content, false);
                        else if (msg.role === 'assistant') renderAssistantMessage(msg.content, false);
                        else if (msg.role === 'system') renderSystemMessage(msg.content, false, true);
                    });
                } catch (e) {
                    mainMessages = [];
                }
            } else {
                renderSystemMessage('🌱 Добро пожаловать в инженерный чат Мандалы!', false);
            }
            scrollToBottom();
        }

        function saveMessages() {
            localStorage.setItem('main_chat_messages', JSON.stringify(mainMessages));
        }

        function addMessage(role, content) {
            mainMessages.push({ role, content, timestamp: Date.now() });
            saveMessages();
        }

        // ==================== ОТОБРАЖЕНИЕ СООБЩЕНИЙ ====================
        function renderUserMessage(text, save = true) {
            const div = createMessageElement('user');
            const fileMatch = text.match(/^\[Загружен файл: (.+?)\]/);
            const patchMatch = text.match(/^\[Патч: (.+?)\]/);
            
            if (fileMatch) {
                div.querySelector('.bub').innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--green-bright);">📎 ${escapeHtml(fileMatch[1])}</span>`;
            } else if (patchMatch) {
                div.querySelector('.bub').innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);border:1px solid rgba(167,139,250,0.3);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--violet-soft);">📦 ${escapeHtml(patchMatch[1])}</span>`;
            } else {
                div.querySelector('.bub').textContent = text;
            }
            messagesEl.appendChild(div);
            if (save) addMessage('user', text);
            scrollToBottom();
        }

        function renderAssistantMessage(text, save = true) {
            const div = createMessageElement('assistant', 'deepseek');
            div.querySelector('.bub').innerHTML = renderMarkdown(text);
            messagesEl.appendChild(div);
            if (save) addMessage('assistant', text);
            scrollToBottom();
        }

        // Извлекает первую строку/заголовок из системного сообщения
        function summarizeSystemMsg(text) {
            // ОБНОВЛЕНИЕ ЗНАНИЙ: [имя файла]
            const knowledgeMatch = text.match(/\[ОБНОВЛЕНИЕ ЗНАНИЙ[:\s]+(.+?)\]/);
            if (knowledgeMatch) return `📖 ${knowledgeMatch[1].trim()} — прочитан`;
            // Патч-результат
            if (text.startsWith('◈ ✓') || text.startsWith('◈ ✗')) return text.split('\n')[0].slice(0, 80);
            // Контекст сессии
            if (text.startsWith('[КОНТЕКСТ СЕССИИ') || text.startsWith('[СТАРТ СЕССИИ')) return '◈ Контекст ядра загружен';
            // Обновление карты
            if (text.startsWith('[КАРТА ЯДРА')) return '◈ Карта ядра обновлена';
            // Длинный JSON-блок
            if (text.length > 300 && text.includes('```')) {
                const firstLine = text.split('\n')[0].replace(/\[|\]/g, '').trim();
                return firstLine.slice(0, 80) || '◈ Системное сообщение';
            }
            return null; // не нужно сжимать
        }

        function renderSystemMessage(text, save = true, isHistory = false) {
            const div = document.createElement('div');
            div.className = 'msg sys';

            const summary = summarizeSystemMsg(text);
            const isHeavy = summary !== null;

            if (isHeavy) {
                // Компактный вид: одна строка с кнопкой "развернуть"
                const id = 'sysmsg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                const safeText = renderMarkdown(text);
                div.innerHTML = `<div class="bub" style="cursor:default;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="color:var(--text-2);font-family:var(--mono);font-size:11px;">${escapeHtml(summary)}</span>
                        <button onclick="(function(btn){var det=document.getElementById('${id}');var vis=det.style.display!=='none';det.style.display=vis?'none':'block';btn.textContent=vis?'▼':'▲'})(this)" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:10px;padding:0 4px;opacity:0.6;">▼</button>
                    </div>
                    <div id="${id}" style="display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;">${safeText}</div>
                </div>`;
            } else {
                // Короткое сообщение — как обычно
                div.innerHTML = `<div class="bub">${renderMarkdown(text)}</div>`;
            }

            messagesEl.appendChild(div);
            // Сохраняем только сжатую версию тяжёлых сообщений
            if (save) {
                const saveText = isHeavy ? summary : text;
                addMessage('system', saveText);
            }
            scrollToBottom();
        }

        function createMessageElement(role, model = null) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            let iconSvg, name;
            if (role === 'user') {
                iconSvg = `<svg viewBox="0 0 30 30" fill="none"><polygon points="15,3 28,26 2,26" stroke="#a78bfa" stroke-width="0.9" fill="rgba(167,139,250,0.06)"/><circle cx="15" cy="19" r="3.5" stroke="#a78bfa" stroke-width="0.8" fill="rgba(167,139,250,0.15)"/><circle cx="15" cy="19" r="1.4" fill="#c4b5fd" opacity="0.95"/></svg>`;

                name = 'вы';
            } else {
                iconSvg = modelIcons[model] || modelIcons['deepseek'];
                name = modelNames[model] || 'СР';
            }
            if (model) div.dataset.model = model;
            div.innerHTML = `
                <div class="av">${iconSvg}</div>
                <div class="mbody">
                    <div class="mname">${name}</div>
                    <div class="bub"></div>
                </div>
            `;
            return div;
        }

        // ── Центральный рендерер: парсим raw text, code-блоки вырезаем ДО escapeHtml ──
        function renderMarkdown(rawText) {
            const blocks = [];
            const PH = 'CODEBLOCK_PLACEHOLDER_';
            // 0. Убираем markdown-мусор вне code-блоков
            rawText = rawText
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/\*\*([^*\n]+)\*\*/g, '$1')
                .replace(/\*([^*\n]+)\*/g, '$1')
                .replace(/(^|[^\w_])__([^_\n]+)__([^\w_]|$)/gm, '$1$2$3')
                .replace(/(^|\s)_([^_\n]+)_(\s|$)/gm, '$1$2$3');
            // 1. Парсим code-блоки посимвольно — единственно надёжный способ
            // когда внутри блока могут быть ``` (например в JSON content)
            let processed = (function(src) {
                var out = '';
                var i = 0;
                while (i < src.length) {
                    // Ищем открывающий ``` с необязательным lang и обязательным \n
                    if (src[i] === '`' && src[i+1] === '`' && src[i+2] === '`') {
                        var j = i + 3;
                        // читаем lang (до \n)
                        var langEnd = src.indexOf('\n', j);
                        if (langEnd === -1) { out += src[i]; i++; continue; }
                        var lang = src.slice(j, langEnd).trim();
                        var codeStart = langEnd + 1;
                        // Ищем закрывающий ```, который стоит на начале строки
                        // (предыдущий символ — \n или начало строки)
                        var found = -1;
                        var k = codeStart;
                        while (k < src.length - 2) {
                            if (src[k] === '`' && src[k+1] === '`' && src[k+2] === '`') {
                                // Закрывающий ``` — только если в начале строки
                                if (k === 0 || src[k-1] === '\n') {
                                    found = k;
                                    break;
                                }
                            }
                            k++;
                        }
                        if (found !== -1) {
                            // Завершённый блок
                            var code = src.slice(codeStart, found);
                            // Убираем trailing \n если есть
                            if (code.endsWith('\n')) code = code.slice(0, -1);
                            var idx = blocks.length;
                            blocks.push({ lang: lang || 'code', code: code, open: false });
                            out += PH + idx + '_END';
                            i = found + 3;
                            // Пропускаем \n после закрывающего ```
                            if (src[i] === '\n') i++;
                        } else {
                            // Незакрытый блок — до конца строки (стриминг)
                            var code = src.slice(codeStart);
                            var idx = blocks.length;
                            blocks.push({ lang: lang || 'code', code: code, open: true });
                            out += PH + idx + '_END';
                            i = src.length;
                        }
                    } else {
                        out += src[i];
                        i++;
                    }
                }
                return out;
            })(rawText);
            // 3. Markdown для текстовой части
            var html;
            try { html = marked.parse(processed, { breaks: true, gfm: true }); }
            catch(e) { html = escapeHtml(processed).replace(/\n/g, '<br>'); }
            // 4. Вставляем блоки обратно
            html = html.replace(new RegExp(PH + '(\\d+)_END', 'g'), function(_, i) {
                var b = blocks[parseInt(i)];
                return b ? renderCodeBlock(b.lang, b.code, !b.open) : '';
            });
            // 5. inline code
            html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            return html;
        }

        function renderCodeBlock(lang, code, complete) {
            const copyBtnClass = 'code-btn copy';
            const downloadBtnClass = 'code-btn download';
            const applyBtnClass = 'code-btn apply';
            const lineCount = (code.match(/\n/g) || []).length + 1;
            const shouldCollapse = false;
            const collapsedClass = '';
            const toggleBtn = complete
                ? `<button class="code-btn toggle" onclick="toggleCodeBlock(this)" title="Свернуть/развернуть">▼</button>`
                : '';
            const linesHint = complete
                ? `<span class="code-lines-hint">${lineCount} lines</span>`
                : '';
            const actions = complete ? `
                <div class="code-actions">
                    ${toggleBtn}
                    <button class="${copyBtnClass}" onclick="copyCodeFromBlock(this)" title="Копировать">◈</button>
                    <button class="${downloadBtnClass}" onclick="downloadCodeFromBlock(this)" title="Скачать">↓</button>
                    ${(lang === 'json' || code.includes('"target_module"') || code.includes('"file_path"') || code.includes('"filepath"') || code.includes('"targetmodule"') || code.includes('"patches"')) ? `<button class="${applyBtnClass}" onclick="preparePatchFromBlock(this)" title="Применить патч">△</button>` : ''}
                </div>
            ` : '';
            return `
                <div class="code-block ${complete ? 'complete' : 'streaming'} ${collapsedClass}">
                    <div class="code-header">
                        <span class="code-lang">${lang || 'code'}</span>
                        ${linesHint}
                        ${actions}
                    </div>
                    <div class="code-body">
                        <pre class="code-content">${escapeHtml(code)}</pre>
                    </div>
                </div>
            `;
        }

        window.toggleCodeBlock = function(btn) {
            const block = btn.closest('.code-block');
            block.classList.toggle('collapsed');
            btn.innerHTML = block.classList.contains('collapsed') ? '▶' : '▼';
        };

        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        window.downloadCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const rawCode = block.querySelector('.code-content').textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            const lang = block.querySelector('.code-lang').textContent || 'txt';
            const blob = new Blob([decodedCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `code.${lang}`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('◈ файл скачан', 'success');
        };

        window.copyCodeFromBlock = function(btn) {
            const block = btn.closest('.code-block');
            const code = block.querySelector('.code-content').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '✓';
                showToast('◈ код скопирован', 'success');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1000);
            }).catch(err => {
                showToast('◈ ошибка копирования', 'error');
                console.error('Copy failed:', err);
            });
        };

        // Нормализует ключи патча: filepath→file_path, targetmodule→target_module и т.д.
        function normalizePatchKeys(obj) {
            if (Array.isArray(obj)) return obj.map(normalizePatchKeys);
            if (typeof obj !== 'object' || obj === null) return obj;
            const MAP = {
                'filepath':     'file_path',
                'targetmodule': 'target_module',
                'deletefile':   'delete_file',
            };
            const out = {};
            for (const [k, v] of Object.entries(obj)) {
                const nk = MAP[k.toLowerCase().replace(/_/g,'')] || k;
                out[nk] = normalizePatchKeys(v);
            }
            return out;
        }

        window.preparePatchFromBlock = function(btn) {
            const codeElement = btn.closest('.code-block').querySelector('.code-content');
            const rawCode = codeElement.textContent;
            const decodedCode = decodeHtmlEntities(rawCode);
            // Извлекаем JSON — работает и для ```json и для ```python блоков
            let patchJson = null;
            try { JSON.parse(decodedCode); patchJson = decodedCode; } catch(e) {}
            if (!patchJson) {
                const m = decodedCode.match(/(\{[\s\S]*\})/);
                if (m) {
                    try {
                        const candidate = m[1].replace(/#[^\n]*/g,'').replace(/\bNone\b/g,'null').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/,(\s*[}\]])/g,'$1');
                        JSON.parse(candidate);
                        patchJson = candidate;
                    } catch(e) {}
                }
            }
            if (!patchJson) { showToast('◈ не удалось распарсить патч', 'error'); return; }
            try {
                const parsed = JSON.parse(patchJson);
                // Нормализуем ключи — СР часто пишет filepath вместо file_path
                const normalized = normalizePatchKeys(parsed);
                currentPatch = JSON.stringify(normalized);
                document.getElementById('patchPreviewContent').textContent = JSON.stringify(normalized, null, 2);
                document.getElementById('confirmPatchBtn').disabled = false;
                openPatchModal();
                showToast('◈ патч подготовлен', 'success');
            } catch(e) {
                showToast('◈ невалидный JSON: ' + e.message, 'error');
            }
        };

        // ==================== WEBSOCKET ====================
        let _reconnectAttempt = 0;

        function connect() {
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'init', session_id: 'main' }));
            ws.onmessage = (e) => { try { handleMessage(JSON.parse(e.data)); } catch (ex) { console.error(ex); } };
            ws.onclose = () => {
                updateStatus('error');
                _reconnectAttempt++;
                // Нарастающая задержка: 3s, 5s, 10s, 15s, 15s...
                const delay = _reconnectAttempt === 1 ? 3000
                            : _reconnectAttempt === 2 ? 5000
                            : _reconnectAttempt <= 4  ? 10000
                            : 15000;
                if (_reconnectAttempt === 1) {
                    showToast('◈ соединение разорвано — переподключение...', 'error');
                } else if (_reconnectAttempt <= 4) {
                    showToast(`◈ сервер просыпается... (${_reconnectAttempt})`, 'error');
                } else {
                    showToast('◈ ожидание сервера...', 'error');
                }
                setTimeout(connect, delay);
            };
            ws.onerror = () => updateStatus('error');
        }

        function updateStatus(state) {
            statusDot.className = 'orb-dot';
            if (state === 'connected') {
                statusDot.style.background = 'var(--green-2)';
                statusDot.style.boxShadow = '0 0 10px var(--green-2), 0 0 20px rgba(16,185,129,0.3)';
            } else if (state === 'connecting') {
                statusDot.style.background = 'var(--violet-soft)';
                statusDot.style.boxShadow = '0 0 8px var(--violet-soft)';
            } else {
                statusDot.style.background = '#f43f5e';
                statusDot.style.boxShadow = '0 0 12px #f43f5e';
            }
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'connected':
                    _reconnectAttempt = 0;
                    updateStatus('connected');
                    if (data.core_version) {
                        document.getElementById('coreVersion').textContent = `◈ ${data.core_version}`;
                    }
                    break;
                case 'core_updated':
                    if (typeof loadHoneycombs === 'function') loadHoneycombs();
                    const verEl = document.getElementById('coreVersion');
                    if (verEl && data.version) {
                        verEl.textContent = `◈ ${data.version}`;
                        verEl.classList.add('updated');
                        setTimeout(() => verEl.classList.remove('updated'), 3000);
                    }
                    showToast(`◈ Ядро обновлено: ${data.version || ''}`, 'success');
                    break;
                case 'history':
                    messagesEl.innerHTML = '';
                    (data.messages || []).forEach(msg => {
                        if (msg.role === 'user') renderUserMessage(msg.content, false);
                        else if (msg.role === 'assistant') renderAssistantMessage(msg.content, false);
                    });
                    scrollToBottom();
                    break;
                case 'system':
                    renderSystemMessage(data.text);
                    break;
                case 'stream':
                    handleStream(data.content, data.model);
                    break;
                case 'model_start':
                    if (currentMessageDiv) finishMessage();
                    showThinking(data.model);
                    break;
                case 'model_done':
                    hideThinking();
                    finishMessage();
                    break;
                case 'done':
                    // Может прийти после локального stop — finishMessage безопасен повторно
                    finishMessage();
                    setSendBtnState(false);
                    break;
                case 'error':
                    showToast(data.text, 'error');
                    hideThinking();
                    finishMessage();
                    break;
                case 'module_direct':
                    showToast(`◈ модуль ${data.name} получен`, 'success');
                    const formatted = `**Модуль ${data.name}:**\n\`\`\`json\n${data.content}\n\`\`\``;
                    renderAssistantMessage(formatted, true);
                    break;
                case 'modules_refreshed':
                    showToast(`◈ обновлено ${data.count} модулей`, 'success');
                    break;
                case 'tool_use':
                    updateThinkingStatus(data);
                    break;
                case 'file_processed':
                    fileNameEl.textContent = `✅ ${data.summary}`;
                    fileProgressBar.style.width = '100%';
                    filePercentEl.textContent = '100%';
                    renderSystemMessage(data.summary);
                    setTimeout(() => {
                        filePreview.classList.add('hidden');
                        fileProgressBar.style.width = '0%';
                    }, 2000);
                    break;
                case 'file_read_done':
                    updateThinkingStatus({ tool: 'read_file', path: data.path, model: Array.from(activeModels)[0] });
                    renderSystemMessage(`◈ ${escapeHtml(data.label || data.path)} прочитан (${(data.size||0).toLocaleString()} символов)`);
                    break;
                case 'patch_result':
                    handlePatchResult(data.results);
                    break;
                case 'resonance':
                    updateResonance(data.value, data.level);
                    break;
                case 'pong':
                    break;
                case 'observer_state': case 'observer_thinking':
                case 'observer_message': case 'observer_error':
                    break; // observer удалён
            }
        }

        let _renderPending = false;
        function handleStream(content, model) {
            if (!currentMessageDiv) {
                currentMessageDiv = createMessageElement('assistant', model || 'deepseek');
                if (model) {
                    const nameEl = currentMessageDiv.querySelector('.mname');
                    const color = modelColors[model] || 'var(--green-bright)';
                    const label = `<span class="model-label ${model}">${modelNames[model] || model}</span>`;
                    nameEl.innerHTML = label;
                    nameEl.style.color = color;
                }
                messagesEl.appendChild(currentMessageDiv);
            }
            messageBuffer += content;
            // Throttle рендера через rAF — не пересчитываем на каждый чанк,
            // а батчим все чанки пришедшие за один frame браузера
            if (!_renderPending) {
                _renderPending = true;
                requestAnimationFrame(() => {
                    _renderPending = false;
                    if (!currentMessageDiv) return;
                    const bub = currentMessageDiv.querySelector('.bub');
                    if (bub) bub.innerHTML = renderMarkdown(messageBuffer);
                    scrollToBottom();
                });
            }
        }

        function finishMessage() {
            hideThinking();
            if (currentMessageDiv) {
                // Принудительно рендерим буфер — если rAF ещё не сработал
                // (например при отмене или быстром done), bubble не будет пустым
                if (messageBuffer) {
                    const bub = currentMessageDiv.querySelector('.bub');
                    if (bub) bub.innerHTML = renderMarkdown(messageBuffer);
                }
                _renderPending = false;
                saveMessages(); // сохраняем после завершения
                currentMessageDiv = null;
                messageBuffer = '';
            }
        }

        // ==================== ОТПРАВКА СООБЩЕНИЙ ====================
        function sendMessage() {
            const text = inputEl.value.trim();
            if (pendingFiles.length > 0) {
                sendFiles(pendingFiles, text);
                clearFiles();
                inputEl.value = '';
                autoHeight();
                return;
            }
            if (!text) return;
            renderUserMessage(text);
            inputEl.value = '';
            autoHeight();
            showThinking(Array.from(activeModels)[0]);
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения с сервером', 'error');
                hideThinking();
                return;
            }
            ws.send(JSON.stringify({ type: 'ask', text: text, session_id: 'main', models: getActiveModels() }));
        }

        async function sendFiles(files, caption) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast('◈ нет соединения', 'error');
                return;
            }
            if (caption.trim()) renderUserMessage(caption);
            showThinking(Array.from(activeModels)[0]);

            filePreview.classList.remove('hidden');
            fileProgressBar.style.width = '0%';
            filePercentEl.textContent = '0%';

            let completed = 0;
            for (let fi = 0; fi < files.length; fi++) {
                const file = files[fi];
                const isLast = (fi === files.length - 1);
                fileNameEl.textContent = `⏳ ${file.name}`;
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        ws.send(JSON.stringify({
                            type: 'file',
                            name: file.name,
                            content: e.target.result.split(',')[1],
                            file_type: file.type || 'application/octet-stream',
                            caption: isLast ? (caption || '') : '',
                            is_last: isLast,
                            session_id: 'main',
                            models: getActiveModels()
                        }));
                        completed++;
                        const percent = Math.round((completed / files.length) * 100);
                        fileProgressBar.style.width = percent + '%';
                        filePercentEl.textContent = percent + '%';
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
                await new Promise(r => setTimeout(r, 100));
            }
            fileNameEl.textContent = `✓ ${files.map(f => f.name).join(', ')}`;
            saveMessages();
            setTimeout(() => {
                filePreview.classList.add('hidden');
                fileProgressBar.style.width = '0%';
                filePercentEl.textContent = '0%';
            }, 4000);
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            pendingFiles = [...pendingFiles, ...files];
            updateFilePreview();
            inputEl.focus();
        }

        function updateFilePreview() {
            if (pendingFiles.length === 0) {
                filePreview.classList.add('hidden');
                return;
            }
            const names = pendingFiles.map(f => f.name).join(', ');
            fileNameEl.textContent = names;
            filePreview.classList.remove('hidden');
            fileProgressBar.style.width = '0%';
            filePercentEl.textContent = '0%';
        }

        function clearFiles() {
            pendingFiles = [];
            document.getElementById('fileInput').value = '';
        }

        function setupDragDrop() {
            document.addEventListener('dragover', e => { e.preventDefault(); document.body.style.boxShadow = 'inset 0 0 50px var(--violet-dim)'; });
            document.addEventListener('dragleave', e => { if(e.target===document.body) document.body.style.boxShadow = ''; });
            document.addEventListener('drop', e => {
                e.preventDefault();
                document.body.style.boxShadow = '';
                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    pendingFiles = files;
                    updateFilePreview();
                    inputEl.focus();
                }
            });
        }

        // ==================== ВКЛАДКА ФАЙЛОВ ====================
        async function loadFileTree() {
            fileTree.innerHTML = 'Загрузка...';
            try {
                const response = await fetch(`${API_BASE}/api/tree`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const tree = buildTree(data.tree);
                fileTree.innerHTML = renderTree(tree);
                document.querySelectorAll('#file-tree .file').forEach(el => {
                    el.addEventListener('click', () => {
                        document.querySelectorAll('#file-tree .file').forEach(f => f.classList.remove('selected'));
                        el.classList.add('selected');
                        loadFile(el.dataset.path);
                    });
                });
            } catch (err) {
                fileTree.innerHTML = `❌ Ошибка загрузки: ${err.message}`;
            }
        }

        function buildTree(files) {
            const root = {};
            files.forEach(file => {
                if (file.type !== 'blob') return;
                const parts = file.path.split('/');
                let current = root;
                parts.forEach((part, i) => {
                    if (i === parts.length - 1) {
                        current[part] = { type: 'file', path: file.path };
                    } else {
                        if (!current[part]) current[part] = { type: 'dir', children: {} };
                        current = current[part].children;
                    }
                });
            });
            return root;
        }

        function renderTree(node, level = 0) {
            if (node.type === 'file') {
                const ext = node.path.split('.').pop();
                return `<div class="file file ${ext}" data-path="${node.path}" style="padding-left: ${level * 16 + 16}px">${node.path.split('/').pop()}</div>`;
            }
            let html = '';
            Object.keys(node).forEach(key => {
                if (key === 'type') return;
                const child = node[key];
                if (child.type === 'dir') {
                    html += `<div class="folder" style="padding-left: ${level * 16}px">${key}</div>`;
                    html += renderTree(child.children, level + 1);
                } else {
                    html += renderTree(child, level + 1);
                }
            });
            return html;
        }

        async function loadFile(path) {
            currentFilePath.textContent = path;
            saveFileBtn.disabled = false;
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${path}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const content = await response.text();
                const ext = path.split('.').pop();
                const language = ext === 'json' ? 'json' : ext === 'py' ? 'python' : ext === 'html' ? 'html' : ext === 'js' ? 'javascript' : 'text';
                monaco.editor.setModelLanguage(editor.getModel(), language);
                editor.setValue(content);
                localStorage.setItem(`orig_${path}`, content);
                renderSystemMessage(`📁 Открыт файл: ${path}`, true);
            } catch (err) {
                editor.setValue(`// Ошибка загрузки: ${err.message}`);
            }
        }

        function saveCurrentFile() {
            const path = currentFilePath.textContent;
            if (!path) return;
            const content = editor.getValue();

        // ══════════════════════════════════════════════════════
        // HIVE MAP — правильная гексагональная сетка flat-top
        // ══════════════════════════════════════════════════════
        let _hiveData    = [];
        let _hiveHovered = -1;
        let _hiveAnimId  = null;
        let _hivePulse   = 0;
        let _hiveLayout  = [];   // [{px,py,r}] — пиксельные координаты каждой соты

        // flat-top hexagon corners
        function _hexPts(cx, cy, r) {
            const p = [];
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;          // 0°,60°,120°…  flat-top
                p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
            }
            return p;
        }

        // Строим координаты сетки по кольцам (flat-top offset)
        // q,r — cube-координаты, переводим в пиксели внутри drawHive
        function _buildGrid(n) {
            const out = [{q:0, r:0}];
            if (n <= 1) return out;
            const dirs = [{q:1,r:0},{q:0,r:1},{q:-1,r:1},{q:-1,r:0},{q:0,r:-1},{q:1,r:-1}];
            let ring = 1;
            while (out.length < n) {
                // Начинаем с позиции ring*dir[4] = (0, -ring)
                let q = 0, r = -ring;
                for (let d = 0; d < 6; d++) {
                    for (let s = 0; s < ring; s++) {
                        if (out.length < n) out.push({q, r});
                        q += dirs[d].q;
                        r += dirs[d].r;
                    }
                }
                ring++;
            }
            return out;
        }

        // flat-top: px = cx + R*(3/2)*q,  py = cy + R*sqrt(3)*(r + q/2)
        function _cubeToXY(q, r, cx, cy, R) {
            return [
                cx + R * 1.5 * q,
                cy + R * Math.sqrt(3) * (r + q * 0.5)
            ];
        }

        // Вычисляем R так чтобы все соты влезли с отступом
        function _calcR(W, H, n) {
            const maxRing = Math.ceil((-1 + Math.sqrt(1 + (4*(n-1))/3)) / 2);
            // Диаметр сетки в единицах R
            const spanQ = maxRing * 2 + 1;   // по горизонтали
            const spanR = maxRing * 2 + 1;   // по вертикали
            const fitW  = W / (spanQ * 1.5 + 0.5) * 0.70;
            const fitH  = H / (spanR * Math.sqrt(3)) * 0.70;
            return Math.min(fitW, fitH);
        }

        function _drawHex(ctx, pts, fillStyle, strokeStyle, lineWidth) {
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let k = 1; k < 6; k++) ctx.lineTo(pts[k][0], pts[k][1]);
            ctx.closePath();
            if (fillStyle)   { ctx.fillStyle = fillStyle;     ctx.fill();   }
            if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth; ctx.stroke(); }
        }

        function drawHive(canvas, data, hovered, pulse) {
            const dpr = window.devicePixelRatio || 1;
            // Логические размеры (CSS pixels)
            const W = canvas.width  / dpr;
            const H = canvas.height / dpr;
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const n = data.length;
            if (!n) { ctx.restore(); return; }

            const R     = _calcR(W, H, n);
            const rGap  = R * 0.08;           // зазор между сотами
            const rDraw = R - rGap;
            const cx0   = W / 2;
            const cy0   = H / 2;
            const grid  = _buildGrid(n);

            // Обновляем layout для hit-test
            _hiveLayout = grid.map(({q, r}) => {
                const [px, py] = _cubeToXY(q, r, cx0, cy0, R);
                return {px, py, r: R};
            });

            // Рисуем соты (сначала glow, потом сами)
            grid.forEach(({q, r}, i) => {
                if (i >= n) return;
                const d   = data[i];
                const [px, py] = _cubeToXY(q, r, cx0, cy0, R);
                const isH = (i === hovered);

                const phase    = pulse + i * 0.42;
                const pAmt     = 0.5 + 0.5 * Math.sin(phase);
                const rr       = rDraw * (isH ? 1.07 : 1.0);

                // Цвет по рангу в сетке (кольцо определяет частоту)
                // Кольцо 0 (центр, i=0) = фиолетовый (часто)
                // Кольцо 1 (i=1..6)     = индиго (средне)
                // Кольцо 2+ (i>6)       = зелёный (редко)
                const col = i === 0
                    ? [139, 92, 246]    // фиолетовый — центр, самое частое
                    : i <= 6
                        ? [99, 102, 241]   // индиго — первое кольцо
                        : [16, 185, 129];  // зелёный — второе кольцо и дальше

                // — glow —
                const glowR = rr * (isH ? 2.4 : 1.5 + pAmt * 0.3);
                const glowA = isH ? 0.25 : 0.05 + pAmt * 0.08;
                const grd   = ctx.createRadialGradient(px, py, 0, px, py, glowR);
                grd.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${glowA})`);
                grd.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI*2); ctx.fill();

                // — 3D объём: нижняя грань (тень) —
                const depth = rr * 0.12;
                const ptsTop = _hexPts(px, py,       rr);
                const ptsBot = _hexPts(px, py+depth, rr * 0.96);

                // Боковые грани (нижние 3 ребра)
                for (let k = 3; k < 6; k++) {
                    const k2 = (k+1) % 6;
                    ctx.beginPath();
                    ctx.moveTo(ptsTop[k][0],  ptsTop[k][1]);
                    ctx.lineTo(ptsTop[k2][0], ptsTop[k2][1]);
                    ctx.lineTo(ptsBot[k2][0], ptsBot[k2][1]);
                    ctx.lineTo(ptsBot[k][0],  ptsBot[k][1]);
                    ctx.closePath();
                    const sideA = isH ? 0.18 : 0.07 + pAmt * 0.04;
                    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${sideA})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${(isH ? 0.4 : 0.15)})`;
                    ctx.lineWidth = 0.4;
                    ctx.stroke();
                }

                // — верхняя грань —
                const fillA   = isH ? 0.18 : 0.06 + pAmt * 0.05;
                const strokeA = isH ? 1.0  : 0.3  + pAmt * 0.3;
                _drawHex(ctx, ptsTop,
                    `rgba(${col[0]},${col[1]},${col[2]},${fillA})`,
                    `rgba(${col[0]},${col[1]},${col[2]},${strokeA})`,
                    isH ? 1.2 : 0.7
                );

                // — блик (верхний левый) —
                if (rr > 14) {
                    const bPts = _hexPts(px - rr*0.1, py - rr*0.12, rr * 0.55);
                    const bGrd = ctx.createRadialGradient(
                        px - rr*0.15, py - rr*0.18, 0,
                        px - rr*0.1,  py - rr*0.1,  rr*0.5
                    );
                    bGrd.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${isH ? 0.22 : 0.08 + pAmt*0.06})`);
                    bGrd.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
                    ctx.beginPath();
                    ctx.moveTo(bPts[0][0], bPts[0][1]);
                    for (let k=1;k<6;k++) ctx.lineTo(bPts[k][0],bPts[k][1]);
                    ctx.closePath();
                    ctx.fillStyle = bGrd; ctx.fill();
                }

                // — название по центру соты (без иконок) —
                (function(){
                    const words = d.name.replace(/_/g,' ').split(' ');
                    const maxW = rr * 1.55;
                    let sz = Math.min(rr * 0.22, 11);
                    ctx.font = `${sz}px "Fira Mono",monospace`;
                    const longest = words.reduce((a,b) => ctx.measureText(a).width > ctx.measureText(b).width ? a : b, '');
                    while (sz > 5.5 && ctx.measureText(longest).width > maxW) {
                        sz -= 0.5;
                        ctx.font = `${sz}px "Fira Mono",monospace`;
                    }
                    const lines = [];
                    let line = '';
                    words.forEach(w => {
                        const test = line ? line + ' ' + w : w;
                        if (ctx.measureText(test).width > maxW && line) {
                            lines.push(line); line = w;
                        } else { line = test; }
                    });
                    if (line) lines.push(line);
                    const lineH = sz * 1.3;
                    const totalH = lines.length * lineH;
                    const startY = py - totalH / 2 + lineH / 2;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.globalAlpha = isH ? 1 : 0.5 + pAmt * 0.25;
                    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},1)`;
                    lines.forEach((ln, li) => ctx.fillText(ln, px, startY + li * lineH));
                    ctx.globalAlpha = 1;
                })();
            });

            ctx.restore();
        }

        function hiveAnimate() {
            _hivePulse += 0.035;
            const canvas = document.getElementById('hiveCanvas');
            if (canvas && document.getElementById('tab-map').classList.contains('active')) {
                drawHive(canvas, _hiveData, _hiveHovered, _hivePulse);
            }
            _hiveAnimId = requestAnimationFrame(hiveAnimate);
