        function hiveResize() {
            const canvas = document.getElementById('hiveCanvas');
            if (!canvas) return;
            const dpr  = window.devicePixelRatio || 1;
            const w    = canvas.offsetWidth;
            const h    = canvas.offsetHeight;
            if (w === 0 || h === 0) return;
            canvas.width  = w * dpr;
            canvas.height = h * dpr;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // Hit-test через сохранённый layout — один источник истины
        function hiveGetIdx(ex, ey) {
            const canvas = document.getElementById('hiveCanvas');
            if (!canvas || !_hiveLayout.length) return -1;
            const rect = canvas.getBoundingClientRect();
            const mx = ex - rect.left;
            const my = ey - rect.top;
            let best = -1, bestD = Infinity;
            _hiveLayout.forEach(({px, py, r}, i) => {
                const d = Math.hypot(mx - px, my - py);
                if (d < r * 0.95 && d < bestD) { bestD = d; best = i; }
            });
            return best;
        }

        function hiveShowPanel(idx) {
            const panel = document.getElementById('hivePanel');
            if (!panel) return;
            if (idx < 0 || idx >= _hiveData.length || !_hiveLayout[idx]) {
                panel.classList.remove('show'); return;
            }
            const d   = _hiveData[idx];
            const lay = _hiveLayout[idx];

            // Заполняем контент
            document.getElementById('hivePanelIcon').textContent = d.icon;
            document.getElementById('hivePanelName').textContent = d.name.replace(/_/g,' ');
            const badge = document.getElementById('hivePanelBadge');
            badge.textContent = d.status;
            badge.className = 'hive-panel-badge ' + d.status;
            document.getElementById('hivePanelDesc').textContent = d.desc;
            document.getElementById('hivePanelFiles').innerHTML = d.files.map(f => {
                const short = f.split('/').pop();
                return `<span class="hive-panel-file" onclick="requestFileRead('${f}','${d.icon} ${d.name}')">${short}</span>`;
            }).join('');

            // Позиционируем под сотой
            const canvas  = document.getElementById('hiveCanvas');
            const wrap    = document.getElementById('mapContainer');
            const wRect   = wrap.getBoundingClientRect();
            const cRect   = canvas.getBoundingClientRect();

            // lay.px/py — координаты центра в CSS-пикселях canvas
            // Переводим в координаты wrap
            const cellX = cRect.left - wRect.left + lay.px;
            const cellY = cRect.top  - wRect.top  + lay.py + lay.r * 0.82;

            // Показываем временно чтобы измерить ширину
            panel.style.opacity = '0';
            panel.style.left    = '0px';
            panel.style.top     = '0px';
            panel.classList.add('show');

            const pW = panel.offsetWidth;
            const pH = panel.offsetHeight;
            const wW = wrap.offsetWidth;
            const wH = wrap.offsetHeight;

            // Центрируем по X относительно соты, не выходим за края
            let left = cellX - pW / 2;
            left = Math.max(6, Math.min(left, wW - pW - 6));

            // Если не влезает снизу — показываем сверху
            let top = cellY + 6;
            if (top + pH > wH - 6) top = cRect.top - wRect.top + lay.py - lay.r * 0.82 - pH - 6;
            top = Math.max(6, top);

            panel.style.left    = left + 'px';
            panel.style.top     = top  + 'px';
            panel.style.opacity = '';
        }

        function hiveSetupCanvas() {
            const canvas = document.getElementById('hiveCanvas');
            if (!canvas || canvas._hiveReady) return;
            canvas._hiveReady = true;
            hiveResize();
            canvas.addEventListener('mousemove', e => {
                const idx = hiveGetIdx(e.clientX, e.clientY);
                if (idx !== _hiveHovered) {
                    _hiveHovered = idx;
                    hiveShowPanel(idx);
                    canvas.style.cursor = idx >= 0 ? 'pointer' : 'default';
                }
            });
            canvas.addEventListener('mouseleave', () => {
                _hiveHovered = -1;
                const p = document.getElementById('hivePanel');
                if (p) p.classList.remove('show');
                canvas.style.cursor = 'default';
            });
            canvas.addEventListener('click', e => {
                const idx = hiveGetIdx(e.clientX, e.clientY);
                if (idx >= 0 && idx < _hiveData.length) {
                    const d = _hiveData[idx];
                    requestFileRead(d.indexPath, d.icon + ' ' + d.name);
                }
            });
            const ro = new ResizeObserver(() => { hiveResize(); });
            ro.observe(canvas);
            if (!_hiveAnimId) hiveAnimate();
        }

        async function loadHoneycombs() {
            const countEl = document.getElementById('honeycombsCount');
            try {
                const treeResp = await fetch("https://api.github.com/repos/" + GITHUB_REPO + "/git/trees/main?recursive=1");
                if (!treeResp.ok) throw new Error("GitHub API: " + treeResp.status);
                const allPaths = (await treeResp.json()).tree || [];
                const folders = {};
                allPaths.forEach(item => {
                    if (!item.path.startsWith("honeycombs/")) return;
                    const rest   = item.path.slice(11);
                    const folder = rest.split("/")[0];
                    if (!folder) return;
                    if (!folders[folder]) folders[folder] = { files: [], indexPath: null };
                    if (item.type === "blob") {
                        folders[folder].files.push(item.path);
                        if (rest === folder + "/index.json") folders[folder].indexPath = item.path;
                    }
                });
                const names = Object.keys(folders).sort();
                if (countEl) countEl.textContent = names.length + ' сот';
                const metas = await Promise.allSettled(names.map(async name => {
                    const idx = folders[name].indexPath;
                    if (!idx) return null;
                    const r = await fetch("https://raw.githubusercontent.com/" + GITHUB_REPO + "/main/" + idx);
                    return r.ok ? r.json() : null;
                }));
                _hiveData = names.map((name, i) => {
                    const meta = metas[i].status === "fulfilled" ? metas[i].value : null;
                    const hc   = folders[name];
                    // Частота: из meta или по статусу (active=3, draft=2, archived=1)
                    const statusFreq = {active:3, draft:2, archived:1};
                    const status = meta?.meta?.status || 'active';
                    const freq = meta?.meta?.frequency ?? meta?.meta?.usage_count ?? statusFreq[status] ?? 1;
                    return {
                        name,
                        icon:      HONEYCOMB_ICONS[name] || meta?.meta?.icon || "⬡",
                        desc:      meta?.meta?.description || meta?.identity?.name || name.replace(/_/g,' '),
                        status,
                        freq,
                        files:     hc.files,
                        indexPath: hc.indexPath || ('honeycombs/' + name + '/index.json'),
                    };
                });
                // Сортируем по убыванию частоты: часто → центр (кольцо 0), редко → внешние кольца
                _hiveData.sort((a, b) => b.freq - a.freq);
                hiveSetupCanvas();
            } catch(e) {
                if (countEl) countEl.textContent = '× ' + e.message;
            }
        }
        window.loadHoneycombs = loadHoneycombs;

        // ══ ПРОТОКОЛЫ ══
        function showProtoTip(btn) {
            const tip = btn.nextElementSibling;
            if (tip) { tip.textContent = btn.dataset.desc; tip.style.display = 'block'; }
        }
        function hideProtoTip(btn) {
            const tip = btn.nextElementSibling;
            if (tip) tip.style.display = 'none';
        }

        async function activateProtocol(name) {
            // Подсветить кнопку
            document.querySelectorAll('.proto-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.proto-btn[data-proto="${name}"]`);
            if (btn) btn.classList.add('active');
            setTimeout(() => { if(btn) btn.classList.remove('active'); }, 2000);

            // Переключиться на чат
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-tab="chat"]').classList.add('active');

            // Отправить команду активации протокола
            const msg = `активируй протокол ${name.replace(/_/g,' ')}`;
            const inputEl = document.getElementById('messageInput');
            if (inputEl) {
                inputEl.value = msg;
                inputEl.dispatchEvent(new Event('input'));
                // Автоотправка
                const sendBtn = document.getElementById('sendBtn');
                if (sendBtn) sendBtn.click();
            }
        }


        window.showModuleTooltip = function(el, mod) {
            hideModuleTooltip(el);
            const tip = document.createElement('div');
            tip.className = 'module-tooltip';
            tip.innerHTML = `
                <h4>${mod.icon} ${mod.name}</h4>
                <p>${escapeHtml(mod.desc)}</p>
                <ul>${mod.keys.map(k => `<li>${escapeHtml(k)}</li>`).join('')}</ul>
            `;
            el.style.position = 'absolute';
            el.appendChild(tip);
        };
        window.hideModuleTooltip = function(el) {
            const tip = el.querySelector('.module-tooltip');
            if (tip) tip.remove();
        };

        window.requestFileRead = function(filePath, label) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                renderSystemMessage('⚠️ Нет подключения к серверу. Переподключитесь.');
                return;
            }
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-tab="chat"]').classList.add('active');
            document.getElementById('tab-chat').classList.add('active');
            renderSystemMessage(`◈ Запрашиваю у СР чтение файла: <code style="font-family:var(--mono);font-size:11px;background:var(--surface-2);padding:2px 6px;border-radius:3px;">${escapeHtml(filePath)}</code>`);
            ws.send(JSON.stringify({
                type: 'read_file_request',
                path: filePath,
                label: label || filePath,
                session_id: 'main'
            }));
        };

        // ==================== ПАТЧИ ====================
        function openPatchModal() { document.getElementById('patchModal').classList.add('active'); }
        function closePatchModal() {
            document.getElementById('patchModal').classList.remove('active');
            currentPatch = null;
            document.getElementById('confirmPatchBtn').disabled = true;
            document.getElementById('patchPreviewContent').textContent = 'загрузите JSON-патч...';
        }
        function confirmPatch() {
            if (!currentPatch || !ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify({ type: 'apply_patch', patch: JSON.parse(currentPatch), session_id: 'main' }));
                closePatchModal();
                showToast('◈ патч отправлен', 'success');
                renderSystemMessage('◈ применение патча...');
            } catch(e) {
                showToast('◈ ошибка патча', 'error');
            }
        }
        function handlePatchResult(results) {
            results.forEach(r => renderSystemMessage(`◈ ${r.status==='success'?'✓':'✗'} ${r.file||r.module}: ${r.message}`));
        }
        function handlePatchPreview(data) {
            const diffLines = data.diff || [];
            const file = data.file || 'unknown';
            const success = data.success !== false;
            let previewText = `**📊 Diff Preview: ${file}**\n\n`;
            if (diffLines.length === 0) {
                previewText += '_Изменений не обнаружено_\n';
            } else {
                previewText += '```diff\n' + diffLines.join('\n') + '\n```\n';
            }
            if (data.applied && data.applied.length > 0) {
                previewText += `\n✅ Применено операций: ${data.applied.length}\n`;
            }
            if (data.failed && data.failed.length > 0) {
                previewText += `\n❌ Ошибок: ${data.failed.length}\n`;
                data.failed.forEach(f => { previewText += `  • ${f.op} ${f.path}: ${f.error}\n`; });
            }
            renderAssistantMessage(previewText, true);
            if (!success) showToast(`◈ Патч ${file} содержит ошибки`, 'error');
            else showToast(`◈ Diff подготовлен для ${file}`, 'success');
        }

        // ==================== TOAST ====================
        function showToast(msg, type='success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==================== НАСТРОЙКИ ====================
        function setupKeyboard() {
            inputEl.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            inputEl.addEventListener('input', autoHeight);
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`tab-${tabName}`).classList.add('active');
                    if (tabName === 'files') loadFileTree();
                    if (tabName === 'map') loadMap();
                });
            });
        }

        // Анимация цветка
        function animateFlowerGradient() {
            const grad = document.getElementById('livingGradient');
            if (!grad) return;
            let angle = 0;
            function step() {
                angle += 0.005;
                const x = 0.5 + 0.5 * Math.sin(angle);
                const y = 0.5 + 0.5 * Math.cos(angle);
                grad.setAttribute('x1', x);
                grad.setAttribute('y1', y);
                grad.setAttribute('x2', 1 - x);
                grad.setAttribute('y2', 1 - y);
                requestAnimationFrame(step);
            }
            step();
        }

        // ═══════════════════════════════════════
        // ЗАЩИТА ПАРОЛЕМ
        // ═══════════════════════════════════════
        // Пароль хранится только в виде SHA-256 хэша
        const _PH = 'dc9b4153769a6fb649dbd132c70d67825e3d93e2ca83aeaed3ee5d357ce19af8';

        async function _hash(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Обновляем гліфи
        function pwUpdateSlots(val) {
            const glyphs = document.getElementById('pwGlyphs');
            if (!glyphs) return;
            for (let i = 0; i < 10; i++) {
                const slot = document.getElementById('pwSlot' + i);
                if (!slot) continue;
                slot.classList.remove('empty','filled','cursor');
                if (i < val.length) {
                    slot.classList.add('filled');
                } else if (i === val.length) {
                    slot.classList.add('empty','cursor');
                } else {
                    slot.classList.add('empty');
                }
            }
            if (glyphs) glyphs.classList.toggle('active', val.length > 0);
        }

        async function pwHandleInput(val) {
            pwUpdateSlots(val);
            if (val.length < 8) return;
            const h = await _hash(val);
            if (h === _PH) {
                sessionStorage.setItem('_ma', '1');
                const screen = document.getElementById('passwordScreen');
                screen.style.opacity = '0';
                setTimeout(() => screen.classList.add('hidden'), 750);
            } else if (val.length >= 10) {
                const glyphs = document.getElementById('pwGlyphs');
                const err    = document.getElementById('pwError');
                const inp    = document.getElementById('pwInput');
                if (glyphs) glyphs.classList.add('error');
                if (err)    err.classList.add('show');
                setTimeout(() => {
                    if (glyphs) glyphs.classList.remove('error');
                    if (err)    err.classList.remove('show');
                    inp.value = '';
                    pwUpdateSlots('');
                }, 900);
            }
        }

        // Тултипы карточек сот
        function hcShowTip(card) {
            const tip = card.querySelector('.hc-tooltip');
            if (tip) { tip.classList.add('show'); }
        }
        function hcHideTip(card) {
            const tip = card.querySelector('.hc-tooltip');
            if (tip) { tip.classList.remove('show'); }
        }

        function _checkAccess() {
            if (sessionStorage.getItem('_ma') !== '1') {
                document.getElementById('passwordScreen').classList.remove('hidden');
                setTimeout(() => {
                    const inp = document.getElementById('pwInput');
                    if (inp) { inp.focus(); pwUpdateSlots(''); }
                }, 120);
            } else {
                document.getElementById('passwordScreen').classList.add('hidden');
            }
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function init() {
            _checkAccess();
            loadMessages();
            connect();
            setupTabs();
            setupKeyboard();
            setupDragDrop();
            animateFlowerGradient();
        }

        init();
    </script>
</body>
</html>
