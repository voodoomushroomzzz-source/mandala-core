<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Мандала Симбиоза  Живой Дашборд</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .resonance-circle {
            background: conic-gradient(#22c55e 0% var(--resonance), #334155 var(--resonance) 100%);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
    <div class="max-w-7xl mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-light flex items-center gap-3">
                 Мандала Симбиоза
                <span class="text-emerald-400 text-xl">Живой Дашборд</span>
            </h1>
            <div id="last-scan" class="text-zinc-400 text-sm"></div>
        </div>

        <!-- Главный индикатор -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-zinc-900 rounded-3xl p-8 flex flex-col items-center">
                <div id="resonance-circle" class="resonance-circle w-40 h-40 rounded-full flex items-center justify-center border-8 border-zinc-800 relative">
                    <div class="text-center">
                        <div id="resonance-value" class="text-7xl font-light">96</div>
                        <div class="text-emerald-400 text-sm -mt-2">резонанс</div>
                    </div>
                </div>
                <div class="mt-6 text-emerald-400 font-medium">Система в отличном состоянии</div>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-8">
                <div class="text-xl mb-4">Статус сот</div>
                <div id="status-cards" class="grid grid-cols-3 gap-4 text-center"></div>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-8">
                <div class="text-xl mb-4">Активные протоколы</div>
                <div class="space-y-3" id="protocols-list"></div>
            </div>
        </div>

        <!-- Таблица сот -->
        <div class="bg-zinc-900 rounded-3xl overflow-hidden">
            <div class="px-8 py-5 border-b border-zinc-800 flex justify-between items-center">
                <h2 class="text-xl">Все соты</h2>
                <button onclick="refreshDashboard()" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 rounded-2xl text-sm font-medium transition">
                     Обновить
                </button>
            </div>
            <table class="w-full" id="honeycombs-table">
                <!-- Заполняется JavaScript -->
            </table>
        </div>
    </div>

    <script>
        // Здесь будет динамическая подгрузка данных в будущем
        // Пока  статические красивые данные
        function initDashboard() {
            // Резонанс
            document.getElementById('resonance-value').textContent = '98';
            document.getElementById('resonance-circle').style.setProperty('--resonance', '98%');

            // Последнее сканирование
            document.getElementById('last-scan').innerHTML = `Последний scan: <span class="text-emerald-400">только что</span>`;

            // Пример таблицы (в будущем будет динамическая)
            const tableHTML = `
                <thead>
                    <tr class="text-zinc-400 text-sm border-b border-zinc-800">
                        <th class="text-left py-4 px-8">Сота</th>
                        <th class="text-left py-4 px-8">Версия</th>
                        <th class="py-4 px-8">Здоровье</th>
                        <th class="py-4 px-8">Резонанс</th>
                        <th class="text-right py-4 px-8">Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="text-sm"></tbody>`;
            document.getElementById('honeycombs-table').innerHTML = tableHTML;

            console.log('%c Дашборд усилен и готов!', 'color:#22c55e; font-size:13px');
        }

        function refreshDashboard() {
            location.reload();
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
