<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala  Engineer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <div class="logo"> Mandala</div>
        <div class="proto-bar">
            <button onclick="activateProtocol('internal/onboarding')">ON</button>
            <button onclick="activateProtocol('internal/registry_sync')">SYNC</button>
            <button onclick="activateProtocol('internal/ideas_roadmaps')">IDEAS</button>
            <button onclick="activateProtocol('deep_analysis')">DEEP</button>
        </div>
        <div class="status">
            <button id="clearHistoryBtn" class="proto-btn" title="Очистить историю">DEL</button>
            <span class="dot" id="statusDot"></span>
            <span id="coreVersion"></span>
        </div>
    </header>
    <main>
        <div class="messages" id="messages"></div>
        <div class="thinking hidden" id="thinking">
            <span class="thinking-text">СР думает</span>
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </main>
    <footer class="input-bar">
        <input type="text" id="messageInput" placeholder="Впиши волну" autofocus>
        <button id="sendBtn"></button>
    </footer>
    <script>
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        let ws = null;
        let currentMessageDiv = null;
        let messageBuffer = '';
        let chatHistory = [];
        
        // Загрузка истории из localStorage
        function loadHistory() {
            const saved = localStorage.getItem('mandala_chat_history');
            if (saved) {
                try {
                    chatHistory = JSON.parse(saved);
                    const messagesEl = document.getElementById('messages');
                    messagesEl.innerHTML = '';
                    chatHistory.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `msg ${msg.role}`;
                        const bubble = document.createElement('div');
                        bubble.className = 'bubble';
                        bubble.innerHTML = msg.role === 'user' ? msg.content : formatMessage(msg.content);
                        div.appendChild(bubble);
                        messagesEl.appendChild(div);
                    });
                } catch(e) { console.error('History load error:', e); }
            }
        }
        
        // Сохранение истории
        function saveHistory() {
            localStorage.setItem('mandala_chat_history', JSON.stringify(chatHistory));
        }
        
        // Очистка истории
        function clearHistory() {
            chatHistory = [];
            localStorage.removeItem('mandala_chat_history');
            document.getElementById('messages').innerHTML = '';
        }
        
        function connect() {
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { updateStatus('connected'); ws.send(JSON.stringify({type:'init',session_id:'main'})); };
            ws.onclose = () => { updateStatus('error'); setTimeout(connect, 3000); };
            ws.onmessage = (e) => { const data = JSON.parse(e.data); handleMessage(data); };
        }
        
        function updateStatus(state) {
            const dot = document.getElementById('statusDot');
            dot.className = 'dot' + (state === 'connected' ? '' : state === 'connecting' ? ' connecting' : ' error');
        }
        
        function showThinking() {
            document.getElementById('thinking').classList.remove('hidden');
        }
        
        function hideThinking() {
            document.getElementById('thinking').classList.add('hidden');
        }
        
        function stripMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '$1')
                .replace(/\*(.+?)\*/g, '$1')
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`(.+?)`/g, '$1');
        }
        
        function formatMessage(text) {
            return text
                .replace(/\n/g, '<br>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/---/g, '<hr>');
        }
        
        function handleMessage(data) {
            if (data.type === 'connected') {
                document.getElementById('coreVersion').textContent = data.core_version || '';
            }
            if (data.type === 'model_start') {
                showThinking();
            }
            if (data.type === 'stream') {
                hideThinking();
                if (!currentMessageDiv) {
                    currentMessageDiv = addMessage('assistant', '', false);
                }
                messageBuffer += data.content;
                currentMessageDiv.querySelector('.bubble').innerHTML = formatMessage(messageBuffer);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
            if (data.type === 'done' || data.type === 'model_done') {
                hideThinking();
                if (currentMessageDiv) {
                    const bubble = currentMessageDiv.querySelector('.bubble');
                    const cleanText = stripMarkdown(messageBuffer);
                    bubble.innerHTML = formatMessage(cleanText);
                    chatHistory.push({ role: 'assistant', content: cleanText });
                    saveHistory();
                }
                currentMessageDiv = null;
                messageBuffer = '';
            }
            if (data.type === 'system') {
                addMessage('system', data.text, true);
            }
        }
        
        function addMessage(role, content, save = true) {
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = role === 'user' ? content : formatMessage(content);
            msg.appendChild(bubble);
            document.getElementById('messages').appendChild(msg);
            if (save && (role === 'user' || role === 'system')) {
                chatHistory.push({ role, content });
                saveHistory();
            }
            return msg;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type:'ask', text, session_id:'main'}));
            }
            input.value = '';
        }
        
        function activateProtocol(name) {
            const input = document.getElementById('messageInput');
            input.value = `активируй протокол ${name.replace(/_/g,' ')}`;
            sendMessage();
        }
        
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { sendMessage(); }
        });
        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            if (confirm('Очистить историю чата?')) { clearHistory(); }
        });
        
        loadHistory();
        connect();
    </script>
</body>
</html>
