<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala  Engineer</title>
    <link rel="stylesheet" href="style.css?v=20260410">
</head>
<body>
    <header class="toolbar">
        <div class="logo"> Mandala</div>
        <div class="proto-bar">
            <button onclick="activateProtocol('internal/onboarding')">ON</button>
            <button onclick="activateProtocol('internal/registry_sync')">SYNC</button>
            <button onclick="activateProtocol('internal/ideas_roadmaps')">IDEAS</button>
            <button onclick="activateProtocol('deep_analysis')">DEEP</button>
        </div>
        <div class="status">
            <button id="clearHistoryBtn" class="proto-btn" title="Очистить историю">DEL</button>
            <span class="dot" id="statusDot"></span>
            <span id="coreVersion"></span>
        </div>
    </header>
    <main>
        <div class="messages" id="messages"></div>
        <div class="thinking hidden" id="thinking">
            <span class="thinking-text">СР думает</span>
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </main>
    <footer class="input-bar">
        <input type="text" id="messageInput" placeholder="Впиши волну" autofocus>
        <button id="sendBtn"></button>
    </footer>
    <script>
        const WS_URL = 'wss://mandala-engineer-chat.onrender.com/ws';
        let ws = null;
        let currentMsgDiv = null;
        let messageBuffer = '';
        let chatHistory = [];
        
        function loadHistory() {
            const saved = localStorage.getItem('mandala_chat_history');
            if (saved) {
                try {
                    chatHistory = JSON.parse(saved);
                    const msgs = document.getElementById('messages');
                    msgs.innerHTML = '';
                    chatHistory.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'msg ' + item.role;
                        div.innerHTML = item.role === 'user' ? item.content : formatMessage(item.content);
                        msgs.appendChild(div);
                    });
                } catch(e) {}
            }
        }
        
        function saveHistory() {
            localStorage.setItem('mandala_chat_history', JSON.stringify(chatHistory));
        }
        
        function clearHistory() {
            chatHistory = [];
            localStorage.removeItem('mandala_chat_history');
            document.getElementById('messages').innerHTML = '';
        }
        
        function connect() {
            updateStatus('connecting');
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { updateStatus('connected'); ws.send(JSON.stringify({type:'init',session_id:'main'})); };
            ws.onclose = () => { updateStatus('error'); setTimeout(connect, 3000); };
            ws.onmessage = (e) => { const data = JSON.parse(e.data); handleMessage(data); };
        }
        
        function updateStatus(state) {
            const dot = document.getElementById('statusDot');
            dot.className = 'dot' + (state === 'connected' ? '' : state === 'connecting' ? ' connecting' : ' error');
        }
        
        function showThinking() { document.getElementById('thinking').classList.remove('hidden'); }
        function hideThinking() { document.getElementById('thinking').classList.add('hidden'); }
        
        function stripMarkdown(text) {
            return text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1').replace(/```[\s\S]*?```/g, '').replace(/`(.+?)`/g, '$1');
        }
        
        function formatMessage(text) {
            return text.replace(/\n/g, '<br>').replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>').replace(/^- (.+)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>').replace(/---/g, '<hr>');
        }
        
        function handleMessage(data) {
            if (data.type === 'connected') document.getElementById('coreVersion').textContent = data.core_version || '';
            if (data.type === 'model_start') showThinking();
            if (data.type === 'stream') {
                hideThinking();
                if (!currentMsgDiv) { currentMsgDiv = addMessage('assistant', '', false); }
                messageBuffer += data.content;
                currentMsgDiv.innerHTML = formatMessage(messageBuffer);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
            if (data.type === 'done' || data.type === 'model_done') {
                hideThinking();
                if (currentMsgDiv) {
                    const clean = stripMarkdown(messageBuffer);
                    currentMsgDiv.innerHTML = formatMessage(clean);
                    chatHistory.push({ role: 'assistant', content: clean });
                    saveHistory();
                }
                currentMsgDiv = null;
                messageBuffer = '';
            }
            if (data.type === 'system') { addMessage('system', data.text, true); }
        }
        
        function addMessage(role, content, save = true) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = role === 'user' ? content : formatMessage(content);
            document.getElementById('messages').appendChild(div);
            if (save && (role === 'user' || role === 'system')) { chatHistory.push({ role, content }); saveHistory(); }
            return div;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ask', text, session_id:'main'}));
            input.value = '';
        }
        
        function activateProtocol(name) {
            document.getElementById('messageInput').value = `активируй протокол ${name.replace(/_/g,' ')}`;
            sendMessage();
        }
        
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        document.getElementById('clearHistoryBtn').addEventListener('click', () => { if (confirm('Очистить историю?')) clearHistory(); });
        
        loadHistory();
        connect();
    </script>
</body>
</html>
